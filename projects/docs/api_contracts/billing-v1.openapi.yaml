openapi: 3.1.0
info:
  title: SaaS Service Billing Legacy API Baseline
  version: 0.5.3
  description: >-
    Draft, non-implementable projection of 60 legacy Billing HTTP operations extracted
    from Spring MVC controllers. Version 0.3.0 refines the public Stripe webhook; version 0.4.0
    refines all 26 P3 catalog-administration operations against controller, port, domain,
    dedicated RFC 9457 handler and strict frontend consumer schemas; version 0.5.0 refines
    all 32 P4 tenant Billing/integration operations covering provider sessions, invoice reads,
    quotes/agreements/amendments and governed Billing runs. It records observed
    code and unresolved design gaps; it is not approval of the current behavior. Every
    x-open-questions item must be resolved from an approved requirement, use case, ADR or owner
    decision before any operation is promoted to Active. Version 0.5.3 materializes only the
    approved Super Admin invoice authorization boundary; wire/error/compatibility questions and
    the file-level Draft state remain blocking.
x-document-metadata:
  documentId: BILLING-V1
  primaryNature: Contrato
  owner: Arquitetura, Backend e Qualidade
  status: Draft
  date: 2026-09-10
  lastReviewed: 2026-09-12
  normativeBaseline: TP-00052 v1.32, ANL-00055 v1.29, ANL-00056 v1.30, ANL-00057 v1.0, PRD-00005 v1.36, REQ-00054 v1.24 and UC-00050 v1.10; non-authorization operation-level sources remain required
  relatedFiles:
    - docs/delivery/plans/TP-00052-backend-api-contract-baseline.md
    - docs/analysis/ANL-00055-backend-api-contract-coverage-inventory.md
    - docs/analysis/ANL-00057-frontend-backend-api-contract-catalog.md
    - docs/analysis/ANL-00056-api-contract-validation-loop.md
    - docs/agents/standards/api-client-standard.md
    - docs/product/prds/PRD-00005-identity-access-governance.md
    - docs/product/requirements/REQ-00054-super-admin-unified-billing-price-version.md
    - docs/product/use-cases/UC-00050-super-admin-billing-preview-invoice-close.md
    - docs/delivery/plans/implementation_plans/backend/IP-BE-13.3.3.1-super-admin-invoice-rbac-hardening.md
x-contract-status: Draft
x-implementation-authorization: blocked
x-extraction-baseline:
  date: 2026-09-10
  source: Spring MVC controllers, SecurityConfig, method security and shared HTTP handlers
  controllers: 7
  operations: 63
  canonicalOperations: 60
  supersededOperations: 3
  caveat: Initial extraction counted 63; three operations are retained only as x-superseded history after promotion to Active contracts. Code is evidence of current behavior, not an approved source of product intent.
x-billing-catalog-observed-contract:
  scope: Global seller-owned Product, PriceVersion, Offer and Approval administration; every actor must be a human principal with the operation-specific authority.
  representation: Strict BILLING_CATALOG_V2 pages and closed resource records; PRICE_SIMULATION_V1 for deterministic price simulation.
  cache: Every success and dedicated failure sets Cache-Control no-store; single resources and mutations also emit a strong quoted decimal ETag from revision.
  concurrency: Mutations of existing resources require If-Match with a strong decimal ETag; a mismatch is HTTP 409 BILLING_VERSION_CONFLICT.
  idempotency: Commands require an untrimmed, nonblank Idempotency-Key of at most 160 characters; same-key/same-intent replays converge and a different intent is HTTP 409.
  lifecycle: Product, price and offer versions are DRAFT, PUBLISHED or RETIRED; published/retired versions require successors rather than in-place editing.
  approval: Price/offer publish and retirement use submit -> independent decision -> one-time sealed execution; approval seals and fresh MFA have 15-minute windows, subject to the explicit temporary-waiver policy.
  errors: Dedicated application/problem+json responses use RFC 9457 fields plus timestamp, traceId, errorCode, i18nKey and legacy alias code.
  consumer: frontend/src/services/billingManagementService.ts validates closed responses with frontend/src/schemas/billingManagementSchemas.ts and always uses platform tenant context.
x-billing-catalog-approval-blockers:
  - Bind the 26 operations to the applicable Validated PRD/requirements and approve product lifecycle, price/offer constraints and public compatibility.
  - Approve authority grants, raw global Super Admin boundary, human-principal requirement, independent decision/MFA waiver and audit evidence.
  - Prove controller/use-case/store/frontend positive and negative parity for schemas, ETag, no-store, idempotency, concurrency and every RFC 9457 variant on version 0.4.0.
x-billing-p4-observed-contract:
  scope: Tenant-scoped provider sessions, legacy Billing read models, commercial invoices, elevated-context revocation, contracts, quotes, amendments and invoice runs.
  tenantBoundary: Contract/run/document and newer legacy-read operations revalidate the path tenant against an effective tenant or authorized human Super Admin context; financial operations additionally require an unexpired X-Billing-Context-ID. Checkout and portal currently pass the path tenant directly without a visible TenantContext scope guard.
  representation: Closed provider-session, invoice, quote, agreement, amendment and run schemas are observed from Java records and, where present, strict frontend Zod schemas; integer monetary quantities remain strings at the wire boundary.
  cacheAndRevision: Contract/run/elevated-context/document and legacy read successes use Cache-Control no-store where emitted; versioned resources emit a strong quoted decimal ETag. Checkout and portal responses currently omit no-store.
  concurrencyAndReplay: Contract/run mutations require a strong If-Match and Idempotency-Key; invoice generation requires Idempotency-Key. Replays, revision conflicts and state conflicts are material protocol outcomes.
  errors: Contract/run/context controllers use sanitized RFC 9457 ProblemDetail handlers. BillingController has a richer invoice ProblemDetail. BillingInvoiceDocumentController is absent from both dedicated advice target lists, so its domain exceptions may become generic 500.
  consumers: Contract/run/invoice-document and legacy read responses are validated by frontend/src/services/billingManagementService.ts or billingService.ts and their Zod schemas. Checkout/portal frontend methods are deliberately unavailable and do not currently call the backend.
x-billing-p4-approval-blockers:
  - Bind all 32 operations to applicable Validated product/security sources and approve authority grants, tenant impersonation, financial-context lifetime/purpose, lifecycle and provider redirect policy.
  - Reconcile checkout/portal dormant consumers and provider URL allowlists; decide no-store, idempotency, egress, timeout, retry and provider-error compatibility.
  - Prove positive and negative parity for strict schemas, monetary strings, ETag, If-Match, idempotency, no-store, RFC 9457 codes, tenant boundary, SoD/approval seals and the invoice-document advice gap.
x-invoice-super-admin-rbac-decision:
  status: resolved-product-and-security-boundary-contract-still-draft
  owner: Produto, Billing e Segurança
  decisionDate: 2026-09-12
  sources:
    - PRD-00005 v1.36 F-IAM-011
    - REQ-00054 v1.24 AC-049/050/053/055/061/066 and BR-039/042
    - UC-00050 v1.10 main flow, E6b and RBAC focal matrix
    - ADR-0050 v1.10 D-01.1/D-13.3/D-13.5
  invoiceBoundary: >-
    Every BILLING_INVOICE_* issuance and use requires a HUMAN principal,
    ROLE_SUPER_ADMIN, BILLING_TENANT_IMPERSONATE, the exact operation authority,
    an active effective tenant and a server-issued context whose actor, tenant,
    purpose and authority match. A tenant role or invoice authority in isolation
    is forbidden before the application port or tenant store, as applicable.
  directTenantContractBoundary: >-
    issueForTenant remains available only for the existing tenant contractual
    journey and does not gain invoice authority; direct acceptance by the tenant
    representative remains governed by REQ-00054 AC-046.
  releaseZeroCompatibility: >-
    /api/v1/tenants/{tenantId}/billing/invoices and the /billing/invoices frontend
    destination are unchanged by this authorization slice.
  operationsInThisDraft:
    - issueForAdmin
    - issueForTenant
    - billingInvoiceDocumentList
    - billingInvoiceDocumentGet
    - billingRunList
    - create
    - billingRunGet
    - prepare
    - preview
    - finalizeRun
  externalActiveOperation: >-
    billingRunApprove is canonical in Billing Super Admin Decisions v1 Active
    1.1.0 and still requires an authorization-compatible version before software
    may change.
  implementationAuthorization: blocked-until-all-affected-operations-are-active
