      x-contract-priority: 2
      x-priority-basis: "Public endpoint or inbound webhook."
      x-source-controller: "backend/src/main/java/br/com/duoset/saas_service/contexts/billing/internal/presentation/rest/StripeWebhookController.java:21"
      x-source-method: "StripeWebhookController.handleWebhook"
