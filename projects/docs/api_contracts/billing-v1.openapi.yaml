  /api/v1/webhooks/stripe:
    post:
      operationId: handleWebhook
      tags: [StripeWebhookController]
      summary: Accept a signed Stripe webhook event
      description: >-
        Accepts the raw Stripe JSON payload and required Stripe-Signature header, validates both with
        the configured Stripe webhook secret, then atomically claims the provider event id in Redis
        for 30 days. A duplicate valid event is acknowledged without reprocessing. The current use
        case claims before any future domain update and currently performs no event-type state change.
