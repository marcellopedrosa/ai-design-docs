        priceVersion: {type: integer, format: int64, minimum: 1}
        productId: {type: string, format: uuid}
        productVersion: {type: integer, format: int64, minimum: 1}
        status: {type: string, enum: [DRAFT, PUBLISHED, RETIRED]}
        amountMinor: {type: string, pattern: '^(0|[1-9][0-9]{0,15})$'}
        currency: {type: string, const: BRL}
        minorUnitExponent: {type: integer, const: 2}
        cadence: {type: string, enum: [MONTHLY, ANNUAL, ONE_TIME]}
        chargeTiming: {type: string, const: IN_ADVANCE}
        priceModel: {type: string, const: FIXED}
        audience: {type: string, enum: [PUBLIC_CATALOG, TENANT_RESTRICTED]}
        audienceTenantId: {type: [string, 'null'], format: uuid}
        contentHash: {$ref: '#/components/schemas/CatalogHash'}
        publicationHash: {anyOf: [{$ref: '#/components/schemas/CatalogHash'}, {type: 'null'}]}
        effectiveFrom: {type: [string, 'null'], format: date-time}
        effectiveUntil: {type: [string, 'null'], format: date-time}
        revision: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
        createdBy: {type: string}
        publishedAt: {type: [string, 'null'], format: date-time}
    CatalogOffer:
      type: object
      additionalProperties: false
      required: [offerId, offerVersion, offerCode, catalogVersion, displayOrder, highlighted, status, contentHash, publicationHash, effectiveFrom, effectiveUntil, revision, createdAt, createdBy, publishedAt, items, entitlements]
      properties:
        offerId: {type: string, format: uuid}
        offerVersion: {type: integer, format: int64, minimum: 1}
        offerCode: {type: string}
        catalogVersion: {type: string}
        displayOrder: {type: integer}
        highlighted: {type: boolean}
        status: {type: string, enum: [DRAFT, PUBLISHED, RETIRED]}
        contentHash: {$ref: '#/components/schemas/CatalogHash'}
        publicationHash: {anyOf: [{$ref: '#/components/schemas/CatalogHash'}, {type: 'null'}]}
        effectiveFrom: {type: [string, 'null'], format: date-time}
        effectiveUntil: {type: [string, 'null'], format: date-time}
        revision: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
        createdBy: {type: string}
        publishedAt: {type: [string, 'null'], format: date-time}
        items: {type: array, items: {$ref: '#/components/schemas/CatalogOfferItem'}}
        entitlements: {type: array, items: {$ref: '#/components/schemas/CatalogOfferEntitlement'}}
    CatalogOfferItem:
      type: object
      additionalProperties: false
      required: [itemCode, itemRole, productId, productVersion, priceVersionId, priceVersion, priceContentHash, required, displayOrder]
      properties:
        itemCode: {type: string}
        itemRole: {type: string, enum: [BASE_PLAN, ELIGIBLE_ADD_ON]}
        productId: {type: string, format: uuid}
        productVersion: {type: integer, format: int64, minimum: 1}
        priceVersionId: {type: string, format: uuid}
        priceVersion: {type: integer, format: int64, minimum: 1}
        priceContentHash: {$ref: '#/components/schemas/CatalogHash'}
        required: {type: boolean}
        displayOrder: {type: integer}
    CatalogOfferEntitlement:
      type: object
      additionalProperties: false
      required: [capabilityCode, displayOrder, valueKind, quantity, unit]
      properties:
        capabilityCode: {type: string}
        displayOrder: {type: integer}
        valueKind: {type: string, enum: [FINITE, UNLIMITED, CONTRACT_DEFINED, NOT_APPLICABLE, ENABLED, DISABLED]}
        quantity: {type: [string, 'null'], pattern: '^(0|[1-9][0-9]{0,37})$'}
        unit: {type: [string, 'null']}
    CatalogApproval:
      type: object
      additionalProperties: false
      required: [approvalId, action, resourceType, resourceId, resourceVersion, contentHash, payloadHash, makerSubject, makerHumanPrincipalId, checkerSubject, status, revision, createdAt, decidedAt, sealExpiresAt, consumedAt]
      properties:
        approvalId: {type: string, format: uuid}
        action: {type: string, enum: [PUBLISH_PRICE, PUBLISH_OFFER, RETIRE_PRICE, RETIRE_OFFER]}
        resourceType: {type: string, enum: [PRICE_VERSION, OFFER_VERSION]}
        resourceId: {type: string, format: uuid}
        resourceVersion: {type: integer, format: int64, minimum: 1}
        contentHash: {$ref: '#/components/schemas/CatalogHash'}
        payloadHash: {$ref: '#/components/schemas/CatalogHash'}
        makerSubject: {type: string}
        makerHumanPrincipalId: {type: string}
        checkerSubject: {type: [string, 'null']}
        status: {type: string, enum: [AWAITING_INDEPENDENT_APPROVAL, APPROVED, REJECTED, CONSUMED, EXPIRED, REVOKED]}
        revision: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
        decidedAt: {type: [string, 'null'], format: date-time}
        sealExpiresAt: {type: [string, 'null'], format: date-time}
        consumedAt: {type: [string, 'null'], format: date-time}
    PriceSimulation:
      type: object
      additionalProperties: false
      required: [schemaVersion, priceVersionId, priceVersion, priceContentHash, inputHash, resultHash, lines, total]
      properties:
        schemaVersion: {type: string, const: PRICE_SIMULATION_V1}
        priceVersionId: {type: string, format: uuid}
        priceVersion: {type: integer, format: int64, minimum: 1}
        priceContentHash: {$ref: '#/components/schemas/CatalogHash'}
        inputHash: {$ref: '#/components/schemas/CatalogHash'}
        resultHash: {$ref: '#/components/schemas/CatalogHash'}
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [lineNumber, componentId, priceModel, amountMinor, currency]
            properties:
              lineNumber: {type: integer, minimum: 1}
              componentId: {type: string}
              priceModel: {type: string, const: FIXED}
              amountMinor: {type: string, pattern: '^(0|[1-9][0-9]{0,15})$'}
              currency: {type: string, const: BRL}
        total:
          type: object
          additionalProperties: false
          required: [amountMinor, currency]
          properties:
            amountMinor: {type: string, pattern: '^(0|[1-9][0-9]{0,15})$'}
            currency: {type: string, const: BRL}
    CatalogHash:
      type: string
      pattern: '^[a-f0-9]{64}$'
    StripeWebhookGatewayError:
      type: object
      additionalProperties: false
      required: [message, service, errorId]
      properties:
        message: {type: string, const: Serviço externo temporariamente indisponível.}
        service: {type: string, const: STRIPE}
        errorId: {type: string, format: uuid}
    BillingElevatedContextAdminIssue:
      type: object
      additionalProperties: true
      description: >-
        Observed admin issuance request. Unknown members are ignored by the current
        Jackson boundary; allowedAuthorities must all belong to one closed context family.
      required: [tenantId, purpose, allowedAuthorities]
      properties:
        tenantId:
          type: string
          format: uuid
        purpose:
          type: string
          minLength: 1
          maxLength: 160
          description: Leading/trailing whitespace and ISO control characters are rejected by the use case.
        allowedAuthorities:
          $ref: '#/components/schemas/BillingContextAuthorities'
    BillingElevatedContextTenantIssue:
      type: object
      additionalProperties: true
      description: >-
        Observed tenant issuance request. Unknown members are ignored by the current
        Jackson boundary; the path tenant is enforced before issuance and raw Super Admin is denied.
      required: [purpose, allowedAuthorities]
      properties:
        purpose:
          type: string
          minLength: 1
          maxLength: 160
          description: Leading/trailing whitespace and ISO control characters are rejected by the use case.
        allowedAuthorities:
          $ref: '#/components/schemas/BillingContextAuthorities'
    BillingContextAuthorities:
      type: array
      minItems: 1
      uniqueItems: true
      description: >-
        Every value must belong to exactly one family: contract, invoice or provider-interaction read.
        BILLING_TENANT_IMPERSONATE authorizes the admin route itself and is not an issuable context authority.
      items:
        type: string
        enum: [BILLING_CONTRACT_DRAFT, BILLING_CONTRACT_SUBMIT, BILLING_CONTRACT_ACCEPT, BILLING_CONTRACT_ACCEPT_RECORD, BILLING_CONTRACT_ACCEPT_VALIDATE, BILLING_INVOICE_PREVIEW, BILLING_INVOICE_APPROVE, BILLING_INVOICE_FINALIZE, BILLING_PROVIDER_INTERACTION_READ]
    BillingElevatedContext:
      type: object
      additionalProperties: false
      description: >-
        Observed ContextResult. mfaExpiresAt is non-null exactly when mfaRequired is true;
        allowedAuthorities belong to exactly one closed Billing family.
      required: [schemaVersion, contextId, tenantId, actorSubject, humanPrincipalId, purpose, allowedAuthorities, mfaRequired, issuedAt, expiresAt, idleExpiresAt, mfaExpiresAt, revokedAt, revision]
      properties:
        schemaVersion:
          type: string
          const: BILLING_ELEVATED_CONTEXT_V2
        contextId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        actorSubject:
          type: string
          minLength: 1
          maxLength: 160
        humanPrincipalId:
          type: string
          minLength: 1
          maxLength: 160
        purpose:
          type: string
          minLength: 1
          maxLength: 160
        allowedAuthorities:
          $ref: '#/components/schemas/BillingContextAuthorities'
        mfaRequired:
          type: boolean
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        idleExpiresAt:
          type: string
          format: date-time
        mfaExpiresAt:
          type: [string, 'null']
          format: date-time
        revokedAt:
          type: [string, 'null']
          format: date-time
        revision:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
    BillingContextProblem:
      type: object
      additionalProperties: false
      description: Observed RFC 9457 ProblemDetail emitted by BillingFinancialContextExceptionHandler.
      required: [type, title, status, detail, instance, code]
      properties:
        type:
          type: string
          format: uri
          pattern: '^https://hub-contabil\\.com/errors/billing-'
        title:
          type: string
          const: Falha no contexto financeiro
        status:
          type: integer
          enum: [400, 403, 409, 422]
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          enum: [BILLING_CONTEXT_INVALID_REQUEST, BILLING_MFA_REQUIRED, BILLING_CONTEXT_INVALID, BILLING_CONTEXT_IDEMPOTENCY_CONFLICT, BILLING_TENANT_UNAVAILABLE]
    LegacyError:
      type: object
      description: Observed non-RFC-9457 envelope; variants remain a blocking review item.
      additionalProperties: true
      required: [message]
      properties:
        message:
          type: string
        errorId:
          type: string
          format: uuid
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
      x-schema-review: required
    LegacySecurityError:
      type: object
      description: Observed default security envelope; specialized path handlers may differ.
      additionalProperties: true
      required: [error, message, status, timestamp, path]
      properties:
        error:
          type: string
        message:
          type: string
        status:
          type: integer
        timestamp:
          type: string
          format: date-time
        path:
          type: string
      x-schema-review: required
    Problem:
      type: object
      description: Target Problem Details shape governed by RFC 9457; not claimed as current legacy behavior.
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
