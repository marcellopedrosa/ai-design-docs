components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    BillingRevisionEtag:
      description: Strong quoted decimal revision emitted from the returned resource revision.
      schema:
        type: string
        pattern: '^"(?:0|[1-9]\\d*)"$'
    NoStore:
      description: The current controller prevents storage of sensitive Billing representations and errors.
      schema:
        type: string
        const: no-store
  responses:
    BillingCatalogBadRequest:
      description: Invalid binding, DTO, ETag, idempotency key, enum, amount, purpose, pagination or domain input.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/BillingCatalogProblem'}
    BillingCatalogForbidden:
      description: Required authority/human identity is absent, or recent MFA/approved temporary waiver is unavailable.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/LegacySecurityError'
              - $ref: '#/components/schemas/LegacyError'
        application/problem+json:
          schema: {$ref: '#/components/schemas/BillingCatalogProblem'}
    BillingCatalogNotFound:
      description: The exact catalog resource/version or approval does not exist.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/BillingCatalogProblem'}
    BillingCatalogConflict:
      description: Revision/idempotency/state/SoD conflict or approval seal does not match the current command.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/BillingCatalogProblem'}
    BillingCatalogUnavailable:
      description: Catalog storage or integrity is temporarily unavailable.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/BillingCatalogProblem'}
    LegacyBadRequest:
      description: Current shared handlers may emit a 400 JSON error; exact operation codes and variants require validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyUnauthorized:
      description: Current security entry point emits a 401 JSON error; migration to RFC 9457 requires a versioned decision.
      headers:
        WWW-Authenticate:
          description: Bearer challenge governed by RFC 9110.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacySecurityError'
    LegacyForbidden:
      description: Current security or exception handler emits a 403 JSON error; exact boundary variants require validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacySecurityError'
    BillingContextBadRequest:
      description: Bean/binding validation or a rejected elevated-context request.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
        application/problem+json:
          schema:
            $ref: '#/components/schemas/BillingContextProblem'
    BillingContextForbidden:
      description: Security denial, missing recent MFA or a context/actor authorization rejection.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacySecurityError'
        application/problem+json:
          schema:
            $ref: '#/components/schemas/BillingContextProblem'
    BillingContextConflict:
      description: The Idempotency-Key was reused for a different elevated-context intention.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/BillingContextProblem'
    BillingContextUnprocessable:
      description: The requested tenant is absent or not active.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/BillingContextProblem'
    BillingFinancialBadRequest:
      description: Invalid request body, header, query, strong ETag or domain input.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/LegacyError'}
        application/problem+json:
          schema: {$ref: '#/components/schemas/BillingFinancialProblem'}
    BillingFinancialForbidden:
      description: Security denial or the elevated context is absent, expired, mismatched or lacks the operation authority.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/LegacySecurityError'}
        application/problem+json:
          schema: {$ref: '#/components/schemas/BillingFinancialProblem'}
    BillingFinancialNotFound:
      description: The tenant-scoped quote, agreement, subscription, amendment or run was not found.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/BillingFinancialProblem'}
    BillingFinancialConflict:
      description: Revision, idempotency, state, staleness, expiry, cutoff, SoD or approval conflict.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/BillingFinancialProblem'}
    BillingFinancialUnprocessable:
      description: A published price, compatible add-on or PriceVersion pricing authority is unavailable.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/BillingFinancialProblem'}
    BillingInvoiceBadRequest:
      description: Invalid invoice request/status or the tenant is not eligible for generation.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/BillingInvoiceProblem'}
    BillingInvoiceForbidden:
      description: Effective tenant scope is absent/mismatched or invoice access is denied.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/LegacySecurityError'}
        application/problem+json:
          schema: {$ref: '#/components/schemas/BillingInvoiceProblem'}
    BillingInvoiceNotFound:
      description: The subscription or commercial invoice was not found.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/BillingInvoiceProblem'}
    BillingInvoiceConflict:
      description: Subscription/usage/catalog state, idempotency or in-progress invoice generation conflicts.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/BillingInvoiceProblem'}
    BillingInvoiceUnavailable:
      description: Commercial invoice generation is disabled; retry after 60 seconds.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        Retry-After:
          schema: {type: string, const: '60'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/BillingInvoiceProblem'}
    LegacyInternalFailure:
      description: Current shared handler emits a sanitized 500 JSON error with an errorId.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
  schemas:
    BillingFinancialProblem:
      type: object
      additionalProperties: false
      description: RFC 9457 ProblemDetail emitted for elevated-context, contract and run domain failures.
      required: [type, title, status, detail, instance, code]
      properties:
        type: {type: string, format: uri, pattern: '^https://hub-contabil\.com/errors/billing-'}
        title: {type: string, enum: [Falha no contexto financeiro, Falha na operação contratual, Falha no ciclo de faturamento]}
        status: {type: integer, enum: [400, 403, 404, 409, 422]}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
