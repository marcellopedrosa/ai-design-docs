    topic: schemas
    blocking: true
    action: Replace every permissive Java-type projection with a closed, validated wire schema.
  - id: BILLING-BASELINE-002
    topic: errors
    blocking: true
    action: Validate operation-specific error codes, bodies and headers; decide the RFC 9457 migration boundary.
  - id: BILLING-BASELINE-003
    topic: authorization
    blocking: true
    action: Validate route and method authorization, role composition, tenant boundary and negative cases.
  - id: BILLING-BASELINE-004
    topic: consumers
    blocking: true
    action: Confirm consumers and update each affected official document with version and operationIds.
x-change-log:
  - version: 0.5.3
    date: 2026-09-12
    compatibility: draft-authorization-refinement
    changes: >-
      Materializes the approved cumulative HUMAN + ROLE_SUPER_ADMIN +
      BILLING_TENANT_IMPERSONATE + exact BILLING_INVOICE_* + valid-context
      boundary for the ten affected Draft operations. It preserves direct tenant
      contract issuance and Release 0, resolves only authorization subquestions
      and keeps the contract Draft/non-implementable while wire, error,
      compatibility and parity questions remain open.
  - version: 0.5.2
    date: 2026-09-11
    compatibility: additive-governance
    changes: >-
      Removes getPrice and getProduct from the Draft path inventory after their
      promotion to Billing Super Admin Decisions v1 Active 1.1.0. Their original
      blocks remain as x-superseded historical evidence.
  - version: 0.5.1
    date: 2026-09-10
    compatibility: draft-inventory-reduction
    changes: >-
      Removes getUsageRecords from the Draft path inventory after its approved
      promotion to Tenant Billing Usage v1 Active 1.0.0.
  - version: 0.5.0
    date: 2026-09-10
    compatibility: draft-breaking-refinement
    changes: >-
      Refines all 32 P4 tenant Billing/integration operations with closed request/response
      projections, strict consumer evidence, financial context, ETag/no-store/idempotency,
      provider redirect risks, invoice/contract/run lifecycle and RFC 9457 handler boundaries;
      approval and material parity remain blocked.
  - version: 0.4.0
    date: 2026-09-10
    compatibility: draft-breaking-refinement
    changes: >-
      Refines all 26 P3 catalog-administration operations with closed request/response schemas,
      strict consumer evidence, granular authorities, ETag/no-store/idempotency, lifecycle,
      approval/MFA/SoD and dedicated RFC 9457 errors; product approval and parity remain blocked.
  - version: 0.3.0
    date: 2026-09-10
    compatibility: draft-refinement
    changes: >-
      Refined the P2 Stripe webhook with signature, 30-day atomic Redis claim, bodyless ACK and
      observed 400/500/502 failures; provider schema, rate limit and claim/transaction recovery remain
      blocked.
  - version: 0.2.0
    date: 2026-09-10
    compatibility: draft-breaking-refinement
    changes: Refined the two P1 elevated-context issuance operations with observed requests, ContextResult, ETag/no-store and RFC 9457 failure variants; owner approval, authority-family and MFA parity remain blocked.
  - version: 0.1.1
    date: 2026-09-10
    compatibility: additive-governance
    changes: >-
      Removes billingCatalogAdminApprove and billingRunApprove from the Draft path
      inventory after their wire-compatible promotion to Billing Super Admin
      Decisions v1 Active 1.0.0. Their original extracted blocks remain below as
      x-superseded historical evidence and are not canonical HTTP paths.
  - version: 0.1.0
    date: 2026-09-10
    compatibility: initial-draft
    changes: Extracted the legacy baseline for 63 previously uncovered operations.
