        - id: BILLING-HANDLEWEBHOOK-002
          blocking: true
          action: Fix or approve invalid-signature mapping to 502 and define recovery when the 30-day Redis claim succeeds but later transactional processing fails.
        - id: BILLING-HANDLEWEBHOOK-003
          blocking: true
          action: Approve tenant resolution, event-type effects, unknown-event ACK, observability/redaction and exact provider retry behavior before Active.
      x-provider-authentication: Stripe SDK verification of the raw body and Stripe-Signature against the configured webhook secret.
      x-replay-protection: Atomic Redis SET-if-absent keyed by provider/event id with 30-day retention; no timestamp policy is specified locally beyond Stripe SDK behavior.
      x-rate-limit-review: No endpoint-specific rate limiter was found for the Stripe webhook.
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          x-java-type: "String"
