openapi: 3.1.0
info:
  title: SaaS Service Billing Super Admin Decisions API
  version: 1.1.0
  description: >-
    Canonical wire-compatible contract for the two already implemented Billing
    decision operations changed by PRD-00001 v1.9. An authorized SUPER_ADMIN may
    submit and decide the same catalog or invoice-close workflow. The decision is
    always an explicit request, is recorded with the effective actor and does not
    publish a catalog item or finalize an invoice automatically. Existing approval
    identifiers, statuses, actor fields and one-time seals remain protocol-compatible
    audit and integrity artifacts; they do not require a second human. No path,
    request field, response field or success status changes in this version.
x-document-metadata:
  documentId: BILLING-SUPER-ADMIN-DECISIONS-V1
  primaryNature: Contrato
  owner: Billing, Produto, Arquitetura e Segurança
  status: Active
  date: 2026-09-10
  lastReviewed: 2026-09-11
  normativeBaseline: PRD-00001 v1.13; REQ-00054 v1.22; UC-00048 v1.11; UC-00050 v1.7; ADR-0050 v1.8; owner authorization 2026-09-11
  relatedFiles:
    - docs/product/prds/PRD-00001-billing-enterprise.md
    - docs/product/requirements/REQ-00054-super-admin-unified-billing-price-version.md
    - docs/product/use-cases/UC-00048-super-admin-billing-catalog-price-versions.md
    - docs/product/use-cases/UC-00050-super-admin-billing-preview-invoice-close.md
    - docs/adrs/ADR-0050-rbac-sod-aprovacoes-financeiras.md
    - docs/delivery/plans/TP-00054-configurable-billing-independent-approval.md
x-contract-status: Active
x-implementation-authorization: repository-local
x-compatibility:
  classification: behavioral-compatible
  pathsChanged: false
  payloadsChanged: false
  successStatusesChanged: false
  meaning: >-
    The existing decision actor may now equal the maker. Existing consumers can
    continue reading checker fields and approval seals without schema changes.
x-product-policy:
  environments: [DEV, HML, PRD]
  sameSuperAdminDecision: allowed
  distinctHumanChecker: not-required
  explicitDecision: required
  automaticPublication: forbidden
  automaticInvoiceFinalization: forbidden
  historicalApprovals: immutable-and-queryable
x-change-log:
  - version: 1.1.0
    date: 2026-09-11
    compatibility: additive
    changes: >-
      Promotes getPrice and getProduct as the exact read-only supporting operations
      used to identify a PriceVersion by product and monetary value before a decision.
  - version: 1.0.0
    date: 2026-09-10
    compatibility: behavioral-compatible
    changes: >-
      Promotes the implemented catalog and invoice-run decision wire shapes to an
      Active contract and removes only the distinct-human restriction for an
      authorized SUPER_ADMIN. Explicit transitions, audit history, hashes,
      idempotency, optimistic concurrency and one-time seals remain.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: BillingSuperAdminDecisions
    description: Explicit, audited Billing decisions performed by an authorized SUPER_ADMIN.

paths:
  /api/v1/admin/billing/catalog/prices/{priceVersionId}/versions/{priceVersion}:
    get:
      operationId: getPrice
      tags: [BillingSuperAdminDecisions]
      summary: Read the exact PriceVersion being reviewed
      description: >-
        Returns the immutable identity and current representation of the exact
        PriceVersion selected by ID and version. This global seller-owned read is
        used before an explicit decision and never resolves latest or publishes data.
      security:
        - bearerAuth: []
      x-required-roles: [ROLE_SUPER_ADMIN]
      x-required-authorities: [BILLING_CATALOG_READ]
      x-tenant-boundary: global-seller-owned-catalog
      parameters:
        - $ref: '#/components/parameters/PriceVersionId'
        - $ref: '#/components/parameters/PriceVersion'
      responses:
        '200':
          description: Exact PriceVersion representation.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/StrongEtag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPrice'
        '400':
          $ref: '#/components/responses/CatalogInvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CatalogForbidden'
        '404':
          $ref: '#/components/responses/CatalogNotFound'
        '500':
          $ref: '#/components/responses/InternalFailure'
        '503':
          $ref: '#/components/responses/CatalogUnavailable'

  /api/v1/admin/billing/catalog/products/{productId}/versions/{productVersion}:
    get:
      operationId: getProduct
      tags: [BillingSuperAdminDecisions]
      summary: Read the exact product associated with a PriceVersion
      description: >-
        Returns the exact product identity selected by ID and version from the
        PriceVersion representation. This global seller-owned read never resolves
        latest and does not alter product, price or approval state.
      security:
        - bearerAuth: []
      x-required-roles: [ROLE_SUPER_ADMIN]
      x-required-authorities: [BILLING_CATALOG_READ]
      x-tenant-boundary: global-seller-owned-catalog
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/ProductVersion'
      responses:
        '200':
          description: Exact product representation, including its PriceVersions.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/StrongEtag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogProduct'
        '400':
          $ref: '#/components/responses/CatalogInvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CatalogForbidden'
        '404':
          $ref: '#/components/responses/CatalogNotFound'
        '500':
          $ref: '#/components/responses/InternalFailure'
        '503':
          $ref: '#/components/responses/CatalogUnavailable'

  /api/v1/admin/billing/catalog/approvals/{approvalId}/approval:
    post:
      operationId: billingCatalogAdminApprove
      tags: [BillingSuperAdminDecisions]
      summary: Record an explicit catalog decision without publishing the resource
      description: >-
        Records APPROVED for a pending catalog action and returns its one-time
        integrity seal. The authenticated decision actor may be the same human who
        submitted the action or another authorized SUPER_ADMIN. The resulting
        approval remains separate from publication or retirement, which requires a
        later explicit command. Idempotent replay returns the original result.
      security:
        - bearerAuth: []
      x-required-roles: [ROLE_SUPER_ADMIN]
      x-required-authorities: [BILLING_PRICE_APPROVE]
      x-actor-policy:
        principalType: HUMAN
        sameAsMaker: allowed
        auditIdentity: required
      x-tenant-boundary: global-seller-owned-catalog
      x-automatic-publication: forbidden
      parameters:
        - $ref: '#/components/parameters/CatalogApprovalId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogDecisionRequest'
      responses:
        '200':
          description: Explicit decision recorded; no catalog resource was published.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/StrongEtag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovedCatalogAction'
        '400':
          $ref: '#/components/responses/CatalogInvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CatalogForbidden'
        '404':
          $ref: '#/components/responses/CatalogNotFound'
        '409':
          $ref: '#/components/responses/CatalogConflict'
        '500':
          $ref: '#/components/responses/InternalFailure'
        '503':
          $ref: '#/components/responses/CatalogUnavailable'

  /api/v1/tenants/{tenantId}/billing/runs/{runId}/approve:
    post:
      operationId: billingRunApprove
      tags: [BillingSuperAdminDecisions]
      summary: Record an explicit invoice-preview decision without finalizing the run
      description: >-
        Records APPROVED for the exact tenant-local preview generation and hash.
        The authenticated decision actor may be the same human who prepared the run
        or another authorized SUPER_ADMIN operating through the validated Billing
        context. Finalization remains a later explicit command and must revalidate
        the approval seal, preview hash, generation and tenant boundary.
      security:
        - bearerAuth: []
      x-required-roles: []
      x-required-authorities: [BILLING_INVOICE_APPROVE]
      x-role-assignment-policy: >-
        Product policy assigns this operation to authorized SUPER_ADMIN operators;
        the runtime enforcement unit is the granular authority plus tenant Billing
        context, preserving the implemented authorization contract.
      x-actor-policy:
        principalType: HUMAN
        sameAsMaker: allowed
        auditIdentity: required
      x-tenant-boundary: >-
        tenantId must equal the effective tenant selected through the authenticated
        tenant boundary; X-Billing-Context-ID binds the elevated financial context.
      x-automatic-finalization: forbidden
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/BillingContextId'
        - $ref: '#/components/parameters/BillingPurpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingRunDecisionRequest'
      responses:
        '200':
          description: Explicit preview decision recorded; the run was not finalized.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/StrongEtag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingRunApproval'
        '400':
          $ref: '#/components/responses/RunInvalidRequest'
        '401':
          $ref: '#/components/responses/TenantUnauthorized'
        '403':
          $ref: '#/components/responses/RunForbidden'
        '404':
          $ref: '#/components/responses/RunNotFound'
        '409':
          $ref: '#/components/responses/RunConflict'
        '422':
          $ref: '#/components/responses/PricingAuthorityRequired'
        '500':
          $ref: '#/components/responses/InternalFailure'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PriceVersionId:
      name: priceVersionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    PriceVersion:
      name: priceVersion
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    ProductId:
      name: productId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ProductVersion:
      name: productVersion
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    CatalogApprovalId:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong decimal revision ETag, for example `"3"`.
      schema:
        type: string
        pattern: '^"[0-9]+"$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    BillingContextId:
      name: X-Billing-Context-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    BillingPurpose:
      name: X-Billing-Purpose
      in: header
      required: true
      schema:
        type: string
        minLength: 1

  headers:
    NoStore:
      description: The response must not be stored.
      required: true
      schema:
        type: string
        const: no-store
    StrongEtag:
      description: Strong decimal revision of the returned approval record.
      required: true
      schema:
        type: string
        pattern: '^"[0-9]+"$'

  responses:
    CatalogInvalidRequest:
      description: Invalid body, identifier, idempotency key or If-Match value.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CatalogProblem'
    CatalogForbidden:
      description: Missing authority, non-human actor, stale MFA or invalid alçada.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CatalogProblem'
        application/json:
          schema:
            $ref: '#/components/schemas/SecurityProblem'
    CatalogNotFound:
      description: The catalog approval does not exist.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CatalogProblem'
    CatalogConflict:
      description: Revision, state, idempotency or approval-integrity conflict.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CatalogProblem'
    CatalogUnavailable:
      description: The canonical catalog dependency is temporarily unavailable.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CatalogProblem'
    RunInvalidRequest:
      description: Invalid body, path, Billing context or If-Match value.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RunProblem'
    RunForbidden:
      description: Missing authority or invalid tenant/elevated Billing context.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RunProblem'
        application/json:
          schema:
            $ref: '#/components/schemas/SecurityProblem'
    RunNotFound:
      description: The Billing run or tenant-local approval does not exist.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RunProblem'
    RunConflict:
      description: Version, state, cutoff, preview, approval or idempotency conflict.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RunProblem'
    PricingAuthorityRequired:
      description: The tenant has no active PriceVersion authority for this run.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RunProblem'
    Unauthorized:
      description: Bearer authentication is absent or invalid.
      headers:
        WWW-Authenticate:
          description: Bearer challenge.
          required: true
          schema:
            type: string
            const: Bearer
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SecurityProblem'
    TenantUnauthorized:
      description: Bearer authentication or required tenant identity is absent or invalid.
      headers:
        WWW-Authenticate:
          description: Bearer challenge when authentication itself is absent or invalid.
          schema:
            type: string
            const: Bearer
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/TenantBoundaryProblem'
        application/json:
          schema:
            $ref: '#/components/schemas/SecurityProblem'
    InternalFailure:
      description: Sanitized unexpected server failure.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GenericProblem'

  schemas:
    CatalogHash:
      type: string
      pattern: '^[a-f0-9]{64}$'
    CatalogPrice:
      type: object
      additionalProperties: false
      required: [priceVersionId, priceVersion, productId, productVersion, status, amountMinor, currency, minorUnitExponent, cadence, chargeTiming, priceModel, audience, audienceTenantId, contentHash, publicationHash, effectiveFrom, effectiveUntil, revision, createdAt, createdBy, publishedAt]
      properties:
        priceVersionId: {type: string, format: uuid}
        priceVersion: {type: integer, format: int64, minimum: 1}
        productId: {type: string, format: uuid}
        productVersion: {type: integer, format: int64, minimum: 1}
        status: {type: string, enum: [DRAFT, PUBLISHED, RETIRED]}
        amountMinor: {type: string, pattern: '^(0|[1-9][0-9]{0,15})$'}
        currency: {type: string, const: BRL}
        minorUnitExponent: {type: integer, const: 2}
        cadence: {type: string, enum: [MONTHLY, ANNUAL, ONE_TIME]}
        chargeTiming: {type: string, const: IN_ADVANCE}
        priceModel: {type: string, const: FIXED}
        audience: {type: string, enum: [PUBLIC_CATALOG, TENANT_RESTRICTED]}
        audienceTenantId: {type: [string, 'null'], format: uuid}
        contentHash: {$ref: '#/components/schemas/CatalogHash'}
        publicationHash: {anyOf: [{$ref: '#/components/schemas/CatalogHash'}, {type: 'null'}]}
        effectiveFrom: {type: [string, 'null'], format: date-time}
        effectiveUntil: {type: [string, 'null'], format: date-time}
        revision: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
        createdBy: {type: string}
        publishedAt: {type: [string, 'null'], format: date-time}
    CatalogProduct:
      type: object
      additionalProperties: false
      required: [productId, productVersion, productCode, productKind, displayName, description, commercialUnit, status, contentHash, revision, createdAt, createdBy, prices]
      properties:
        productId: {type: string, format: uuid}
        productVersion: {type: integer, format: int64, minimum: 1}
        productCode: {type: string}
        productKind: {type: string, enum: [BASE_PLAN, ADD_ON]}
        displayName: {type: string}
        description: {type: string}
        commercialUnit: {type: string}
        status: {type: string, enum: [DRAFT, PUBLISHED, RETIRED]}
        contentHash: {$ref: '#/components/schemas/CatalogHash'}
        revision: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
        createdBy: {type: string}
        prices: {type: array, items: {$ref: '#/components/schemas/CatalogPrice'}}
    CatalogDecisionRequest:
      type: object
      additionalProperties: false
      required: [purpose]
      properties:
        purpose:
          type: string
          minLength: 1
          maxLength: 160
    BillingRunDecisionRequest:
      type: object
      additionalProperties: false
      required: [expectedGeneration, expectedRunRevision, previewHash]
      properties:
        expectedGeneration:
          type: integer
          format: int64
          minimum: 1
        expectedRunRevision:
          type: integer
          format: int64
          minimum: 0
        previewHash:
          type: string
          minLength: 64
          maxLength: 64
    ApprovedCatalogAction:
      type: object
      additionalProperties: false
      required: [approval, approvalSeal]
      properties:
        approval:
          $ref: '#/components/schemas/CatalogApproval'
        approvalSeal:
          type: string
          minLength: 1
          maxLength: 512
          description: One-time integrity input for the later explicit publication or retirement command.
    CatalogApproval:
      type: object
      additionalProperties: false
      required:
        - approvalId
        - action
        - resourceType
        - resourceId
        - resourceVersion
        - contentHash
        - payloadHash
        - makerSubject
        - makerHumanPrincipalId
        - checkerSubject
        - status
        - revision
        - createdAt
        - decidedAt
        - sealExpiresAt
        - consumedAt
      properties:
        approvalId:
          type: string
          format: uuid
        action:
          type: string
        resourceType:
          type: string
        resourceId:
          type: string
          format: uuid
        resourceVersion:
          type: integer
          format: int64
        contentHash:
          type: string
        payloadHash:
          type: string
        makerSubject:
          type: string
        makerHumanPrincipalId:
          type: string
        checkerSubject:
          type: [string, 'null']
          description: Historical wire name for the effective decision actor; it may equal makerSubject.
        status:
          type: string
        revision:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type: [string, 'null']
          format: date-time
        sealExpiresAt:
          type: [string, 'null']
          format: date-time
        consumedAt:
          type: [string, 'null']
          format: date-time
    BillingRunApproval:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - approvalId
        - runId
        - generation
        - previewHash
        - amountMinor
        - currency
        - makerSubject
        - makerHumanPrincipalId
        - checkerSubject
        - checkerHumanPrincipalId
        - status
        - createdAt
        - decidedAt
        - expiresAt
        - consumedAt
        - revision
        - approvalSeal
      properties:
        schemaVersion:
          type: string
        approvalId:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        generation:
          type: integer
          format: int64
          minimum: 1
        previewHash:
          type: string
          minLength: 64
          maxLength: 64
        amountMinor:
          type: string
        currency:
          type: string
        makerSubject:
          type: string
        makerHumanPrincipalId:
          type: string
        checkerSubject:
          type: [string, 'null']
          description: Historical wire name for the effective decision actor; it may equal makerSubject.
        checkerHumanPrincipalId:
          type: [string, 'null']
          description: Historical wire name for the effective human decision actor; it may equal makerHumanPrincipalId.
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type: [string, 'null']
          format: date-time
        expiresAt:
          type: [string, 'null']
          format: date-time
        consumedAt:
          type: [string, 'null']
          format: date-time
        revision:
          type: integer
          format: int64
          minimum: 0
        approvalSeal:
          type: string
          minLength: 1
          maxLength: 512
          description: One-time integrity input for the later explicit finalize command.
    CatalogProblem:
      allOf:
        - $ref: '#/components/schemas/GenericProblem'
        - type: object
          required: [errorCode, i18nKey, code, traceId, timestamp]
          properties:
            errorCode:
              type: string
            i18nKey:
              type: string
            code:
              type: string
            traceId:
              type: string
            timestamp:
              type: string
              format: date-time
    RunProblem:
      allOf:
        - $ref: '#/components/schemas/GenericProblem'
        - type: object
          required: [code]
          properties:
            code:
              type: string
    GenericProblem:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
    SecurityProblem:
      type: object
      additionalProperties: false
      required: [error, message, status, timestamp, path]
      properties:
        error:
          type: string
        message:
          type: string
        status:
          type: integer
          minimum: 400
        timestamp:
          type: string
          format: date-time
        path:
          type: string
    TenantBoundaryProblem:
      type: object
      additionalProperties: true
      required: [status]
      properties:
        status:
          type: integer
          minimum: 400
