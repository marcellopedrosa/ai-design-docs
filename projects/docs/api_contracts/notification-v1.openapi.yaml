components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    LegacyBadRequest:
      description: Current shared handlers may emit a 400 JSON error; exact operation codes and variants require validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyUnauthorized:
      description: Current security entry point emits a 401 JSON error; migration to RFC 9457 requires a versioned decision.
      headers:
        WWW-Authenticate:
          description: Bearer challenge governed by RFC 9110.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacySecurityError'
    LegacyForbidden:
      description: Current security or exception handler emits a 403 JSON error; exact boundary variants require validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacySecurityError'
    LegacyInternalFailure:
      description: Current shared handler emits a sanitized 500 JSON error with an errorId.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
  schemas:
    SmtpConfigRequest:
      type: object
      additionalProperties: true
      description: >-
        Observed command shape. Unknown members are ignored by the current Jackson
        boundary. Password may contain a new secret or the literal ******** to
        reuse an existing persisted password; omission is accepted by binding but
        can fail during connection testing or persistence.
      required: [host, port, username, tlsEnabled, fromEmail]
      properties:
        host:
          type: string
        port:
          type: integer
          format: int32
        username:
          type: string
        password:
          type: [string, 'null']
          writeOnly: true
        tlsEnabled:
          type: boolean
        fromEmail:
          type: string
    SmtpProviderConfig:
      type: object
      additionalProperties: false
      description: Observed persisted SMTP configuration; password is replaced by a fixed mask before return.
      required: [id, providerType, host, port, username, password, tlsEnabled, fromEmail, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        providerType:
          type: string
          const: SMTP
        host:
          type: string
        port:
          type: integer
          format: int32
        username:
          type: string
        password:
          type: string
          const: '********'
          readOnly: true
        tlsEnabled:
          type: boolean
        fromEmail:
          type: string
        createdAt:
          type: [string, 'null']
          format: date-time
          description: Current persistence mapper does not copy this inherited field and therefore returns null.
        updatedAt:
          type: [string, 'null']
          format: date-time
          description: Current persistence mapper does not copy this inherited field and therefore returns null.
    CreateNotificationTemplateRequest:
      type: object
      additionalProperties: true
      description: Observed CreateTemplateCommand boundary; channels are joined as a comma-separated string for persistence.
      required: [parameterCode, subject, messageBody, channels]
      properties:
        parameterCode:
          type: string
        subject:
          type: string
        messageBody:
          type: string
        channels:
          type: array
          items:
            type: string
        isHtml:
          type: boolean
          default: false
        active:
          type: boolean
          default: false
    UpdateNotificationTemplateRequest:
      type: object
      additionalProperties: true
      description: >-
        Observed UpdateTemplateCommand boundary. The frontend sends parameterCode,
        but the Java command ignores it; channels are joined as CSV.
      required: [subject, messageBody, channels]
      properties:
        parameterCode:
          type: string
          deprecated: true
          description: Sent by the current frontend but ignored by UpdateTemplateCommand.
        subject:
          type: string
        messageBody:
          type: string
        channels:
          type: array
          items:
            type: string
        isHtml:
          type: boolean
          default: false
        active:
          type: boolean
          default: false
    NotificationTemplate:
      type: object
      additionalProperties: false
      description: >-
        Observed NotificationTemplate wire shape. channels is serialized as CSV;
        the frontend normalizes string or array input to its array model.
      required: [id, parameterCode, subject, messageBody, channels, isHtml, active, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        parameterCode:
          type: string
        subject:
          type: string
        messageBody:
          type: string
        channels:
          type: string
          description: Comma-separated channel values; the backend does not validate an enum at this boundary.
        isHtml:
          type: boolean
        active:
          type: boolean
        createdAt:
          type: [string, 'null']
          format: date-time
          description: Current persistence mapper does not copy this inherited field and therefore returns null.
        updatedAt:
          type: [string, 'null']
          format: date-time
          description: Current persistence mapper does not copy this inherited field and therefore returns null.
    NotificationList:
      type: object
      additionalProperties: false
      description: Observed NotificationListResponse with at most twenty recent notifications.
      required: [notifications, unreadCount]
      properties:
        notifications:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/NotificationItem'
        unreadCount:
          type: integer
          format: int64
          minimum: 0
    NotificationItem:
      type: object
      additionalProperties: false
      required: [id, title, message, category, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        message:
          type: string
          maxLength: 500
        category:
          type: string
          enum: [CLIENT_CREATED, CLIENT_UPDATED, CONTACT_ASSIGNED, CERTIFICATE_UPLOADED, CERTIFICATE_REVOKED, CHATBOT_MENU_CONFIGURED, SERPRO_CREDENTIALS_UPDATED, FISCAL_QUERY_COMPLETED, SYSTEM]
        status:
          type: string
          enum: [UNREAD, READ]
        createdAt:
          type: string
          format: date-time
    NotificationSseData:
      type: object
      additionalProperties: false
      description: Current JSON data emitted inside an SSE notification event; unlike NotificationItem, it omits status.
      required: [id, title, message, category, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        message:
          type: string
        category:
          type: string
          enum: [CLIENT_CREATED, CLIENT_UPDATED, CONTACT_ASSIGNED, CERTIFICATE_UPLOADED, CERTIFICATE_REVOKED, CHATBOT_MENU_CONFIGURED, SERPRO_CREDENTIALS_UPDATED, FISCAL_QUERY_COMPLETED, SYSTEM]
        createdAt:
          type: string
          format: date-time
    NotificationLogPage:
