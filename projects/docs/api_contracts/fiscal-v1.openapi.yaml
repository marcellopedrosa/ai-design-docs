paths:
  /api/admin/system/migrate-pdfs:
    post:
      operationId: migrate
      tags: [PdfMigrationAdminController]
      summary: Synchronously copy legacy local PDFs into tenant databases
      description: >-
        Global filesystem scan of tenant UUID directories under the configured PDF base path.
        Recognized relatorio_fiscal_{uuid}.pdf and das_{uuid}.pdf files are loaded fully into memory
        and copied into each tenant database. Existing storage keys are skipped; unrecognized paths
        are silently ignored; individual read/save failures increment errorCount and still yield 200.
        A missing base directory also returns all-zero 200. The source files are not deleted. The
        operation is synchronous, has no dry-run/job/idempotency header and is not one transaction.
      security:
        - bearerAuth: []
      x-required-roles:
        - ROLE_SUPER_ADMIN
      x-required-authorities:
        []
      x-authorization-source: "SecurityConfig authenticated fallback; @PreAuthorize"
      x-authorization-review: observed-super-admin-destructive-global-operation-approval-required
      x-tenant-boundary: >-
        ROLE_SUPER_ADMIN at the generic admin boundary; the operation iterates all filesystem tenant
        directories and switches TenantContext internally without an explicit raw-global guard.
      x-preauthorize-expression: "hasRole('SUPER_ADMIN')"
      x-contract-priority: 3
      x-priority-basis: "Administrative, identity-related or sensitive-data surface."
      x-source-controller: "backend/src/main/java/br/com/duoset/saas_service/contexts/fiscal/internal/presentation/rest/PdfMigrationAdminController.java:21"
      x-source-method: "PdfMigrationAdminController.migrate"
      x-source-confidence: observed-not-approved
      x-open-questions:
        - id: FISCAL-MIGRATE-001
          blocking: true
          action: Approve whether an HTTP endpoint may run this global synchronous migration and define dry-run, job, timeout and retry controls.
        - id: FISCAL-MIGRATE-002
          blocking: true
          action: Bind raw-global authorization, tenant enumeration, filesystem root and audit requirements to an approved operational source.
        - id: FISCAL-MIGRATE-003
          blocking: true
          action: Define atomicity, memory/file-size bounds, concurrent invocation, storage-key races and recovery of partial per-file outcomes.
        - id: FISCAL-MIGRATE-004
          blocking: true
          action: Decide whether missing directories and per-file errors may return 200 and prove all success/error variants; no frontend consumer was found.
      responses:
        '200':
          description: Aggregate per-file counts; errorCount greater than zero still uses HTTP 200.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdfMigrationResult'
          x-source-confidence: observed-not-approved
          x-response-review: observed-shape-operational-approval-required
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '403':
          $ref: '#/components/responses/LegacyForbidden'
        '500':
          $ref: '#/components/responses/LegacyInternalFailure'
      x-error-contract-review: required
      x-version-policy:
        publicMajor: v1
        draftContractVersion: 0.6.0
        compatibilityDecision: required-before-active
