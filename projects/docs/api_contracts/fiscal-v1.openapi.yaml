  - id: FISCAL-BASELINE-001
    topic: schemas
    blocking: true
    action: Replace every permissive Java-type projection with a closed, validated wire schema.
  - id: FISCAL-BASELINE-002
    topic: errors
    blocking: true
    action: Validate operation-specific error codes, bodies and headers; decide the RFC 9457 migration boundary.
  - id: FISCAL-BASELINE-003
    topic: authorization
    blocking: true
    action: Validate route and method authorization, role composition, tenant boundary and negative cases.
  - id: FISCAL-BASELINE-004
    topic: consumers
    blocking: true
    action: Confirm consumers and update each affected official document with version and operationIds.
x-change-log:
  - version: 0.6.0
    date: 2026-09-11
    compatibility: draft-catalog-removal
    changes: >-
      Removed the five former consumer-only DARF, batch and generic document-repository entries
      after the requester directed their frontend removal. The implemented fiscal-report and DAS
      PDF operations remain unchanged.
  - version: 0.5.0
    date: 2026-09-10
    compatibility: draft-catalog-extension
    changes: >-
      Cataloged five production frontend calls without a matching backend controller as explicit
      consumer-only/backend-unimplemented operations. Their response codes, schemas, errors and
      authorization are frontend expectations, not claims about runtime behavior.
  - version: 0.4.0
    date: 2026-09-10
    compatibility: draft-breaking-refinement
    changes: >-
      Refined all five P5 operations for DAS issuance/history/download, generic fiscal history and
      static service status; documented tenant-scoped storage, real binary headers, current legacy
      errors, non-idempotent provider workflow and the unvalidated manual-pagination edge cases.
  - version: 0.3.0
    date: 2026-09-10
    compatibility: draft-refinement
    changes: >-
      Refined all three P3 operations for synchronous local-PDF migration and tenant-scoped SERPRO
      traffic logs; documented per-file partial outcomes, sensitive detail, summary redaction,
      pagination validation and bodyless 404 without promotion.
  - version: 0.2.0
    date: 2026-09-10
    compatibility: draft-breaking-refinement
    changes: Refined eight frontend-consumed P1 operations with observed request, result, PDF, diagnostic and usage shapes; exposed legacy 400-not-404, HTTP 425, TypeScript DTO drift and optional DAS consolidation date.
  - version: 0.1.0
    date: 2026-09-10
    compatibility: initial-draft
    changes: Extracted the legacy baseline for 16 previously uncovered operations.
