components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    FiscalDasBadRequest:
      description: Validation, domain, active-issuance or confirmed SERPRO business rejection.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/LegacyError'
              - $ref: '#/components/schemas/SerproBusinessError'
    FiscalSerproBadGateway:
      description: Classified SERPRO technical/authentication/unknown-outcome failure or another external-service failure.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/SerproExternalError'
              - $ref: '#/components/schemas/LegacyError'
    SerproTrafficPaginationBadRequest:
      description: page or size violated the controller bounds.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SerproTrafficPaginationError'
    LegacyBadRequest:
      description: Current shared handlers may emit a 400 JSON error; exact operation codes and variants require validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyUnauthorized:
      description: Current security entry point emits a 401 JSON error; migration to RFC 9457 requires a versioned decision.
      headers:
        WWW-Authenticate:
          description: Bearer challenge governed by RFC 9110.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacySecurityError'
    LegacyForbidden:
      description: Current security or exception handler emits a 403 JSON error; exact boundary variants require validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacySecurityError'
    LegacyBadGateway:
      description: Current external-service handler emits a sanitized 502 JSON error with service and errorId.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyInternalFailure:
      description: Current shared handler emits a sanitized 500 JSON error with an errorId.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
  schemas:
    GerarDasRequest:
      type: object
      additionalProperties: true
      description: Current Jackson boundary ignores unknown members; all three strings are Bean Validation non-blank.
      required: [documento, periodoApuracao, dataConsolidacao]
      properties:
        documento:
          type: string
          minLength: 1
          description: CPF or CNPJ normalized and validated by Documento.
        periodoApuracao:
          type: string
          pattern: '^(?:[0-9]{6}|[0-9]{2}/[0-9]{4}|[0-9]{4}-[0-9]{2})$'
          description: Accepted as AAAAMM, MM/AAAA or AAAA-MM; response is canonical AAAAMM.
        dataConsolidacao:
          type: string
          pattern: '^(?:[0-9]{8}|[0-9]{2}/[0-9]{2}/[0-9]{4}|[0-9]{4}-[0-9]{2}-[0-9]{2})$'
          description: Accepted as AAAAMMDD, DD/MM/AAAA or ISO date; calendar validity is server enforced.
    EmitirDasResponse:
      type: object
      additionalProperties: false
      required: [dasId, periodoApuracao, vencimento, valorTotalCentavos, downloadUrl]
      properties:
        dasId: {type: string, format: uuid}
        periodoApuracao: {type: string, pattern: '^[0-9]{6}$'}
        vencimento: {type: [string, 'null'], format: date}
        valorTotalCentavos: {type: integer, format: int64, minimum: 0}
        downloadUrl: {type: string, pattern: '^/api/v1/fiscal/das/[0-9a-fA-F-]{36}/download$'}
      x-consumer-drift: Frontend EmitirDasResponse omits dasId even though the backend always emits it.
    DasDocumentStatus:
      type: string
      enum: [EMITINDO, ARMAZENANDO, EMITIDO, PAGO, EXPIRADO, FALHA_ARMAZENAMENTO, RESULTADO_DESCONHECIDO, FALHA]
    DasHistoryItem:
      type: object
      additionalProperties: false
      required: [id, documento, periodoApuracao, dataConsolidacao, numeroDocumento, valorTotalCentavos, status, emitidoEm, vencimento, downloadUrl]
      properties:
        id: {type: string, format: uuid}
        documento: {type: string}
        periodoApuracao: {type: string, pattern: '^[0-9]{6}$'}
        dataConsolidacao: {type: [string, 'null'], format: date}
        numeroDocumento: {type: [string, 'null']}
        valorTotalCentavos: {type: [integer, 'null'], format: int64, minimum: 0}
        status: {$ref: '#/components/schemas/DasDocumentStatus'}
        emitidoEm: {type: string, format: date-time}
        vencimento: {type: [string, 'null'], format: date}
        downloadUrl:
          type: [string, 'null']
          pattern: '^/api/v1/fiscal/das/[0-9a-fA-F-]{36}/download$'
    DasHistoryPage:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages, first, last]
      properties:
        content: {type: array, items: {$ref: '#/components/schemas/DasHistoryItem'}}
        page: {type: integer, format: int32, minimum: 0}
        size: {type: integer, format: int32, minimum: 1, maximum: 100}
        totalElements: {type: integer, format: int64, minimum: 0}
        totalPages: {type: integer, format: int32, minimum: 0}
        first: {type: boolean}
        last: {type: boolean}
    ConsultaFiscalPage:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages, first, last]
      properties:
        content: {type: array, items: {$ref: '#/components/schemas/ConsultaFiscalResponse'}}
        page: {type: integer, format: int32}
        size: {type: integer, format: int32}
        totalElements: {type: integer, format: int32, minimum: 0}
        totalPages: {type: integer, format: int32}
        first: {type: boolean}
        last: {type: boolean}
    FiscalServiceStatus:
      type: object
      additionalProperties: false
      required: [status, message, lastChecked]
      properties:
        status: {type: string, const: NORMAL}
        message: {type: string, const: Serviço operacional}
        lastChecked: {type: string, format: date-time}
    SerproBusinessError:
      type: object
      additionalProperties: false
      required: [message, code, category]
      properties:
        message: {type: string}
        code: {type: string}
        category: {type: string, const: BUSINESS_REJECTION}
    SerproExternalError:
      type: object
      additionalProperties: false
      required: [message, code, category, service, errorId]
      properties:
        message: {type: string}
        code: {type: string}
        category: {type: string, enum: [UNAVAILABLE, AUTHENTICATION, RESTART_REQUIRED, UNKNOWN_OUTCOME]}
        service: {type: string, const: SERPRO}
        errorId: {type: string, format: uuid}
    PdfMigrationResult:
      type: object
      additionalProperties: false
      required: [successCount, skippedCount, errorCount]
      properties:
        successCount: {type: integer, format: int32, minimum: 0}
        skippedCount: {type: integer, format: int32, minimum: 0}
        errorCount: {type: integer, format: int32, minimum: 0}
      x-invariants:
        - Counts include only recognized PDF filenames inside UUID tenant directories.
        - errorCount greater than zero does not change the HTTP 200 status.
    SerproTrafficPaginationError:
      type: object
      additionalProperties: false
      required: [message, errorId]
      properties:
        message: {type: string, const: Parâmetros de paginação inválidos.}
        errorId: {type: string, format: uuid}
    SerproTrafficCaptureMode:
      type: string
      enum: [METADATA_ONLY, SANITIZED_DETAIL]
    SerproTrafficLogSummary:
      type: object
      additionalProperties: false
      required: [id, operation, method, endpoint, payloadRequest, payloadResponse, requestHeaders, responseHeaders, captureMode, statusCode, durationMs, createdAt]
      properties:
        id: {type: string, format: uuid}
        operation: {type: [string, 'null']}
        method: {type: [string, 'null']}
        endpoint: {type: string}
        payloadRequest: {type: 'null'}
        payloadResponse: {type: 'null'}
        requestHeaders: {type: 'null'}
        responseHeaders: {type: 'null'}
        captureMode: {$ref: '#/components/schemas/SerproTrafficCaptureMode'}
        statusCode: {type: [integer, 'null'], minimum: 100, maximum: 599}
        durationMs: {type: [integer, 'null'], format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
      x-consumer-drift: >-
        Frontend requires operation from a narrower enum, an HTTP-method enum and non-null
        durationMs; legacy persistence and the backend DTO allow null or other strings.
    SerproTrafficLogDetail:
      type: object
      additionalProperties: false
      required: [id, operation, method, endpoint, payloadRequest, payloadResponse, requestHeaders, responseHeaders, captureMode, statusCode, durationMs, createdAt]
      properties:
        id: {type: string, format: uuid}
        operation: {type: [string, 'null']}
        method: {type: [string, 'null']}
        endpoint: {type: string}
        payloadRequest: {type: [string, 'null']}
        payloadResponse: {type: [string, 'null']}
        requestHeaders: {type: [string, 'null']}
        responseHeaders: {type: [string, 'null']}
        captureMode: {$ref: '#/components/schemas/SerproTrafficCaptureMode'}
        statusCode: {type: [integer, 'null'], minimum: 100, maximum: 599}
        durationMs: {type: [integer, 'null'], format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
      x-sensitive-fields: [endpoint, payloadRequest, payloadResponse, requestHeaders, responseHeaders]
      x-consumer-drift: >-
        Frontend requires operation/method from narrower enums and non-null durationMs; backend
        allows legacy null/arbitrary values. captureMode is optional in TypeScript but always emitted.
    SerproTrafficLogPage:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items: {$ref: '#/components/schemas/SerproTrafficLogSummary'}
        page: {type: integer, format: int32, minimum: 0}
        size: {type: integer, format: int32, minimum: 1, maximum: 100}
        totalElements: {type: integer, format: int64, minimum: 0}
        totalPages: {type: integer, format: int32, minimum: 0}
    ConsultaFiscalRequest:
      type: object
      additionalProperties: true
      description: >-
        Observed request shape. Unknown members are ignored by the current Jackson
        boundary; Documento performs the effective CPF/CNPJ normalization and validation.
      required: [documento]
      properties:
        documento:
          type: string
          description: CPF or CNPJ accepted with or without punctuation.
    ConsultaFiscalAccepted:
      type: object
      additionalProperties: false
      description: Observed asynchronous consultation result assembled by the controller.
      required: [consultaId, status, tempoEsperaMs]
      properties:
        consultaId:
          type: string
          format: uuid
        status:
          type: string
          enum: [AGUARDANDO_RETRY, EM_PROCESSAMENTO]
        tempoEsperaMs:
          type: integer
          format: int64
          minimum: 0
        code:
          type: string
          description: Present only for a SERPRO code approved by SitfisMessageCatalog for public exposure.
        mensagem:
          type: string
          description: Present only with a publicly visible SERPRO outcome.
    ConsultaFiscalResponse:
      type: object
      additionalProperties: false
      description: Observed ConsultaFiscalResponse record serialized by FiscalController.
      required: [id, tenantId, documento, statusFiscal, debitosTotais, dataConsulta, consultadoPor, protocoloSerpro, pdfStorageKey, resumoLlm, debitos, providerCode, userMessage, failureCategory]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        documento:
          type: string
        statusFiscal:
          type: string
          enum: [REGULAR, IRREGULAR, PENDENTE, AGUARDANDO_RETRY, EM_PROCESSAMENTO, CONCLUIDO, ERRO_RECEITA]
        debitosTotais:
          type: integer
          format: int64
          minimum: 0
          description: Sum of debt totals converted to cents.
        dataConsulta:
          type: string
          format: date-time
        consultadoPor:
          type: string
          const: Sistema
        protocoloSerpro:
          type: [string, 'null']
        pdfStorageKey:
          type: [string, 'null']
        resumoLlm:
          type: [string, 'null']
        debitos:
          type: array
          items:
            $ref: '#/components/schemas/DebitoFiscalResponse'
        providerCode:
          type: [string, 'null']
          description: Non-null only when approved for public exposure.
        userMessage:
          type: [string, 'null']
          description: Non-null only when approved for public exposure.
        failureCategory:
          type: [string, 'null']
          enum: [UNAVAILABLE, BUSINESS_REJECTION, AUTHENTICATION, RESTART_REQUIRED, UNKNOWN_OUTCOME, null]
    DebitoFiscalResponse:
      type: object
      additionalProperties: false
      required: [id, receita, principal, multa, juros, valorTotal, dataVencimento]
      properties:
        id:
          type: string
          format: uuid
        receita:
          type: string
        principal:
          type: number
        multa:
          type: number
        juros:
          type: number
        valorTotal:
          type: number
        dataVencimento:
          type: string
          format: date
    TestarApoiarResponse:
      oneOf:
        - $ref: '#/components/schemas/TestarApoiarPending'
        - $ref: '#/components/schemas/TestarApoiarDeferred'
      description: Observed closed union of controller-visible diagnostic outcomes.
    TestarApoiarPending:
      type: object
      additionalProperties: false
      required: [consultaId, status, tempoEsperaMs, protocolo, mensagem]
      properties:
        consultaId:
          type: string
          format: uuid
        status:
          type: string
          const: EM_PROCESSAMENTO
        tempoEsperaMs:
          type: integer
          format: int64
          minimum: 0
        protocolo:
          type: string
          description: Preview containing at most the first 20 protocol characters followed by ellipsis.
        mensagem:
          type: string
        code:
          type: string
    TestarApoiarDeferred:
      type: object
      additionalProperties: false
      required: [status, tempoEsperaMs]
      properties:
        status:
          type: string
          enum: [LIMITE_ATINGIDO, AGUARDANDO_RETRY, NOVO_APOIAR_NECESSARIO]
        tempoEsperaMs:
          type: integer
          format: int64
          minimum: 0
        mensagem:
          type: string
        code:
          type: string
    TestarEmitirTooEarly:
      type: object
      additionalProperties: false
      required: [message, segundosFaltando, consultaId]
      properties:
        message:
          type: string
        segundosFaltando:
          type: integer
          format: int64
          minimum: 1
        consultaId:
          type: string
          format: uuid
    GerarDasTestRequest:
      type: object
      additionalProperties: true
      description: >-
        Observed request record. The current frontend sends documento and periodoApuracao only;
        dataConsolidacao is accepted by the backend but has no known static consumer in this flow.
      required: [documento, periodoApuracao]
      properties:
        documento:
          type: string
        periodoApuracao:
          type: string
          pattern: '^\\d{6}$'
          description: Assessment period in AAAAMM format.
        dataConsolidacao:
          type: [string, 'null']
          description: Optional consolidation date forwarded to the SERPRO adapter.
    GerarDasTestResponse:
      type: object
      additionalProperties: false
      required: [mensagem, pdfBase64, numeroDocumentoGerado, valorTotalCentavos]
      properties:
        mensagem:
          type: [string, 'null']
        pdfBase64:
          type: [string, 'null']
          contentEncoding: base64
        numeroDocumentoGerado:
          type: [string, 'null']
        valorTotalCentavos:
          type: [integer, 'null']
          format: int64
    FiscalUsage:
      type: object
      additionalProperties: false
      required: [used, limit, planName]
      properties:
        used:
          type: integer
          format: int64
          minimum: 0
        limit:
          type: integer
          format: int32
          const: -1
          description: Current placeholder for unlimited usage.
        planName:
          type: string
          const: BUSINESS
          description: Current placeholder plan name.
    LegacyError:
      type: object
      description: Observed non-RFC-9457 envelope; variants remain a blocking review item.
      additionalProperties: true
      required: [message]
      properties:
        message:
          type: string
        errorId:
          type: string
          format: uuid
        service:
          type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
      x-schema-review: required
    LegacySecurityError:
      type: object
      description: Observed default security envelope; specialized path handlers may differ.
      additionalProperties: true
      required: [error, message, status, timestamp, path]
      properties:
        error:
          type: string
        message:
          type: string
        status:
          type: integer
        timestamp:
          type: string
          format: date-time
        path:
          type: string
      x-schema-review: required
    Problem:
      type: object
      description: Target Problem Details shape governed by RFC 9457; not claimed as current legacy behavior.
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
