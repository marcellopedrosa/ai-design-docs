  /api/v1/fiscal/historico:
    get:
      operationId: listarHistorico
      tags: [FiscalController]
      summary: List tenant-scoped fiscal consultations with manual pagination
      description: >-
        Loads every matching consultation for the effective TenantContext, maps public-safe SERPRO
        fields and then slices the list in memory. page/size/status are not validated; size zero or
