openapi: 3.1.0
info:
  title: SaaS Service Fiscal Legacy API Baseline
  version: 0.6.0
  description: >-
    Draft, non-implementable projection of 16 legacy Fiscal HTTP operations extracted
    from Spring MVC controllers. Version 0.2.0 refines eight P1 operations, version 0.3.0
    refines three P3 PDF-migration and SERPRO traffic-inspector operations, and version 0.4.0
    closes the five P5 DAS/history/service-status projections. Version 0.6.0 removes the five
    former consumer-only entries after their unsupported frontend consumers were expunged.
    It records observed code and unresolved design gaps; it is not approval of current behavior.
