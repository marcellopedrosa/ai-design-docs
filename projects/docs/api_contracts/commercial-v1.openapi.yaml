openapi: 3.1.0
info:
  title: SaaS Service Commercial Legacy API Baseline
  version: 0.3.0
  description: >-
    Draft, non-implementable projection of 10 legacy Commercial HTTP operations extracted
    from Spring MVC controllers after listContacts moved to its own Active contract. Version 0.3.0
    refines the five P3 contact-detail/status and notification-recipient mutations. It records
    observed code and unresolved design gaps; it is not approval of the current behavior. Every
    x-open-questions item must be resolved from an approved requirement, use case, ADR or owner
    decision before any operation is promoted to Active.
x-document-metadata:
  documentId: COMMERCIAL-V1
  primaryNature: Contrato
  owner: Arquitetura, Backend e Qualidade
  status: Draft
  date: 2026-09-10
  lastReviewed: 2026-09-10
  normativeBaseline: TP-00052 v1.32, ANL-00055 v1.29, ANL-00056 v1.30 and ANL-00057 v1.0; operation-level product sources remain required
  relatedFiles:
    - docs/delivery/plans/TP-00052-backend-api-contract-baseline.md
    - docs/analysis/ANL-00055-backend-api-contract-coverage-inventory.md
    - docs/analysis/ANL-00057-frontend-backend-api-contract-catalog.md
    - docs/analysis/ANL-00056-api-contract-validation-loop.md
    - docs/agents/standards/api-client-standard.md
x-contract-status: Draft
x-implementation-authorization: blocked
x-extraction-baseline:
  date: 2026-09-10
  source: Spring MVC controllers, SecurityConfig, method security and shared HTTP handlers
  controllers: 2
  operations: 10
  caveat: Code is evidence of current behavior, not an approved source of product intent.
x-open-questions:
  - id: COMMERCIAL-BASELINE-001
    topic: schemas
    blocking: true
    action: Replace every permissive Java-type projection with a closed, validated wire schema.
  - id: COMMERCIAL-BASELINE-002
    topic: errors
    blocking: true
    action: Validate operation-specific error codes, bodies and headers; decide the RFC 9457 migration boundary.
  - id: COMMERCIAL-BASELINE-003
    topic: authorization
    blocking: true
    action: Validate route and method authorization, role composition, tenant boundary and negative cases.
  - id: COMMERCIAL-BASELINE-004
    topic: consumers
    blocking: true
    action: Confirm consumers and update each affected official document with version and operationIds.
x-change-log:
  - version: 0.3.0
    date: 2026-09-10
    compatibility: draft-refinement
    changes: >-
      Refined all five P3 operations with contact detail/history/delivery schemas, status CAS,
      recipient email normalization and soft delete; exposed the controller/filter versus service
      ROLE_COMMERCIAL drift, PII and non-idempotent mutation semantics without promotion.
  - version: 0.2.0
    date: 2026-09-10
    compatibility: draft-breaking-refinement
    changes: Refined six P1 operations with observed contacts, recipient, settings and public idempotent intake shapes; exposed annotation/service RBAC drift and technical-token/rate-limit boundaries.
  - version: 0.1.0
    date: 2026-09-10
    compatibility: initial-draft
    changes: Extracted the legacy baseline for 11 previously uncovered operations.
