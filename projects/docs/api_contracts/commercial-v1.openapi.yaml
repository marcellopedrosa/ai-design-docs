        draftContractVersion: 0.3.0
        compatibilityDecision: required-before-active
  /api/v1/admin/commercial/contacts/{id}/status:
    patch:
      operationId: updateStatus
      tags: [CommercialContactAdminController]
      summary: Append a status follow-up to a commercial contact
      description: >-
        Appends an immutable actor/time/note history item and updates the contact using a
        compare-and-set against the previously read status in one platform transaction. Repeated
        requests are not idempotent and no If-Match or idempotency key is accepted. The request
        actor is always taken from the authenticated principal. SecurityConfig and method security
        admit Commercial or Super Admin, while the service requires a raw global Super Admin, so
        ROLE_COMMERCIAL currently receives 403. Unknown request members are ignored by Jackson.
      security:
        - bearerAuth: []
      x-required-roles:
        - ROLE_SUPER_ADMIN
      x-route-admitted-roles: [ROLE_COMMERCIAL, ROLE_SUPER_ADMIN]
      x-tenant-boundary: Admin-realm principal without tenant_id, X-Tenant-ID or active TenantContext.
      x-required-authorities:
        []
      x-authorization-source: "SecurityConfig admin matcher; @PreAuthorize"
      x-authorization-review: observed-conflicting-enforcement-owner-decision-required
      x-preauthorize-expression: "hasAnyRole('SUPER_ADMIN', 'COMMERCIAL')"
      x-contract-priority: 3
      x-priority-basis: "Administrative, identity-related or sensitive-data surface."
      x-source-controller: "backend/src/main/java/br/com/duoset/saas_service/contexts/commercial/internal/presentation/rest/CommercialContactAdminController.java:90"
      x-source-method: "CommercialContactAdminController.updateStatus"
      x-source-confidence: observed-not-approved
      x-open-questions:
        - id: COMMERCIAL-UPDATESTATUS-001
          blocking: true
          action: Approve status transition, history, audit/PII exposure and concurrency semantics, including repeated same-status writes.
        - id: COMMERCIAL-UPDATESTATUS-002
          blocking: true
          action: Resolve ROLE_COMMERCIAL allowed by URL/method versus rejected by the service and bind the outcome to PRD/REQ/UC sources.
        - id: COMMERCIAL-UPDATESTATUS-003
          blocking: true
          action: Decide optimistic-concurrency/idempotency headers and prove 400/403/404/409 plus strict frontend parity.
      parameters:
        - name: id
          in: path
          required: true
          x-java-type: "UUID"
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommercialContactStatusRequest'
      responses:
        '200':
          description: Updated contact detail including the newly appended history entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialContactDetail'
          x-source-confidence: observed-not-approved
          x-response-review: observed-static-owner-approval-required
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '403':
          $ref: '#/components/responses/LegacyForbidden'
        '404':
          $ref: '#/components/responses/CommercialNotFound'
        '409':
          $ref: '#/components/responses/CommercialConflict'
        '500':
          $ref: '#/components/responses/LegacyInternalFailure'
      x-error-contract-review: required
      x-version-policy:
        publicMajor: v1
        draftContractVersion: 0.3.0
        compatibilityDecision: required-before-active
