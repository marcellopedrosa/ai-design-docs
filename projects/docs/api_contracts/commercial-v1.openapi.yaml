paths:
  /api/v1/admin/commercial/contacts/{id}:
    get:
      operationId: getContact
      tags: [CommercialContactAdminController]
      summary: Get a commercial contact with follow-up and delivery evidence
      description: >-
        Returns platform-global contact PII, status history and notification delivery evidence.
        SecurityConfig and method security admit Commercial or Super Admin in the admin realm
        without tenant context, but the current service still requires a raw global Super Admin;
        a Commercial principal therefore reaches the method and receives 403. History is newest
        first; no cache or redaction policy is declared. This is observed behavior, not approval.
      security:
        - bearerAuth: []
      x-required-roles:
        - ROLE_SUPER_ADMIN
      x-route-admitted-roles: [ROLE_COMMERCIAL, ROLE_SUPER_ADMIN]
      x-tenant-boundary: Admin-realm principal without tenant_id, X-Tenant-ID or active TenantContext.
      x-required-authorities:
        []
      x-authorization-source: "SecurityConfig admin matcher; @PreAuthorize"
      x-authorization-review: observed-conflicting-enforcement-owner-decision-required
      x-preauthorize-expression: "hasAnyRole('SUPER_ADMIN', 'COMMERCIAL')"
      x-contract-priority: 3
      x-priority-basis: "Administrative, identity-related or sensitive-data surface."
      x-source-controller: "backend/src/main/java/br/com/duoset/saas_service/contexts/commercial/internal/presentation/rest/CommercialContactAdminController.java:84"
      x-source-method: "CommercialContactAdminController.getContact"
      x-source-confidence: observed-not-approved
      x-open-questions:
        - id: COMMERCIAL-GETCONTACT-001
          blocking: true
          action: Approve PII, history and delivery visibility, ordering, redaction, retention and cache policy.
        - id: COMMERCIAL-GETCONTACT-002
          blocking: true
          action: Resolve ROLE_COMMERCIAL allowed by URL/method versus rejected by the service and bind the outcome to PRD/REQ/UC sources.
        - id: COMMERCIAL-GETCONTACT-003
          blocking: true
          action: Prove positive and negative parity for admin realm, absent tenant context, not-found body and the strict frontend schema.
      parameters:
        - name: id
          in: path
          required: true
          x-java-type: "UUID"
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Full contact detail with status history and notification delivery evidence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialContactDetail'
          x-source-confidence: observed-not-approved
          x-response-review: observed-static-owner-approval-required
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
