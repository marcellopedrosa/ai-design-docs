  /api/v1/admin/commercial/notification-recipients/{id}:
    delete:
      operationId: deleteRecipient
      tags: [CommercialContactAdminController]
      summary: Soft-delete a commercial notification recipient
      description: >-
        Requires a raw global Super Admin with no tenant claim, header or active impersonation.
        Marks the recipient inactive and sets deletedAt/updatedBy/updatedAt in the platform
        database, then returns bodyless 204. A repeated delete returns 404, so the operation is
        not idempotent at the HTTP outcome level. The authenticated actor and server clock are
        authoritative. This is observed behavior, not an approved lifecycle policy.
      security:
        - bearerAuth: []
      x-required-roles:
        - ROLE_SUPER_ADMIN
      x-tenant-boundary: Admin-realm principal without tenant_id, X-Tenant-ID or active TenantContext.
