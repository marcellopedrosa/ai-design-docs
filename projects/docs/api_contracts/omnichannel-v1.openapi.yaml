      tags: [LlmProviderAdminController]
      summary: Test an LLM provider configuration
      description: >-
        Sends a synchronous fixed ping prompt through the adapter selected by type without
        persisting the submitted configuration. Defaults are gpt-4o-mini or gemini-flash-latest,
        temperature 0 and maxTokens 50. When apiKey begins with sk-*** and providerId resolves, the
        stored key is decrypted; otherwise the submitted key is used. A blank provider response or
        any downstream failure returns the same closed HTTP 400 envelope.
