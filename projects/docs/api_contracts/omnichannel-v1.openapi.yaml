    post:
      operationId: handleWebhook
      tags: [WhatsAppWebhookController]
      summary: Receive WhatsApp messages and delivery receipts
      description: >-
        Public provider callback authenticated by HMAC-SHA-256 over the raw UTF-8 body. Supported
        text and interactive messages are routed by active WABA and phone-number configuration,
        freshness checked and durably/idempotently stored before ACK. Delivery/read receipts are
        only queued for asynchronous processing. A request may contain multiple tenant routes;
        each message commits independently, so a later 503 can follow earlier durable commits and
        provider replay is required for convergence. Unsupported, malformed or stale events are
        normally acknowledged with 200. Current raw traffic logging may persist an invalid-signature
        payload; message, receipt and mixed-staleness branches suppress it. This is observed behavior,
        not an approved provider contract.
