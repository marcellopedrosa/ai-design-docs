    post:
      operationId: configureProvider
      tags: [LlmProviderAdminController]
      summary: Legacy configureProvider operation
      description: >-
        Creates an active global or tenant-associated LLM provider and returns HTTP 200. The first
        active provider in that scope receives priority 1; the API key is encrypted at rest and the
        response's legacy apiKeyEncrypted field contains only a mask.
      security:
        - bearerAuth: []
      x-required-roles:
        - ROLE_SUPER_ADMIN
      x-required-authorities:
        []
      x-authorization-source: "SecurityConfig authenticated fallback; @PreAuthorize"
      x-authorization-review: required
      x-preauthorize-expression: "hasRole('SUPER_ADMIN')"
      x-contract-priority: 1
      x-priority-basis: "Static route evidence found under frontend/ or website/."
      x-source-controller: "backend/src/main/java/br/com/duoset/saas_service/contexts/omnichannel/internal/presentation/rest/LlmProviderAdminController.java:39"
      x-source-method: "LlmProviderAdminController.configureProvider"
      x-source-confidence: observed-not-approved
      x-open-questions:
        - id: OMNICHANNEL-CONFIGUREPROVIDER-001
          blocking: true
          action: Approve provider/tenant ownership, 200 versus 201, numeric bounds, baseUrl egress/SSRF, secret lifecycle, uniqueness and priority concurrency.
        - id: OMNICHANNEL-CONFIGUREPROVIDER-002
          blocking: true
          action: Confirm authorization, tenant boundary, consumers and compatibility from canonical sources.
      x-consumer-evidence:
        - "/api/admin/llm/providers"
        - "frontend/src/services/llmAdminService.ts"
      x-consumer-drift: Frontend enum includes CLAUDE, which the backend LlmProviderType rejects; backend supports only GEMINI, OPENAI and OLLAMA.
