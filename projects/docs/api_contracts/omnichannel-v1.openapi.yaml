  /api/admin/llm/providers/fallback:
    put:
      operationId: updateFallbackStrategy
      tags: [LlmProviderAdminController]
      summary: Replace the ordered global fallback-provider strategy
      description: >-
        Applies only to global providers (tenantId is hard-coded to null). The provider already at
        priority 1 remains primary; listed existing providers receive priorities 2..n in request
        order and every other non-primary global provider is reset to priority 0. Unknown,
        duplicated and tenant-scoped IDs are silently ignored. Each matching provider is saved
        independently inside one platform transaction and success has no body.
      security:
        - bearerAuth: []
      x-required-roles:
        - ROLE_SUPER_ADMIN
      x-required-authorities:
        []
      x-authorization-source: "SecurityConfig authenticated fallback; @PreAuthorize"
      x-authorization-review: required
      x-preauthorize-expression: "hasRole('SUPER_ADMIN')"
      x-contract-priority: 3
      x-priority-basis: "Administrative, identity-related or sensitive-data surface."
      x-source-controller: "backend/src/main/java/br/com/duoset/saas_service/contexts/omnichannel/internal/presentation/rest/LlmProviderAdminController.java:69"
      x-source-method: "LlmProviderAdminController.updateFallbackStrategy"
      x-source-confidence: observed-not-approved
      x-open-questions:
        - id: OMNICHANNEL-UPDATEFALLBACKSTRATEGY-001
          blocking: true
          action: Approve global-only ownership, primary immutability, duplicate/unknown-ID behavior and whether an empty list may clear every fallback.
        - id: OMNICHANNEL-UPDATEFALLBACKSTRATEGY-002
          blocking: true
          action: Define optimistic concurrency/idempotency guarantees and decide whether fallback IDs must be unique and belong to the selected scope.
      x-consumer-evidence:
        - "/api/admin/llm/providers/fallback"
        - "frontend/src/services/llmAdminService.ts"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmFallbackStrategyRequest'
      responses:
        '200':
          description: Priorities were recalculated; the response is bodyless.
          x-source-confidence: observed-not-approved
          x-response-review: observed-shape-product-approval-required
        '400':
