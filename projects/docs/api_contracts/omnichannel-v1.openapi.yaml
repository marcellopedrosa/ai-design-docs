openapi: 3.1.0
info:
  title: SaaS Service Omnichannel Legacy API Baseline
  version: 0.10.0
  description: >-
    Draft, non-implementable projection of 54 legacy Omnichannel HTTP operations extracted
    from Spring MVC controllers. Version 0.2.0 refines the first 10 P1 operations covering LLM
    prompts and channel templates against domain, persistence and frontend evidence; version 0.3.0
    adds tenant messaging configurations and access validations; version 0.4.0 completes the 24
    P1 operations with functions, provider, fiscal extraction, usage and webhook logs; version
    0.5.0 refines the three P2 Telegram and WhatsApp provider-webhook operations; version 0.6.0
    refines all 14 P3 administrative and sensitive operations covering providers, prompts,
    functions and WhatsApp receipt routes; and version 0.7.0 refines four P4 Telegram and
    WhatsApp configuration mutations; version 0.8.0 closes all nine P5 function-toggle,
    ephemeral-diagnostic and conversation-administration projections; version 0.9.0 cataloged
    four frontend-only webhook-management calls; and version 0.10.0 removes those projections after
    their orphan consumers were expunged. It records observed behavior and unresolved design gaps;
    it does not approve current behavior.
x-document-metadata:
  documentId: OMNICHANNEL-V1
  primaryNature: Contrato
  owner: Arquitetura, Backend e Qualidade
  status: Draft
  date: 2026-09-10
  lastReviewed: 2026-09-11
  normativeBaseline: TP-00052 v1.35, TP-00057 v1.0, ANL-00055 v1.32, ANL-00056 v1.33 and ANL-00057 v1.3; operation-level product sources remain required
  relatedFiles:
    - docs/delivery/plans/TP-00052-backend-api-contract-baseline.md
    - docs/analysis/ANL-00055-backend-api-contract-coverage-inventory.md
    - docs/analysis/ANL-00057-frontend-backend-api-contract-catalog.md
    - docs/agents/standards/api-client-standard.md
