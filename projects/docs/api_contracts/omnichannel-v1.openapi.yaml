      x-required-roles:
        []
      x-required-authorities:
        []
      x-authorization-source: "SecurityConfig permitAll matcher"
      x-authorization-review: observed-provider-hmac-unapproved
      x-public-protection-review: >-
        Bind the Meta payload/API version, approve multi-route partial commits, eliminate raw logging
        before authentication and prove trusted-proxy/distributed rate-limit behavior.
      x-provider-authentication: >-
        X-Hub-Signature-256 must be exactly sha256= plus 64 hexadecimal characters and match an
        HMAC-SHA-256 of the raw UTF-8 body using the configured app secret; malformed input is a
        bodyless 401. The secret is startup-validated at a minimum of 16 characters.
      x-replay-protection: >-
        Supported messages use a configurable authenticated-receive window (default 15 minutes old
        and 2 minutes future; configured bounds 1 minute..12 hours and 0..5 minutes) plus idempotent
        persistence by provider identity. Delivery/read receipts are admitted asynchronously and
        do not share this freshness filter in the controller.
      x-rate-limit: >-
        In-memory per-instance bucket of 50 requests, fully refilled after more than one second,
        keyed by the unvalidated first X-Forwarded-For value or remote address; no Retry-After.
      x-batch-atomicity: >-
        Not atomic across messages or tenants. Each accepted message commits independently before
        the next item. Receipt submission happens after message commits and can still return 503.
      x-contract-priority: 2
      x-priority-basis: "Public endpoint or inbound webhook."
      x-source-controller: "backend/src/main/java/br/com/duoset/saas_service/contexts/omnichannel/internal/presentation/rest/WhatsAppWebhookController.java:78"
      x-source-method: "WhatsAppWebhookController.handleWebhook"
      x-source-confidence: observed-not-approved
      x-open-questions:
        - id: OMNICHANNEL-HANDLEWEBHOOK-001
          blocking: true
          action: Bind the supported WhatsApp message/status fields and Meta Graph API version to an owner-approved provider schema.
        - id: OMNICHANNEL-HANDLEWEBHOOK-002
          blocking: true
          action: Approve HMAC secret rotation, route resolution, freshness and idempotency negative cases.
        - id: OMNICHANNEL-HANDLEWEBHOOK-003
          blocking: true
          action: Decide atomicity and retry semantics for multi-message, multi-tenant and mixed message/receipt batches.
        - id: OMNICHANNEL-HANDLEWEBHOOK-004
          blocking: true
          action: Remove or explicitly approve persistence of invalid-signature raw provider payloads in webhook logs.
        - id: OMNICHANNEL-HANDLEWEBHOOK-005
          blocking: true
          action: Approve trusted-proxy handling, distributed rate-limit semantics and required 429/503 headers.
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: false
          x-java-type: "String"
          schema:
            type: string
            pattern: '^sha256=[0-9A-Fa-f]{64}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppWebhookPayload'
      responses:
        '200':
          description: >-
            Bodyless ACK after durable message acceptance, receipt queue admission, duplicate
            convergence, or ignored unsupported/malformed/stale provider content.
          x-response-review: observed-bodyless-product-and-provider-approval-required
        '400':
          description: >-
            Binding or container rejection when the required raw request body is absent or unreadable;
            exact body and media type require an executable parity fixture.
          x-source-confidence: framework-capability-not-demonstrated
        '401':
          description: Bodyless rejection when X-Hub-Signature-256 is absent, malformed or invalid.
        '429':
          $ref: '#/components/responses/WebhookRateLimitExceeded'
        '503':
          description: >-
            Bodyless rejection when durable message acceptance or receipt queue admission fails;
            earlier messages in the same request may already be committed.
        '500':
          $ref: '#/components/responses/LegacyInternalFailure'
