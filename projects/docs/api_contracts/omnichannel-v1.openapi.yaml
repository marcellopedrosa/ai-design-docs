  /api/v1/telegram/webhook/{tenantId}/{botConfigId}:
    post:
      operationId: handleUpdate
      tags: [TelegramWebhookController]
      summary: Receive a Telegram Bot API update
      description: >-
        Public provider callback. The controller routes through the tenant UUID from the path,
        resolves an active bot configuration in that tenant and compares the optional provider
        secret in constant time. Unsupported or malformed updates and stale non-callback messages
        are deliberately acknowledged with 200. Accepted messages are durably and idempotently
        stored before ACK; the post-commit wake-up is best effort. Telegram callbacks bypass the
        timestamp freshness check and are constrained to an existing conversation. Current raw
        traffic logging may persist an unauthenticated, unknown or malformed payload; callback and
        stale payloads are suppressed. This is observed behavior, not an approval of the boundary.
      security: []
      x-required-roles:
        []
      x-required-authorities:
        []
      x-authorization-source: "SecurityConfig permitAll matcher"
      x-authorization-review: observed-provider-secret-unapproved
      x-public-protection-review: >-
        Validate provider-schema/version ownership, eliminate configuration enumeration between
        401 and 404, prove trusted-proxy client identity and approve the callback replay exception.
      x-provider-authentication: >-
        Active bot configuration plus constant-time comparison of
        X-Telegram-Bot-Api-Secret-Token; absent or mismatched configuration returns 404, while an
        existing configuration with absent or mismatched secret returns 401.
      x-replay-protection: >-
        Non-callback events use a configurable authenticated-receive window (default 15 minutes
        old and 2 minutes future; configured bounds 1 minute..12 hours and 0..5 minutes).
        Callback queries have no trustworthy occurrence timestamp and use existing-conversation
        enforcement plus idempotent durable storage instead.
      x-rate-limit: >-
        In-memory per-instance bucket of 50 requests, fully refilled after more than one second,
        keyed by the unvalidated first X-Forwarded-For value or remote address; no Retry-After.
      x-contract-priority: 2
      x-priority-basis: "Public endpoint or inbound webhook."
      x-source-controller: "backend/src/main/java/br/com/duoset/saas_service/contexts/omnichannel/internal/presentation/rest/TelegramWebhookController.java:67"
      x-source-method: "TelegramWebhookController.handleUpdate"
      x-source-confidence: observed-not-approved
      x-open-questions:
        - id: OMNICHANNEL-HANDLEUPDATE-001
          blocking: true
          action: Bind the supported Telegram Update fields and Telegram Bot API version to an owner-approved provider schema.
        - id: OMNICHANNEL-HANDLEUPDATE-002
          blocking: true
          action: Approve the tenant-routing and secret-token model, including the observable 401/404 distinction and negative cases.
        - id: OMNICHANNEL-HANDLEUPDATE-003
          blocking: true
          action: Approve trusted-proxy handling, distributed rate-limit semantics, replay policy and response headers/media types.
        - id: OMNICHANNEL-HANDLEUPDATE-004
          blocking: true
          action: Remove or explicitly approve persistence of unauthenticated and malformed raw provider payloads in webhook logs.
      parameters:
