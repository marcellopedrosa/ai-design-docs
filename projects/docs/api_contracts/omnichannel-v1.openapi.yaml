x-open-questions:
  - id: OMNICHANNEL-BASELINE-001
    topic: schemas
    blocking: true
    action: Replace every permissive Java-type projection with a closed, validated wire schema.
  - id: OMNICHANNEL-BASELINE-002
    topic: errors
    blocking: true
    action: Validate operation-specific error codes, bodies and headers; decide the RFC 9457 migration boundary.
  - id: OMNICHANNEL-BASELINE-003
    topic: authorization
    blocking: true
    action: Validate route and method authorization, role composition, tenant boundary and negative cases.
  - id: OMNICHANNEL-BASELINE-004
    topic: consumers
    blocking: true
    action: Confirm consumers and update each affected official document with version and operationIds.
x-change-log:
  - version: 0.10.0
    date: 2026-09-11
    compatibility: draft-catalog-correction
    changes: >-
      Removed four generic outbound webhook-management projections after their unmounted frontend
      consumers, mocks and types were expunged by TP-00057. Telegram and WhatsApp provider callbacks,
      provider configuration APIs and webhook diagnostics remain unchanged.
  - version: 0.9.0
    date: 2026-09-10
    compatibility: draft-catalog-extension
    changes: >-
      Cataloged four production frontend webhook-management calls without a matching backend
      controller as consumer-only/backend-unimplemented operations; no runtime behavior was changed
      or inferred.
  - version: 0.8.0
    date: 2026-09-10
    compatibility: draft-breaking-refinement
    changes: >-
      Refined all nine P5 operations for tenant function toggle, bounded in-memory Telegram
      diagnostics and conversation administration; documented exact no-store/403/404/429 variants,
      legacy Spring Page output, frontend drift and missing tenant ownership checks without promotion.
      The same validation batch also removed shadowed duplicate
      ChatbotFunctionToggleRequest and SuccessOnlyEnvelope components without changing their
      effective last-definition wire projections or promoting the contract.
  - version: 0.7.0
    date: 2026-09-10
    compatibility: draft-refinement
    changes: >-
      Refined four P4 Telegram and WhatsApp configuration update/delete operations; documented
      secret-mask semantics, tenant-versus-global ownership, after-commit provider transitions,
      hard deletion and missing provider synchronization/audit without promotion.
  - version: 0.6.0
    date: 2026-09-10
    compatibility: draft-refinement
    changes: >-
      Refined all three P2 provider-webhook operations for Telegram and WhatsApp; documented
      provider authentication, replay handling, durable acceptance, partial-batch behavior,
      bodyless and plain-text errors, local rate limiting and raw-payload logging risks without
      promoting the operations.
  - version: 0.4.0
    date: 2026-09-10
    compatibility: draft-refinement
    changes: >-
      Completed the remaining seven P1 operations for functions, LLM provider creation, fiscal LLM
      extraction, usage and webhook logs; documented envelopes, secrets, effective tenant,
      sensitive data, pagination and consumer enum/default drifts without promotion.
  - version: 0.3.0
    date: 2026-09-10
    compatibility: draft-refinement
    changes: >-
      Refined seven P1 operations for Telegram/WhatsApp configuration and tenant access
      validation; documented masking, global-versus-tenant boundaries, ignored fields, async side
      effects and materially incompatible frontend payload/envelope shapes without promotion.
  - version: 0.2.0
    date: 2026-09-10
    compatibility: draft-refinement
    changes: >-
      Refined five LLM prompt and five channel-template P1 operations; closed observed response
      shapes, documented permissive request binding, legacy 400 errors and frontend/backend drifts
      for prompt fields, status toggles and bodyless deletes without authorizing implementation.
  - version: 0.1.0
    date: 2026-09-10
    compatibility: initial-draft
    changes: Extracted the legacy baseline for 54 previously uncovered operations.
