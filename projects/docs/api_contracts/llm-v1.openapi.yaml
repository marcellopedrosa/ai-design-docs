components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    LegacyBadRequest:
      description: Current shared handlers may emit a 400 JSON error; exact operation codes and variants require validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyUnauthorized:
      description: Current security entry point emits a 401 JSON error; migration to RFC 9457 requires a versioned decision.
      headers:
        WWW-Authenticate:
          description: Bearer challenge governed by RFC 9110.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacySecurityError'
    LegacyForbidden:
      description: Current security or exception handler emits a 403 JSON error; exact boundary variants require validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacySecurityError'
    LegacyInternalFailure:
      description: Current shared handler emits a sanitized 500 JSON error with an errorId.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
  schemas:
    CreateLlmModelRequest:
      type: object
      additionalProperties: true
      description: >-
        Observed successful persistence request. Jackson currently ignores unknown
        members; closing that boundary requires a compatibility decision.
      required: [provider, modelName, endpointUrl, apiKey]
      properties:
        provider:
          $ref: '#/components/schemas/LlmProvider'
        modelName:
          type: string
        endpointUrl:
          type: string
        apiKey:
          type: string
          writeOnly: true
        temperature:
          type: [number, 'null']
          format: double
        maxTokens:
          type: [integer, 'null']
          format: int32
    LlmConnectionRequest:
      type: object
      additionalProperties: true
      description: >-
        Observed fields consumed by testConnection and fetchRemoteModels. The same
        Java DTO accepts and ignores modelName, temperature and maxTokens here.
      required: [provider, endpointUrl, apiKey]
      properties:
        provider:
          $ref: '#/components/schemas/LlmProvider'
        endpointUrl:
          type: string
        apiKey:
          type: string
          writeOnly: true
        modelName:
          type: string
          deprecated: true
          description: Accepted by the shared DTO but ignored by these two operations.
        temperature:
          type: [number, 'null']
          format: double
          deprecated: true
          description: Accepted by the shared DTO but ignored by these two operations.
        maxTokens:
          type: [integer, 'null']
          format: int32
          deprecated: true
          description: Accepted by the shared DTO but ignored by these two operations.
    LlmProvider:
      type: string
      enum: [OPENAI, GEMINI, ANTHROPIC, CUSTOM]
      description: >-
        Domain enum accepted by the DTO. Current connection-test and remote-model
        strategies exist only for OPENAI and GEMINI.
    LlmModel:
      type: object
      additionalProperties: false
      description: Observed LlmModelResponse shape; apiKey is always the fixed mask.
      required: [id, provider, modelName, endpointUrl, apiKey, temperature, maxTokens]
      properties:
        id:
          type: string
          format: uuid
        provider:
          $ref: '#/components/schemas/LlmProvider'
        modelName:
          type: string
        endpointUrl:
          type: string
        apiKey:
          type: string
          const: '********'
          readOnly: true
        temperature:
          type: [number, 'null']
          format: double
        maxTokens:
          type: [integer, 'null']
          format: int32
    LegacyError:
      type: object
      description: Observed non-RFC-9457 envelope; variants remain a blocking review item.
      additionalProperties: true
      required: [message]
      properties:
        message:
          type: string
        errorId:
          type: string
          format: uuid
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
      x-schema-review: required
    LegacySecurityError:
      type: object
      description: Observed default security envelope; specialized path handlers may differ.
      additionalProperties: true
      required: [error, message, status, timestamp, path]
      properties:
        error:
          type: string
        message:
          type: string
        status:
          type: integer
        timestamp:
          type: string
          format: date-time
        path:
          type: string
      x-schema-review: required
    Problem:
      type: object
      description: Target Problem Details shape governed by RFC 9457; not claimed as current legacy behavior.
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
