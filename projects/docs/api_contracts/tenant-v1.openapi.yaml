paths:
  /api/admin/tenants:
    post:
      operationId: tenantAdminCreateTenant
      tags: [TenantAdminController]
      summary: Provision a tenant through the legacy administrative boundary
      description: >-
        Legacy duplicate of the v1 tenant-creation capability with a different request and response.
        It creates a physical database outside a transaction, registers datasource/metadata,
        provisions an IAM realm and publishes an event, compensating those resources best effort in
        reverse order after failure. The controller has no Bean Validation; unknown members are
        ignored and missing fields fail heterogeneously. adminName and adminPassword are accepted by
        the command but are not consumed by the observed onboarding path. loginUrl is populated from
        the tenant domain template, not an authentication transaction. No idempotency key is accepted.
      security:
        - bearerAuth: []
      x-required-roles:
        - ROLE_SUPER_ADMIN
      x-required-authorities:
        []
      x-authorization-source: "SecurityConfig authenticated fallback; @PreAuthorize"
      x-authorization-review: observed-super-admin-global-boundary-approval-required
      x-tenant-boundary: >-
        ROLE_SUPER_ADMIN is required, but this route has no explicit raw-global/no-impersonation
        guard comparable to platform control-plane endpoints.
      x-preauthorize-expression: "hasRole('SUPER_ADMIN')"
      x-contract-priority: 3
      x-priority-basis: "Administrative, identity-related or sensitive-data surface."
      x-source-controller: "backend/src/main/java/br/com/duoset/saas_service/contexts/tenant/internal/presentation/rest/TenantAdminController.java:21"
      x-source-method: "TenantAdminController.createTenant"
      x-source-confidence: observed-not-approved
      x-open-questions:
        - id: TENANT-TENANTADMINCREATETENANT-001
          blocking: true
          action: Decide whether this duplicate legacy route remains public, aliases v1 or is deprecated with a migration window.
        - id: TENANT-TENANTADMINCREATETENANT-002
          blocking: true
          action: Approve field validation/defaults, unused admin credentials, loginUrl semantics and raw-global/no-impersonation authorization.
        - id: TENANT-TENANTADMINCREATETENANT-003
          blocking: true
          action: Approve idempotency and compensation/recovery for database, metadata, datasource, IAM realm and event partial failures.
        - id: TENANT-TENANTADMINCREATETENANT-004
          blocking: true
          action: Prove 201 and negative 400/401/403/409/500 parity; no production frontend consumer was found.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegacyAdminCreateTenantRequest'
      responses:
        '201':
          description: Tenant resources provisioned and registration receipt returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantRegistrationResult'
          x-source-confidence: observed-not-approved
          x-response-review: observed-shape-product-approval-required
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '403':
          $ref: '#/components/responses/LegacyForbidden'
        '409':
          description: >-
            Potential target contract for duplicate documento or slug; current BusinessException
            is instead handled as 400 and migration requires a versioned decision.
          x-source-confidence: target-not-current
        '500':
          $ref: '#/components/responses/LegacyInternalFailure'
      x-error-contract-review: required
      x-version-policy:
        publicMajor: v1
        draftContractVersion: 0.11.0
        compatibilityDecision: required-before-active
