x-open-questions:
  - id: TENANT-BASELINE-001
    topic: schemas
    blocking: true
    action: Replace every permissive Java-type projection with a closed, validated wire schema.
  - id: TENANT-BASELINE-002
    topic: errors
    blocking: true
    action: Validate operation-specific error codes, bodies and headers; decide the RFC 9457 migration boundary.
  - id: TENANT-BASELINE-003
    topic: authorization
    blocking: true
    action: Validate route and method authorization, role composition, tenant boundary and negative cases.
  - id: TENANT-BASELINE-004
    topic: consumers
    blocking: true
    action: Confirm consumers and update each affected official document with version and operationIds.
x-change-log:
  - version: 0.11.0
    date: 2026-09-11
    compatibility: draft-catalog-correction
    changes: >-
      Removed the frontend-only global tenant-search projection after its unused service, hook,
      mock and type were expunged by TP-00057; no backend operation was changed.
  - version: 0.10.0
    date: 2026-09-10
    compatibility: draft-catalog-extension
    changes: >-
      Cataloged the production frontend global tenant-search call without a matching backend
      controller as consumer-only/backend-unimplemented; no runtime behavior was changed or inferred.
  - version: 0.9.0
    date: 2026-09-10
    compatibility: draft-breaking-refinement
    changes: >-
      Refined the two P5 operations for asynchronous tenant-pool rollback and global slug
      availability; corrected rollback to HTTP 202 with strict JSON, strong ETag and idempotency,
      and documented fail-open catalog lookup plus the non-reserving slug suggestion race.
  - version: 0.8.0
    date: 2026-09-10
    compatibility: draft-refinement
    changes: >-
      Refined the P4 current-tenant SERPRO credential mutation; documented exact-mask retention,
      blank-secret clearing, encrypted persistence, tenant-scoped auditing and the stricter
      frontend validation drift without promoting the operation.
  - version: 0.7.0
    date: 2026-09-10
    compatibility: draft-refinement
    changes: >-
      Refined all four P3 operations for legacy tenant onboarding, SERPRO credential presence and
      traffic-inspector settings; documented unused admin fields, non-transactional provisioning,
      missing-tenant false defaults and primitive-boolean disable behavior without promotion.
  - version: 0.6.0
    date: 2026-09-10
    compatibility: draft-refinement
    changes: >-
      Completed the two remaining P1 pool-policy operations with strict schemas, ETag, idempotency,
      asynchronous 202, platform boundary, rate limit and RFC 9457-compatible errors; retained Draft
      pending current product-gate binding and parity rerun.
  - version: 0.5.0
    date: 2026-09-10
    compatibility: draft-refinement
    changes: >-
      Refined six P1 tenant-user operations; documented unprefixed output roles, bodyless mutations,
      tenant path enforcement, quota/readiness checks and IAM/local/event partial-failure risks without
      promotion.
  - version: 0.4.0
    date: 2026-09-10
    compatibility: draft-refinement
    changes: >-
      Refined five P1 tenant lifecycle operations for list, create, detail, update and subscription;
      documented the Spring Page envelope, effective tenant path boundary, onboarding compensation,
      placeholder usage metrics and frontend request/response drifts without promotion.
  - version: 0.3.0
    date: 2026-09-10
    compatibility: draft-refinement
    changes: >-
      Refined five P1 operations for invite activation, tenant discovery and own profile/password;
      documented public enumeration/abuse, token consumption, issuer/realm binding, password grant,
      IAM-only profile updates and bodyless responses without promotion.
  - version: 0.2.0
    date: 2026-09-10
    compatibility: draft-refinement
    changes: >-
      Refined four Super Admin identity P1 operations; documented validation, profiles/status,
      bodyless mutations, IAM/local-mirror partial-failure risk and legacy 400 errors without promotion.
  - version: 0.1.0
    date: 2026-09-10
    compatibility: initial-draft
    changes: Extracted the legacy baseline for 29 previously uncovered operations.
