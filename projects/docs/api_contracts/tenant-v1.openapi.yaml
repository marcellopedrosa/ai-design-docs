openapi: 3.1.0
info:
  title: SaaS Service Tenant Legacy API Baseline
  version: 0.11.0
  description: >-
    Draft, non-implementable projection of 29 legacy Tenant HTTP operations extracted
    from Spring MVC controllers. Version 0.2.0 refines the four P1 global-admin identity operations;
    version 0.3.0 adds public invite/discovery and authenticated user profile operations against
    validation, domain, IAM and frontend evidence; version 0.4.0 refines the five tenant lifecycle
    operations; version 0.5.0 refines the six tenant-user administration operations; version
    0.6.0 completes P1 with the pool-policy read/update pair; version 0.7.0 refines four P3
    legacy onboarding, SERPRO credential-status and traffic-inspector operations; and version
    0.8.0 refines the P4 SERPRO credential mutation; and version 0.9.0 closes the
    observed P5 rollback and slug-availability wire projections; version 0.10.0 cataloged the
    frontend-only global tenant-search call; and version 0.11.0 removes that projection after its
    unused frontend consumer was expunged. It records
    observed code and unresolved design gaps; it is not approval of current behavior.
x-document-metadata:
  documentId: TENANT-V1
  primaryNature: Contrato
  owner: Arquitetura, Backend e Qualidade
  status: Draft
  date: 2026-09-10
  lastReviewed: 2026-09-11
  normativeBaseline: TP-00052 v1.35, TP-00057 v1.0, ANL-00055 v1.32, ANL-00056 v1.33 and ANL-00057 v1.3; operation-level product sources remain required
  relatedFiles:
    - docs/delivery/plans/TP-00052-backend-api-contract-baseline.md
    - docs/analysis/ANL-00055-backend-api-contract-coverage-inventory.md
    - docs/analysis/ANL-00057-frontend-backend-api-contract-catalog.md
    - docs/agents/standards/api-client-standard.md
