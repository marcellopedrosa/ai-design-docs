components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    LegacyBadRequest:
      description: Current shared handlers may emit a 400 JSON error; exact operation codes and variants require validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyUnauthorized:
      description: Current security entry point emits a 401 JSON error; migration to RFC 9457 requires a versioned decision.
      headers:
        WWW-Authenticate:
          description: Bearer challenge governed by RFC 9110.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacySecurityError'
    LegacyForbidden:
      description: Current security or exception handler emits a 403 JSON error; exact boundary variants require validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacySecurityError'
    LegacyInternalFailure:
      description: Current shared handler emits a sanitized 500 JSON error with an errorId.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    TenantPoolBadRequest:
      description: Malformed canonical tenantId, strict JSON, required header or transport value; errorCode is TENANT_POOL_POLICY_INVALID.
      headers:
        Cache-Control: {schema: {type: string, const: no-store}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/TenantPoolProblem'}
    TenantPoolUnauthorized:
      description: Authentication is missing or cannot be resolved; errorCode is UNAUTHORIZED.
      headers:
        Cache-Control: {schema: {type: string, const: no-store}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/TenantPoolProblem'}
    TenantPoolForbidden:
      description: Caller is not a raw global Super Admin or carries tenant context; errorCode is ACCESS_DENIED.
      headers:
        Cache-Control: {schema: {type: string, const: no-store}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/TenantPoolProblem'}
    TenantPoolTargetNotFound:
      description: Target tenant does not exist; errorCode is TENANT_POOL_TARGET_UNAVAILABLE.
      headers:
        Cache-Control: {schema: {type: string, const: no-store}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/TenantPoolProblem'}
    TenantPoolTargetNotProvisioned:
      description: Target is inactive, unprovisioned or lacks a policy head; errorCode is TENANT_POOL_TARGET_UNAVAILABLE.
      headers:
        Cache-Control: {schema: {type: string, const: no-store}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/TenantPoolProblem'}
    TenantPoolConflict:
      description: Stale revision, conflicting idempotency reuse, active change, unavailable target or insufficient capacity.
      headers:
        Cache-Control: {schema: {type: string, const: no-store}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/TenantPoolProblem'}
    TenantPoolUnprocessablePolicy:
      description: Structurally valid request violates policy or environment bounds; errorCode is TENANT_POOL_POLICY_INVALID.
      headers:
        Cache-Control: {schema: {type: string, const: no-store}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/TenantPoolProblem'}
    TenantPoolRateLimited:
      description: Per-actor administrative rate limit exceeded; errorCode is TENANT_POOL_RATE_LIMITED.
      headers:
        Retry-After:
          required: true
          description: Positive delay in seconds before a new attempt.
          schema: {type: integer, minimum: 1}
        Cache-Control: {schema: {type: string, const: no-store}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/TenantPoolProblem'}
    TenantPoolUnavailable:
      description: Read or mutation feature gate is disabled; current errorCode is TENANT_POOL_MUTATION_DISABLED for both paths.
      headers:
        Cache-Control: {schema: {type: string, const: no-store}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/TenantPoolProblem'}
  schemas:
    StrongEtag:
      type: string
      pattern: '^"[^"\r\n]+"$'
      description: Strong quoted entity tag; weak W/ validators are rejected.
    TenantPoolProblemCode:
      type: string
      enum:
        - UNAUTHORIZED
        - ACCESS_DENIED
        - TENANT_POOL_TARGET_UNAVAILABLE
        - TENANT_POOL_POLICY_INVALID
        - TENANT_POOL_REVISION_CONFLICT
        - IDEMPOTENCY_CONFLICT
        - TENANT_POOL_CHANGE_IN_PROGRESS
        - TENANT_POOL_CAPACITY_EXCEEDED
        - TENANT_POOL_RATE_LIMITED
        - TENANT_POOL_MUTATION_DISABLED
    TenantPoolProblem:
      type: object
      description: Feature-scoped Problem Details representation compatible with RFC 9457 fields plus stable extensions.
      additionalProperties: false
      required: [type, title, status, detail, instance, errorCode, traceId, timestamp]
      properties:
        type: {type: string, format: uri}
        title: {type: string, const: Falha na administração da política de pool}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string, minLength: 1}
        instance: {type: string, format: uri}
        errorCode: {$ref: '#/components/schemas/TenantPoolProblemCode'}
        traceId: {type: string, minLength: 1}
        timestamp: {type: string, format: date-time}
    TenantPoolProfileSource:
      type: string
      enum: [SMALL, STANDARD, ROBUST, CUSTOM]
    TenantPoolRolloutState:
      type: string
      enum: [PENDING, PREPARING, COMMITTED, CONVERGED, DEGRADED, FAILED]
    TenantPoolFailureCode:
      type: string
      enum: [CAPACITY_EXCEEDED, CANDIDATE_FAILED, CONNECTIVITY_FAILED, FENCING_FAILED, DRAIN_TIMEOUT, INTERNAL_ERROR]
    TenantPoolCapacityStatus:
      type: string
      enum: [AVAILABLE, INSUFFICIENT, UNKNOWN]
    TenantPoolPolicySnapshot:
      type: object
      description: Complete non-secret snapshot. Durations use ISO-8601; cross-field and effective environment bounds remain server-authoritative.
      additionalProperties: false
      required: [profileSource, minimumIdle, maximumPoolSize, connectionTimeout, validationTimeout, idleTimeout, maxLifetime, keepaliveTime]
      properties:
        profileSource: {$ref: '#/components/schemas/TenantPoolProfileSource'}
        minimumIdle: {type: integer, format: int32, minimum: 0}
        maximumPoolSize: {type: integer, format: int32, minimum: 1}
        connectionTimeout: {type: string, format: duration}
        validationTimeout: {type: string, format: duration}
        idleTimeout: {type: string, format: duration}
        maxLifetime: {type: string, format: duration}
        keepaliveTime: {type: string, format: duration}
      x-cross-field-invariants:
        - minimumIdle <= maximumPoolSize
        - validationTimeout <= connectionTimeout
        - keepaliveTime == PT0S or keepaliveTime < maxLifetime
    TenantPoolPolicyUpdateRequest:
      type: object
      additionalProperties: false
      required: [snapshot, reason]
      properties:
        snapshot: {$ref: '#/components/schemas/TenantPoolPolicySnapshot'}
        reason:
          type: string
          minLength: 10
          maxLength: 500
          description: Trimmed and rejected when it contains ISO control characters.
    TenantPoolPolicyRollbackRequest:
      type: object
      additionalProperties: false
      required: [sourceRevision, reason]
      properties:
        sourceRevision:
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string
          minLength: 10
          maxLength: 500
          description: Trimmed and rejected when it contains ISO control characters.
    TenantPoolPolicyOperation:
      type: object
      additionalProperties: false
      required: [operationId, tenantId, desiredRevision, committedRevision, state, policy, acceptedAt, updatedAt, failureCode]
      properties:
        operationId: {type: string, format: uuid}
        tenantId: {type: string, format: uuid}
        desiredRevision: {type: integer, format: int64, minimum: 1}
        committedRevision: {type: [integer, 'null'], format: int64, minimum: 1}
        state: {$ref: '#/components/schemas/TenantPoolRolloutState'}
        policy: {$ref: '#/components/schemas/TenantPoolPolicySnapshot'}
        acceptedAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        failureCode:
          anyOf:
            - $ref: '#/components/schemas/TenantPoolFailureCode'
            - type: 'null'
      x-cross-field-invariants:
        - committedRevision is null or committedRevision <= desiredRevision
        - updatedAt >= acceptedAt
        - FAILED requires failureCode; failureCode is otherwise allowed only for DEGRADED
    TenantPoolCapacity:
      type: object
      additionalProperties: false
      required: [status, replicasMax, safeConnectionBudget, allocatedConnections, remainingConnections]
      properties:
        status: {$ref: '#/components/schemas/TenantPoolCapacityStatus'}
        replicasMax: {type: [integer, 'null'], format: int32, minimum: 1}
        safeConnectionBudget: {type: [integer, 'null'], format: int32, minimum: 0}
        allocatedConnections: {type: [integer, 'null'], format: int32, minimum: 0}
        remainingConnections: {type: [integer, 'null'], format: int32, minimum: 0}
      x-cross-field-invariants:
        - UNKNOWN requires every fact null; other statuses require every fact non-null
    TenantPoolRollout:
      type: object
      additionalProperties: false
      required: [state, requiredRuntimeCount, readyRuntimeCount, swappedRuntimeCount, drainedRuntimeCount]
      properties:
        state: {$ref: '#/components/schemas/TenantPoolRolloutState'}
        requiredRuntimeCount: {type: integer, format: int32, minimum: 0}
        readyRuntimeCount: {type: integer, format: int32, minimum: 0}
        swappedRuntimeCount: {type: integer, format: int32, minimum: 0}
        drainedRuntimeCount: {type: integer, format: int32, minimum: 0}
      x-cross-field-invariants:
        - drainedRuntimeCount <= swappedRuntimeCount <= readyRuntimeCount <= requiredRuntimeCount
    TenantPoolBounds:
      type: object
      additionalProperties: false
      required: [minimumIdleMin, minimumIdleMax, maximumPoolSizeMin, maximumPoolSizeMax, connectionTimeoutMin, connectionTimeoutMax, validationTimeoutMin, validationTimeoutMax, idleTimeoutMinWhenEnabled, idleTimeoutMax, maxLifetimeMin, maxLifetimeMax, keepaliveTimeMinWhenEnabled, keepaliveTimeMax, rollbackWindow]
      properties:
        minimumIdleMin: {type: integer, format: int32, minimum: 0}
        minimumIdleMax: {type: integer, format: int32, minimum: 0}
        maximumPoolSizeMin: {type: integer, format: int32, minimum: 1}
        maximumPoolSizeMax: {type: integer, format: int32, minimum: 1}
        connectionTimeoutMin: {type: string, format: duration}
        connectionTimeoutMax: {type: string, format: duration}
        validationTimeoutMin: {type: string, format: duration}
        validationTimeoutMax: {type: string, format: duration}
        idleTimeoutMinWhenEnabled: {type: string, format: duration}
        idleTimeoutMax: {type: string, format: duration}
        maxLifetimeMin: {type: string, format: duration}
        maxLifetimeMax: {type: string, format: duration}
        keepaliveTimeMinWhenEnabled: {type: string, format: duration}
        keepaliveTimeMax: {type: string, format: duration}
        rollbackWindow: {type: string, format: duration}
    TenantPoolProfile:
      type: object
      additionalProperties: false
      required: [profileSource, policy]
      properties:
        profileSource: {type: string, enum: [SMALL, STANDARD, ROBUST]}
        policy: {$ref: '#/components/schemas/TenantPoolPolicySnapshot'}
    TenantPoolRevisionSummary:
      type: object
      additionalProperties: false
      required: [revision, profileSource, maximumPoolSize, createdAt, rollbackEligible]
      properties:
        revision: {type: integer, format: int64, minimum: 1}
        profileSource: {$ref: '#/components/schemas/TenantPoolProfileSource'}
