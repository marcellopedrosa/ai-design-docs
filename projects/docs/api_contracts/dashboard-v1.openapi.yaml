openapi: 3.1.0
info:
  title: SaaS Service Dashboard Legacy API Baseline
  version: 0.4.0
  description: >-
    Draft, non-implementable projection of 3 legacy Dashboard HTTP operations extracted
    from Spring MVC controllers. It records observed code and unresolved design gaps; it is not
    approval of the current behavior. Every x-open-questions item must be resolved from an approved
    requirement, use case, ADR or owner decision before any operation is promoted to Active.
x-document-metadata:
  documentId: DASHBOARD-V1
  primaryNature: Contrato
  owner: Arquitetura, Backend e Qualidade
  status: Draft
  date: 2026-09-10
  lastReviewed: 2026-09-12
  normativeBaseline: TP-00052 v1.36, ANL-00055 v1.33, ANL-00056 v1.34 and ANL-00057 v1.4; operation-level product sources remain required
  relatedFiles:
    - docs/delivery/plans/TP-00052-backend-api-contract-baseline.md
    - docs/analysis/ANL-00055-backend-api-contract-coverage-inventory.md
    - docs/analysis/ANL-00057-frontend-backend-api-contract-catalog.md
    - docs/analysis/ANL-00056-api-contract-validation-loop.md
    - docs/agents/standards/api-client-standard.md
x-contract-status: Draft
x-implementation-authorization: blocked
x-extraction-baseline:
  date: 2026-09-10
  source: Spring MVC controllers, SecurityConfig, method security and shared HTTP handlers
  controllers: 2
  operations: 3
  caveat: Code is evidence of current behavior, not an approved source of product intent.
x-open-questions:
  - id: DASHBOARD-BASELINE-001
    topic: schemas
    blocking: true
    action: Replace every permissive Java-type projection with a closed, validated wire schema.
  - id: DASHBOARD-BASELINE-002
    topic: errors
    blocking: true
    action: Validate operation-specific error codes, bodies and headers; decide the RFC 9457 migration boundary.
  - id: DASHBOARD-BASELINE-003
    topic: authorization
    blocking: true
    action: Validate route and method authorization, role composition, tenant boundary and negative cases.
  - id: DASHBOARD-BASELINE-004
    topic: consumers
    blocking: true
    action: Confirm consumers and update each affected official document with version and operationIds.
x-change-log:
  - version: 0.4.0
    date: 2026-09-12
    compatibility: draft-breaking-refinement
    changes: Extracts getFiscalOverview into the dedicated Active dashboard-fiscal-overview-v1 contract; the three unresolved legacy operations remain Draft.
  - version: 0.3.0
    date: 2026-09-11
    compatibility: draft-breaking-refinement
    changes: Records the approved all-tenant-role fiscal overview authorization and real BASIC fallback for Premium; contract remains Draft until error semantics and owner approval are closed.
  - version: 0.2.0
    date: 2026-09-10
    compatibility: draft-breaking-refinement
    changes: Replaced the four opaque P1 response projections with observed closed DTO schemas and recorded fiscal cache behavior, list limits and composed authorization; owner approval, RFC 9457 and authorization remain blocked.
  - version: 0.1.0
    date: 2026-09-10
    compatibility: initial-draft
    changes: Extracted the legacy baseline for 4 previously uncovered operations.
