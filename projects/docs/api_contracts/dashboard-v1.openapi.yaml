components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    LegacyBadRequest:
      description: Current shared handlers may emit a 400 JSON error; exact operation codes and variants require validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyUnauthorized:
      description: Current security entry point emits a 401 JSON error; migration to RFC 9457 requires a versioned decision.
      headers:
        WWW-Authenticate:
          description: Bearer challenge governed by RFC 9110.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacySecurityError'
    LegacyForbidden:
      description: Current security or exception handler emits a 403 JSON error; exact boundary variants require validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacySecurityError'
    LegacyInternalFailure:
      description: Current shared handler emits a sanitized 500 JSON error with an errorId.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
  schemas:
    SuperAdminDashboardKpis:
      type: object
      additionalProperties: false
      description: Observed SuperAdminDashboardKpisResponse wire shape.
      required: [clientesAtivos, totalCertificados, consultasFiscaisMes, interacoesChatbot, interacoesWhatsapp]
      properties:
        clientesAtivos:
          type: integer
          format: int64
          minimum: 0
        totalCertificados:
          type: integer
          format: int64
          minimum: 0
        consultasFiscaisMes:
          type: integer
          format: int64
          minimum: 0
        interacoesChatbot:
          type: integer
          format: int64
          minimum: 0
        interacoesWhatsapp:
          type: integer
          format: int64
          minimum: 0
    TopTenant:
      type: object
      additionalProperties: false
      description: Observed TopTenantResponse wire shape.
      required: [id, razaoSocial, consumo]
      properties:
        id:
          type: string
          format: uuid
        razaoSocial:
          type: string
        consumo:
          type: integer
          format: int64
          minimum: 0
    ActivityItem:
      type: object
      additionalProperties: false
      description: Observed ActivityItemResponse wire shape backed by non-null persistence columns.
      required: [id, icon, description, timestamp, type]
      properties:
        id:
          type: string
          format: uuid
        icon:
          type: string
          maxLength: 50
        description:
          type: string
        timestamp:
          type: string
          format: date-time
        type:
          type: string
          enum: [FISCAL_QUERY, CERTIFICATE_EXPIRING, CLIENT_ADDED, DARF_GENERATED, CERTIFICATE_UPLOADED, CONTACT_SYNCHRONIZED]
    LegacyError:
      type: object
      description: Observed non-RFC-9457 envelope; variants remain a blocking review item.
      additionalProperties: true
      required: [message]
      properties:
        message:
          type: string
        errorId:
          type: string
          format: uuid
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
      x-schema-review: required
    LegacySecurityError:
      type: object
      description: Observed default security envelope; specialized path handlers may differ.
      additionalProperties: true
      required: [error, message, status, timestamp, path]
      properties:
        error:
          type: string
        message:
          type: string
        status:
          type: integer
        timestamp:
          type: string
          format: date-time
        path:
          type: string
      x-schema-review: required
    Problem:
      type: object
      description: Target Problem Details shape governed by RFC 9457; not claimed as current legacy behavior.
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
