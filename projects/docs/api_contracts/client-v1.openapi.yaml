          $ref: '#/components/responses/LegacyBadRequest'
        '409':
          $ref: '#/components/responses/LegacyConflict'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '403':
          $ref: '#/components/responses/LegacyForbidden'
        '500':
          $ref: '#/components/responses/LegacyInternalFailure'
      x-error-contract-review: required
      x-version-policy:
        publicMajor: v1
        draftContractVersion: 0.3.0
        compatibilityDecision: required-before-active
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    LegacyBadRequest:
      description: Current shared handlers may emit a 400 JSON error; exact operation codes and variants require validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyConflict:
      description: Current DataIntegrityViolationException handler emits 409 for duplicate tenant/document persistence conflicts.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyUnauthorized:
      description: Current security entry point emits a 401 JSON error; migration to RFC 9457 requires a versioned decision.
      headers:
        WWW-Authenticate:
          description: Bearer challenge governed by RFC 9110.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacySecurityError'
    LegacyForbidden:
      description: Current security or exception handler emits a 403 JSON error; exact boundary variants require validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacySecurityError'
    LegacyInternalFailure:
      description: Current shared handler emits a sanitized 500 JSON error with an errorId.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
  schemas:
    AddContactRequest:
      type: object
      additionalProperties: true
      description: >-
        Observed AddContactDto boundary. Current Jackson configuration ignores unknown members and
        no Bean Validation constrains the three fields; domain construction rejects null name/phone,
        defaults null channel to WHATSAPP and uppercases a non-null channel.
      properties:
        contactName: {type: [string, 'null']}
        phoneNumber: {type: [string, 'null']}
        channel: {type: [string, 'null']}
    AuthorizedContact:
      type: object
      additionalProperties: false
      required: [id, clientId, contactName, phoneNumber, channel, status, syncStatus, addedAt]
      properties:
        id: {type: string, format: uuid}
        clientId: {type: string, format: uuid}
        contactName: {type: string}
        phoneNumber: {type: string}
        channel: {type: string}
        status: {type: string, enum: [ACTIVE, INACTIVE]}
        syncStatus: {type: string, enum: [PENDING, SYNCED]}
        addedAt: {type: string, format: date-time}
    ClientWriteRequest:
      type: object
      additionalProperties: true
      description: >-
        Observed successful request shape shared by CreateClientDto and UpdateClientDto. The
        current Jackson boundary ignores unknown members; closing that runtime behavior requires
        a separate compatibility decision. The frontend currently sends tipoDocumento although
        the Java DTO does not consume it.
      required: [razaoSocial, documento]
      properties:
        razaoSocial:
          type: string
          maxLength: 255
        documento:
          type: string
          description: CPF or CNPJ accepted with or without punctuation and normalized to digits by Documento.
        tipoDocumento:
          type: integer
          enum: [1, 2]
          deprecated: true
          description: Accepted from the current frontend payload but ignored by CreateClientDto and UpdateClientDto.
    ClientCompany:
      type: object
      additionalProperties: false
      description: Observed ClientCompanyDto response shape.
      required: [id, tenantId, razaoSocial, documento, createdAt, authorizedPhonesCount]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        razaoSocial:
          type: string
        documento:
          type: string
          description: Normalized eleven-digit CPF or fourteen-digit CNPJ.
          pattern: '^(?:[0-9]{11}|[0-9]{14})$'
        createdAt:
          type: string
          format: date-time
        authorizedPhonesCount:
          type: integer
          format: int32
          minimum: 0
    ClientPage:
      type: object
      additionalProperties: false
      description: Observed Spring Data page representation consumed and normalized by clientService.
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ClientCompany'
        page:
          $ref: '#/components/schemas/PageMetadata'
    PageMetadata:
      type: object
      additionalProperties: false
      required: [size, number, totalElements, totalPages]
      properties:
        size:
          type: integer
          format: int32
          minimum: 0
        number:
          type: integer
          format: int32
          minimum: 0
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int32
          minimum: 0
    TenantUsage:
      type: object
      additionalProperties: false
      description: Observed TenantUsageDto response shape.
      required: [usedDocumentos, limitDocumentos]
      properties:
        usedDocumentos:
          type: integer
          format: int64
          minimum: 0
        limitDocumentos:
          type: integer
          format: int64
          minimum: 0
    LegacyError:
      type: object
      description: Observed non-RFC-9457 envelope; variants remain a blocking review item.
      additionalProperties: true
      required: [message]
      properties:
        message:
          type: string
        errorId:
          type: string
          format: uuid
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
      x-schema-review: required
    LegacySecurityError:
      type: object
      description: Observed default security envelope; specialized path handlers may differ.
      additionalProperties: true
      required: [error, message, status, timestamp, path]
      properties:
        error:
          type: string
        message:
          type: string
        status:
          type: integer
        timestamp:
          type: string
          format: date-time
        path:
          type: string
      x-schema-review: required
    Problem:
      type: object
      description: Target Problem Details shape governed by RFC 9457; not claimed as current legacy behavior.
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
