components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    LegacyBadRequest:
      description: Current shared handlers may emit a 400 JSON error; exact operation codes and variants require validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyUnauthorized:
      description: Current security entry point emits a 401 JSON error; migration to RFC 9457 requires a versioned decision.
      headers:
        WWW-Authenticate:
          description: Bearer challenge governed by RFC 9110.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacySecurityError'
    LegacyForbidden:
      description: Current security or exception handler emits a 403 JSON error; exact boundary variants require validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacySecurityError'
    LegacyInternalFailure:
      description: Current shared handler emits a sanitized 500 JSON error with an errorId.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
  schemas:
    CertificateValidity:
      type: object
      additionalProperties: false
      required: [dataInicio, dataFim]
      properties:
        dataInicio:
          type: string
          format: date-time
        dataFim:
          type: string
          format: date-time
    CertificateSummary:
      type: object
      additionalProperties: false
      description: Observed CertificateSummaryDto response shape.
      required: [id, tenantId, alias, tipo, documentoVinculado, nomeResponsavel, validade, status, createdAt, uploadedBy]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        alias:
          type: [string, 'null']
        tipo:
          type: string
          enum: [A1_EDocumento]
        documentoVinculado:
          type: string
        nomeResponsavel:
          type: string
        validade:
          $ref: '#/components/schemas/CertificateValidity'
        status:
          type: string
          enum: [ACTIVE, EXPIRED, REVOKED, NEAR_EXPIRY]
        createdAt:
          type: string
          format: date-time
        uploadedBy:
          type: string
    CertificateMetadata:
      type: object
      additionalProperties: false
      required: [serialNumber, issuer, subject, algorithm, keySize]
      properties:
        serialNumber:
          type: string
        issuer:
          type: string
        subject:
          type: string
        algorithm:
          type: string
        keySize:
          type: integer
          format: int32
          minimum: 0
    CertificateDetail:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/CertificateSummary'
        - type: object
          required: [thumbprint, metadata]
          properties:
            thumbprint:
              type: string
            metadata:
              $ref: '#/components/schemas/CertificateMetadata'
    CertificateImportReceipt:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          const: Certificado importado com sucesso
    CertificatePage:
      type: object
      additionalProperties: false
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/CertificateSummary'
        page:
          $ref: '#/components/schemas/PageMetadata'
    PageMetadata:
      type: object
      additionalProperties: false
      required: [size, number, totalElements, totalPages]
      properties:
        size:
          type: integer
          format: int32
          minimum: 0
        number:
          type: integer
          format: int32
          minimum: 0
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int32
          minimum: 0
    LegacyError:
      type: object
      description: Observed non-RFC-9457 envelope; variants remain a blocking review item.
      additionalProperties: true
      required: [message]
      properties:
        message:
          type: string
        errorId:
          type: string
          format: uuid
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
      x-schema-review: required
    LegacySecurityError:
      type: object
      description: Observed default security envelope; specialized path handlers may differ.
      additionalProperties: true
      required: [error, message, status, timestamp, path]
      properties:
        error:
          type: string
        message:
          type: string
        status:
          type: integer
        timestamp:
          type: string
          format: date-time
        path:
          type: string
      x-schema-review: required
    Problem:
      type: object
      description: Target Problem Details shape governed by RFC 9457; not claimed as current legacy behavior.
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
