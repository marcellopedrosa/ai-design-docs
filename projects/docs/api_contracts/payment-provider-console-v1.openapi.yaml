openapi: 3.1.0
info:
  title: SaaS Service Payment Provider Console API
  version: 1.8.0
  description: >-
    Provider-neutral contract for the global payment-provider control plane and its
    sanitized operational interaction projection. ASAAS is the initial PRIMARY
    profile and Stripe is a CONTINGENCY profile that remains OFF and NOT_CERTIFIED.
    This contract never accepts or returns API-key values, webhook secrets, PAN,
    expiration, CVV, card-holder data, card tokens, raw HTTP payloads, headers,
    signed URLs or external error messages. Configuration revisions are repository-
    local control-plane facts; no operation in this version calls a payment provider
    or overrides the independent deployment execution kill switch. The interaction
    projection is diagnostic, eventually consistent and not a financial ledger.
    DRAFT creation and full replacement are direct, MFA-protected control-plane
    writes; submission freezes the hash and an explicit SUPER_ADMIN decision
    produces the one-time ApprovalSeal used by a later explicit activation. The
    decision actor may be the same human who prepared the revision or another
    authorized SUPER_ADMIN. Desired-state changes, including PAUSED and ENABLED,
    use that same revision workflow; this version has no direct pause/resume shortcut
    and never activates a revision automatically.
x-document-metadata:
  documentId: PAYMENT-PROVIDER-CONSOLE-V1
  primaryNature: Contrato
  owner: Billing, Architecture, Security and Operations
  status: Active
  authorizationScope: repository-local implementation authorized; external calls and provider enablement excluded
  decisionProvenance: HUMAN_EXPLICIT repository-local authorization; AI_MATERIALIZATION technical decomposition
  date: 2026-09-06
  lastReviewed: 2026-09-10
  normativeBaseline: PRD-00001 v1.9; REQ-00056 v1.12; UC-00053 v1.11; ADR-0050 v1.8; ADR-0055 v1.6
  relatedFiles:
    - docs/product/requirements/REQ-00042-enterprise-multitenant-billing-invoicing.md
    - docs/product/requirements/REQ-00056-payment-provider-management-observability.md
    - docs/product/use-cases/UC-00042-billing-payment-reconciliation-dunning.md
    - docs/product/use-cases/UC-00053-manage-payment-provider-configuration.md
    - docs/product/use-cases/UC-00054-inspect-payment-provider-interactions.md
    - docs/adrs/ADR-0023-agnostic-payment-provider-integration.md
    - docs/adrs/ADR-0024-seguranca-tokenizacao-cartao-recorrente.md
    - docs/adrs/ADR-0026-billing-api-tenant-admin-cutover.md
    - docs/adrs/ADR-0027-catalogo-global-faturamento-local.md
    - docs/adrs/ADR-0050-rbac-sod-aprovacoes-financeiras.md
    - docs/adrs/ADR-0051-slo-capacidade-rollout-billing.md
    - docs/adrs/ADR-0055-payment-provider-operational-control-plane.md
    - docs/delivery/plans/TP-00039-payment-provider-management-console.md
x-security-boundary:
  superAdminRoleIsInsufficient: true
  superAdminRoleIsCumulativeRequirement: false
  globalAdministrationRequiresNonImpersonatedBoundary: true
  externalProviderCalls: forbidden
  secretValues: forbidden
  approvalSealBrowserPersistence: forbidden
  cardData: forbidden
  rawTransportData: forbidden
  logicalReferenceNamespaceCatalog: required
  automaticFallback: forbidden
  interactionMutation: forbidden
x-authorities:
  readConfiguration: BILLING_PROVIDER_READ
  configureDraft: BILLING_PROVIDER_CONFIGURE
  submitDraft: BILLING_PROVIDER_SUBMIT
  decideRevision: BILLING_PROVIDER_APPROVE
  activateOrPause: BILLING_PROVIDER_ACTIVATE
  readInteractions: BILLING_PROVIDER_INTERACTION_READ
x-runtime-boundary:
  repositoryLocalControlPlaneWrites: allowed
  controlPlaneMutationsKillSwitch:
    environmentVariable: PAYMENT_PROVIDER_CONTROL_PLANE_MUTATIONS_ENABLED
    default: false
    newOperationWhenDisabled: 422 BILLING_PROVIDER_ACTION_NOT_ALLOWED before any effect
    terminalIdempotencyReplayWhenDisabled: allowed with the original exact response
  providerNetworkTraffic: forbidden
  providerEnablement: forbidden
  deploymentExecutionKillSwitch: false
  interactionActions: read-and-local-refresh-only
x-idempotency-semantics:
  namespace: authenticated-actor + operationCode + domain-separated-digest(Idempotency-Key)
  fence: transactional-and-bounded-by-database-operational-timeout
  validateAfterFence: [providerCode, canonicalRequestHash]
  exactReplay: >-
    An identical request, including a concurrent overlap, rereads the terminal
    journal entry and returns the original status, body or snapshot, ETag and
    Location when applicable, X-Correlation-ID and timestamps. It produces no
    second effect, domain event or approval seal.
  divergentReplay: >-
    The same namespace with a different providerCode or canonical request hash
    returns 409 BILLING_IDEMPOTENCY_CONFLICT and preserves the original result.
  unavailableBeforeTerminal: >-
    Fence timeout or dependency unavailability before a terminal entry returns
    503 with Retry-After and never fabricates a result; a later retry rereads the
    exact terminal result when available.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: PaymentProviderConfiguration
    description: Global, versioned and secret-free provider configuration.
  - name: PaymentProviderInteractions
    description: Read-only sanitized operational evidence; never financial authority.

paths:
  /api/v1/admin/billing/payment-providers:
    get:
      operationId: listPaymentProviders
      tags: [PaymentProviderConfiguration]
      summary: List registered provider profiles and server-derived readiness
      x-required-authority: BILLING_PROVIDER_READ
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ProviderPageSize'
      responses:
        '200':
          description: Deterministically ordered provider profiles.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentProviderProfilePage'
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ControlPlaneUnavailable'

  /api/v1/admin/billing/payment-providers/{providerCode}:
    get:
      operationId: getPaymentProvider
      tags: [PaymentProviderConfiguration]
      summary: Get one provider profile and its current readiness
      x-required-authority: BILLING_PROVIDER_READ
      parameters:
        - $ref: '#/components/parameters/ProviderCode'
      responses:
        '200':
          description: Exact provider profile.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/StrongEtag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentProviderProfile'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ControlPlaneUnavailable'

  /api/v1/admin/billing/payment-providers/{providerCode}/configuration-revisions:
    post:
      operationId: createPaymentProviderConfigurationRevision
      tags: [PaymentProviderConfiguration]
      summary: Create a complete draft revision without changing active configuration
      x-required-authority: BILLING_PROVIDER_CONFIGURE
      x-requires-mfa: true
      x-external-effect: false
      parameters:
        - $ref: '#/components/parameters/ProviderCode'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/BillingPurpose'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConfigurationRevisionRequest'
      responses:
        '201':
          description: New DRAFT with server-derived content hash and preview.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/StrongEtag'
            Location:
              description: >-
                Canonical repository-local path of the created revision. It is
                never an absolute, provider-controlled or signed URL.
              schema:
                type: string
                pattern: '^/api/v1/admin/billing/payment-providers/[A-Z][A-Z0-9_]{1,31}/configuration-revisions/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentProviderConfigurationRevision'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenWithMfa'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ActionNotAllowed'
        '503':
          $ref: '#/components/responses/ControlPlaneUnavailable'

  /api/v1/admin/billing/payment-providers/{providerCode}/configuration-revisions/{revisionId}:
    get:
      operationId: getPaymentProviderConfigurationRevision
      tags: [PaymentProviderConfiguration]
      summary: Get one exact immutable-or-draft configuration revision
      x-required-authority: BILLING_PROVIDER_READ
      parameters:
        - $ref: '#/components/parameters/ProviderCode'
        - $ref: '#/components/parameters/RevisionId'
      responses:
        '200':
          description: Exact revision and its sanitized server-side diff.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/StrongEtag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentProviderConfigurationRevision'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ControlPlaneUnavailable'
    put:
      operationId: replacePaymentProviderConfigurationDraft
      tags: [PaymentProviderConfiguration]
      summary: Replace one mutable DRAFT and recalculate its server-authoritative preview
      description: >-
        Full replacement is accepted only while lifecycle is DRAFT. Submitted,
        approved, activated, invalidated, rejected and superseded revisions are
        immutable. The operation never changes the active revision pointer and never
        calls a provider.
      x-required-authority: BILLING_PROVIDER_CONFIGURE
      x-requires-mfa: true
      x-external-effect: false
      parameters:
        - $ref: '#/components/parameters/ProviderCode'
        - $ref: '#/components/parameters/RevisionId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/BillingPurpose'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConfigurationRevisionRequest'
      responses:
        '200':
          description: Replaced DRAFT with a new record revision, hash and sanitized preview.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/StrongEtag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentProviderConfigurationRevision'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenWithMfa'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ActionNotAllowed'
        '503':
          $ref: '#/components/responses/ControlPlaneUnavailable'

  /api/v1/admin/billing/payment-providers/{providerCode}/configuration-revisions/{revisionId}/submit:
    post:
      operationId: submitPaymentProviderConfigurationRevision
      tags: [PaymentProviderConfiguration]
      summary: Freeze a draft hash and submit it for an explicit decision
      x-required-authority: BILLING_PROVIDER_SUBMIT
      x-requires-mfa: true
      x-external-effect: false
      parameters:
        - $ref: '#/components/parameters/ProviderCode'
        - $ref: '#/components/parameters/RevisionId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/BillingPurpose'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationDecisionRequest'
      responses:
        '202':
          description: >-
            Revision is PENDING_APPROVAL and awaits an explicit decision by an
            authorized SUPER_ADMIN; the decision actor may be the maker.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/StrongEtag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentProviderPendingApproval'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenWithMfa'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ActionNotAllowed'
        '503':
          $ref: '#/components/responses/ControlPlaneUnavailable'

  /api/v1/admin/billing/payment-providers/{providerCode}/configuration-revisions/{revisionId}/approve:
    post:
      operationId: approvePaymentProviderConfigurationRevision
      tags: [PaymentProviderConfiguration]
      summary: Approve the frozen revision explicitly with fresh MFA
      x-required-authority: BILLING_PROVIDER_APPROVE
      x-requires-mfa: true
      x-requires-distinct-human-checker: false
      x-same-human-as-maker: allowed
      x-automatic-activation: forbidden
      x-external-effect: false
      parameters:
        - $ref: '#/components/parameters/ProviderCode'
        - $ref: '#/components/parameters/RevisionId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/BillingPurpose'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationDecisionRequest'
      responses:
        '200':
          description: Approval and one-time opaque seal. The seal is never persisted by the browser.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/StrongEtag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovedConfigurationRevision'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenWithMfa'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ActionNotAllowed'
        '503':
          $ref: '#/components/responses/ControlPlaneUnavailable'

  /api/v1/admin/billing/payment-providers/{providerCode}/configuration-revisions/{revisionId}/reject:
    post:
      operationId: rejectPaymentProviderConfigurationRevision
      tags: [PaymentProviderConfiguration]
      summary: Reject the frozen revision explicitly
      x-required-authority: BILLING_PROVIDER_APPROVE
      x-requires-mfa: true
      x-requires-distinct-human-checker: false
      x-same-human-as-maker: allowed
      x-automatic-activation: forbidden
      x-external-effect: false
      parameters:
        - $ref: '#/components/parameters/ProviderCode'
        - $ref: '#/components/parameters/RevisionId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/BillingPurpose'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationDecisionRequest'
      responses:
        '200':
          description: Rejected revision receipt.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/StrongEtag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentProviderConfigurationRevision'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenWithMfa'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ActionNotAllowed'
        '503':
          $ref: '#/components/responses/ControlPlaneUnavailable'

  /api/v1/admin/billing/payment-providers/{providerCode}/configuration-revisions/{revisionId}/activate:
    post:
      operationId: activatePaymentProviderConfigurationRevision
      tags: [PaymentProviderConfiguration]
      summary: Activate an approved control-plane revision without calling a provider
      x-required-authority: BILLING_PROVIDER_ACTIVATE
      x-requires-mfa: true
      x-requires-approval-seal: true
      x-external-effect: false
      parameters:
        - $ref: '#/components/parameters/ProviderCode'
        - $ref: '#/components/parameters/RevisionId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/BillingPurpose'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateConfigurationRevisionRequest'
      responses:
        '200':
          description: Revision pointer activated; effective provider state remains server-derived.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentProviderActionReceipt'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenWithMfa'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ActionNotAllowed'
        '503':
          $ref: '#/components/responses/ControlPlaneUnavailable'

  /api/v1/admin/billing/payment-provider-interactions/summary:
    get:
      operationId: summarizePaymentProviderInteractions
      tags: [PaymentProviderInteractions]
      summary: Read bounded cross-tenant operational counts without tenant database fan-out
      x-required-authority: BILLING_PROVIDER_INTERACTION_READ
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/OptionalProviderCode'
        - $ref: '#/components/parameters/EnvironmentFilter'
        - $ref: '#/components/parameters/MerchantAccountAliasFilter'
        - $ref: '#/components/parameters/DirectionFilter'
        - $ref: '#/components/parameters/CategoryFilter'
        - $ref: '#/components/parameters/OperationFilter'
        - $ref: '#/components/parameters/OutcomeFilter'
        - $ref: '#/components/parameters/CorrelationIdFilter'
      responses:
        '200':
          description: Sanitized counts and projection freshness.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentProviderInteractionSummary'
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ProjectionUnavailable'

