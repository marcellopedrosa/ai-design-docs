x-change-log:
  - version: 1.8.0
    date: 2026-09-10
    changes: >-
      Applies PRD-00001 v1.9 and ADR-0050 v1.8 without changing any path or
      payload: approve and reject remain explicit, may be performed by the same
      authorized SUPER_ADMIN who prepared the revision, and never activate a
      revision automatically. Existing checker fields, approval records and
      ApprovalSeal remain compatible audit and integrity artifacts.
  - version: 1.7.0
    date: 2026-09-06
    changes: >-
      Adds required, bounded and unique gaps and URL-free canonicalLinks to admin
      and tenant interaction details; global references remain non-navigable and
      tenant navigation is client-allowlisted and reauthorized at the destination.
      It applies the fail-closed provider-metadata policy to aliases, purposes,
      reasons and logical reference IDs, requires the complete successful
      activation receipt, defines the local mutation kill switch as default OFF
      while preserving exact terminal replay before the 422 gate, and closes the
      HTTP envelope with operation-specific status/error-code matrices, no-store,
      correlated UUID headers, bearer challenge, bounded Retry-After and canonical
      repository-local create Location.
  - version: 1.6.2
    date: 2026-09-06
    changes: >-
      Reconciles the normative baseline with REQ-00056 v1.7, UC-00053 v1.7,
      UC-00054 v1.5 and ADR-0055 v1.5; makes exact idempotent replay, including
      concurrent overlap and bounded fence failure, normative; and fixes V1
      interaction pagination to page, size and sort with page metadata and no
      cursor. It also enforces the unresolved-tenant quarantine invariant over
      every event in an admin detail, reserves 409 for actual conflicts and keeps
      readiness failure on 422.
  - version: 1.6.1
    date: 2026-09-06
    changes: >-
      Reconciles the normative baseline with UC-00053 v1.6 and UC-00054 v1.4,
      documents 400 on every validation-capable GET and the complete 401 header
      set, and bounds every int64 exposed to JavaScript to
      Number.MAX_SAFE_INTEGER. It also makes the existing workflow explicit:
      submit returns 202/PENDING_APPROVAL, governed reject returns 200/REJECTED,
      and successful activation returns 200/SUCCEEDED. No endpoint or successful
      business behavior changes.
  - version: 1.6.0
    date: 2026-09-06
    changes: >-
      Aligns summary with every non-pagination list filter; reuses the Unicode
      Billing-context purpose for tenant reads; makes unresolved-tenant topology
      executable in JSON Schema; orders timelines by arrival sequence; and limits
      successful activation receipts to a required revision and SUCCEEDED outcome.
  - version: 1.5.0
    date: 2026-09-06
    changes: >-
      Models each list row as a stable interaction thread whose monotonic effective
      event is the summary, while detail returns an append-only event timeline with
      an explicit event ID, arrival sequence and duplicate marker. This prevents
      retries, duplicate deliveries and out-of-order evidence from overwriting the
      canonical thread state or its history.
  - version: 1.4.0
    date: 2026-09-06
    changes: >-
      Restricts opaque secret and webhook-profile references to typed, bounded,
      server-catalogued names and rejects URI, path and traversal forms. Submission
      freezes the active profile baseline so approval and activation cannot absorb
      concurrent drift silently.
  - version: 1.3.0
    date: 2026-09-06
    changes: >-
      Separates the global-administrator and tenant interaction representations.
      Tenant routes neither accept merchantAccountAlias as a filter nor return
      tenantId or merchantAccountAlias, preventing disclosure of global account
      topology while retaining the authenticated Billing-context boundary.
  - version: 1.2.0
    date: 2026-09-06
    changes: >-
      Allows tenantId null only for unresolved inbound quarantine evidence in the
      global administrator projection and excludes it from tenant routes. Removes
      direct pause/resume shortcuts because no action-specific maker-checker seal
      producer existed; PAUSED/ENABLED now flow exclusively through a complete
      configuration revision, approval and activation.
  - version: 1.1.0
    date: 2026-09-06
    changes: >-
      Activates the repository-local contract and aligns it with REQ-00056 v1.1,
      UC-00053/00054 and ADR-0055 v1.1: direct POST/PUT DRAFT mutations with MFA,
      frozen PENDING_APPROVAL workflow, material checker/ApprovalSeal activation,
      tenant Billing context, complete bounded filters and source-aware read-only
      interaction evidence. Provider traffic and enablement remain forbidden.
  - version: 1.0.0
    date: 2026-09-06
    changes: >-
      Initial Draft contract for secret-free provider configuration revisions,
      independent approval, fail-closed activation and read-only sanitized interaction
      summary/list/timeline for global and tenant-scoped audiences.
