        '503':
          $ref: '#/components/responses/ProjectionUnavailable'

  /api/v1/tenants/{tenantId}/billing/payment-provider-interactions/{interactionId}:
    get:
      operationId: getTenantPaymentProviderInteraction
      tags: [PaymentProviderInteractions]
      summary: Get one interaction only when it belongs to the effective tenant
      x-required-authority: BILLING_PROVIDER_INTERACTION_READ
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/EffectiveTenantId'
        - $ref: '#/components/parameters/BillingContextId'
        - $ref: '#/components/parameters/TenantBillingPurpose'
        - $ref: '#/components/parameters/InteractionId'
      responses:
        '200':
          description: Tenant-confined sanitized timeline.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantPaymentProviderInteractionDetail'
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/InteractionNotFound'
        '503':
          $ref: '#/components/responses/ProjectionUnavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ProviderCode:
      name: providerCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ProviderCode'
    OptionalProviderCode:
      name: providerCode
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ProviderCode'
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InteractionId:
      name: interactionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TenantId:
      name: tenantId
      in: path
      required: true
      description: Must equal the effective tenant established by the authenticated request.
      schema:
        type: string
        format: uuid
    EffectiveTenantId:
      name: X-Tenant-ID
      in: header
      required: false
      description: >-
        Used only by the existing explicit Super Admin impersonation flow. It must
        equal tenantId. It is never accepted by global admin operations.
      schema:
        type: string
        format: uuid
    BillingContextId:
      name: X-Billing-Context-ID
      in: header
      required: true
      description: >-
        Short-lived server-issued Billing context bound to the effective tenant,
        human principal, purpose and BILLING_PROVIDER_INTERACTION_READ authority.
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        Decimal optimistic-concurrency revision of the authoritative resource
        being mutated; it is not provider-health freshness. The unquoted decimal
        value must not exceed 9007199254740991 (Number.MAX_SAFE_INTEGER).
      schema:
        type: string
        minLength: 3
        maxLength: 18
        pattern: '^"[0-9]+"$'
        x-unquoted-decimal-maximum: 9007199254740991
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque input; only a domain-separated digest may be persisted.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
    BillingPurpose:
      name: X-Billing-Purpose
      in: header
      required: true
      description: >-
        Trimmed, audit-safe purpose for global control-plane mutations. This
        deliberately narrower grammar is not reused by tenant Billing contexts.
      schema:
        type: string
        minLength: 8
        maxLength: 160
        pattern: '^[A-Za-z0-9][A-Za-z0-9 _.:/-]+$'
        x-sensitive-data-policy: >-
          Reject NFKC-normalized PAN-like Luhn sequences of 13..19 Unicode digits
          with bounded separators, CVV/CVC/CID, expiration, bearer, JWT, known
          token prefixes and assigned credential values without echoing input.
    TenantBillingPurpose:
      name: X-Billing-Purpose
      in: header
      required: true
      description: >-
        Existing Billing elevated-context purpose. It is trimmed, accepts Unicode
        human language, has 1..160 characters and rejects ISO control characters.
        Its exact value must match the purpose bound to X-Billing-Context-ID.
      schema:
        type: string
        minLength: 1
        maxLength: 160
        pattern: '^(?=.{1,160}$)[^\s\u0000-\u001F\u007F](?:[^\u0000-\u001F\u007F]*[^\s\u0000-\u001F\u007F])?$'
        x-sensitive-data-policy: >-
          Same fail-closed provider-metadata policy as BillingPurpose; Unicode is
          accepted as human language, never as a way to disguise card or credential data.
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    ProviderPageSize:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    InteractionPageSize:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    From:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
    EnvironmentFilter:
      name: environment
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ProviderEnvironment'
    MerchantAccountAliasFilter:
      name: accountAlias
      in: query
      required: false
      description: Exact opaque merchant alias; never a credential or external account identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 80
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,79}$'
    DirectionFilter:
      name: direction
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/InteractionDirection'
    CategoryFilter:
      name: category
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/InteractionCategory'
    OperationFilter:
      name: operation
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/InteractionOperation'
    OutcomeFilter:
      name: outcome
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/InteractionOutcome'
    CorrelationIdFilter:
      name: correlationId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    InteractionSort:
      name: sort
      in: query
      required: false
      description: Closed deterministic ordering supported by this contract version.
      schema:
        type: string
        enum: ['occurredAt,DESC;interactionId,DESC']
        default: 'occurredAt,DESC;interactionId,DESC'

  headers:
    NoStore:
      description: Authenticated operational data must never be cached.
      schema:
        type: string
        const: no-store
    StrongEtag:
      description: >-
        Decimal optimistic-concurrency revision of the primary authoritative
        resource in this response. Responses are no-store; the tag does not
        represent interaction-projection or external-provider freshness. The
        unquoted decimal value never exceeds 9007199254740991
        (Number.MAX_SAFE_INTEGER).
      schema:
        type: string
        minLength: 3
        maxLength: 18
        pattern: '^"[0-9]+"$'
        x-unquoted-decimal-maximum: 9007199254740991
    CorrelationId:
      description: Opaque internal identifier safe to present to support.
      schema:
        type: string
        format: uuid
    BearerChallenge:
      description: RFC 6750 bearer authentication challenge.
      schema:
        type: string
        const: Bearer
    RetryAfter:
      description: Whole seconds before a bounded retry is allowed.
      schema:
        type: integer
        minimum: 1

  responses:
    InvalidRequest:
      description: Closed request schema, header, enum, bound or state is invalid.
      x-error-codes: [BILLING_PROVIDER_QUERY_INVALID]
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PaymentProviderProblem'
    InvalidQuery:
      description: One or more filters, period or pagination bounds are invalid.
      x-error-codes: [BILLING_PROVIDER_QUERY_INVALID]
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PaymentProviderProblem'
    Unauthorized:
      description: A valid authenticated bearer token is required.
      x-error-codes: [BILLING_SCOPE_DENIED]
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        WWW-Authenticate:
          $ref: '#/components/headers/BearerChallenge'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PaymentProviderProblem'
    Forbidden:
      description: >-
        Exact authority, required human identity or non-impersonated/global or
        tenant scope boundary is missing. ROLE_SUPER_ADMIN is neither sufficient
        nor a cumulative requirement for global administration.
      x-error-codes: [BILLING_SCOPE_DENIED]
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PaymentProviderProblem'
    ForbiddenWithMfa:
      description: >-
        Exact mutation authority, required human identity,
        non-impersonated/global boundary or fresh MFA is missing.
        ROLE_SUPER_ADMIN is neither sufficient nor a cumulative requirement.
      x-error-codes: [BILLING_SCOPE_DENIED, BILLING_MFA_REQUIRED]
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PaymentProviderProblem'
    NotFound:
      description: Provider or revision does not exist in the authorized scope.
      x-error-codes: [BILLING_PROVIDER_NOT_REGISTERED]
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PaymentProviderProblem'
    InteractionNotFound:
      description: Interaction does not exist or is outside the effective tenant scope.
      x-error-codes: [BILLING_PROVIDER_INTERACTION_NOT_FOUND]
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PaymentProviderProblem'
    Conflict:
      description: Revision, hash, idempotency, approval or seal conflict.
      x-error-codes: [BILLING_PROVIDER_VERSION_CONFLICT, BILLING_IDEMPOTENCY_CONFLICT]
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PaymentProviderProblem'
    ActionNotAllowed:
      description: >-
        Operation/transition is outside the closed allowlist, readiness
        preconditions are not satisfied, or the local
        PAYMENT_PROVIDER_CONTROL_PLANE_MUTATIONS_ENABLED switch is OFF for a new
        mutation. A previously committed terminal idempotent replay remains
        readable even while that switch is OFF.
      x-error-codes: [BILLING_PROVIDER_NOT_READY, BILLING_PROVIDER_ACTION_NOT_ALLOWED]
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PaymentProviderProblem'
    ControlPlaneUnavailable:
      description: Configuration store or safe runtime readiness boundary is unavailable.
      x-error-codes: [BILLING_PROVIDER_CONTROL_PLANE_UNAVAILABLE]
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PaymentProviderProblem'
    ProjectionUnavailable:
      description: Sanitized diagnostic projection is temporarily unavailable.
      x-error-codes: [BILLING_PROVIDER_PROJECTION_UNAVAILABLE]
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PaymentProviderProblem'

  schemas:
    ProviderCode:
      type: string
      pattern: '^[A-Z][A-Z0-9_]{1,31}$'
      maxLength: 32
    SecretReferenceId:
      type: [string, 'null']
      maxLength: 120
      pattern: '^secret:[a-z][a-z0-9_-]{1,31}(?:/[A-Za-z0-9][A-Za-z0-9._-]{0,31}){1,5}$'
      example: secret:vault/billing/asaas/api-key
      description: >-
        Opaque logical identifier in the server-managed secret-reference catalog.
        It is never a URI, filesystem path, secret value, credential fragment or
        carrier for PAN/CVV/expiration/token data.
      x-sensitive-data-policy: provider-metadata-fail-closed-v1
    WebhookReferenceId:
      type: [string, 'null']
      maxLength: 120
      pattern: '^webhook-profile:[a-z][a-z0-9_-]{1,31}(?:/[A-Za-z0-9][A-Za-z0-9._-]{0,31}){1,5}$'
      example: webhook-profile:billing/asaas/webhook
      description: >-
        Opaque logical identifier in the server-managed webhook-profile catalog.
        It is never a URI, callback URL, filesystem path, token, secret value or
        carrier for PAN/CVV/expiration data.
      x-sensitive-data-policy: provider-metadata-fail-closed-v1
    MerchantAccountAlias:
      type: [string, 'null']
      maxLength: 80
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,79}$'
      description: >-
        Display-safe operational alias. It is rejected when its NFKC detection
        form contains PAN-like Luhn digits, CVV/CVC/CID, expiration, bearer, JWT,
        token or assigned credential material; rejection never echoes the value.
      x-sensitive-data-policy: provider-metadata-fail-closed-v1
    ProviderEnvironment:
      type: string
      enum: [SANDBOX, PRODUCTION]
    ProviderRole:
      type: string
      enum: [PRIMARY, CONTINGENCY, FUTURE]
    ProviderDesiredState:
      type: string
      enum: [OFF, PAUSED, ENABLED]
    ProviderOperationalState:
      type: string
      enum: [OFF, NOT_CERTIFIED, MISCONFIGURED, READY, ACTIVE, PAUSED, DEGRADED]
    ProviderCertificationState:
      type: string
      enum: [NOT_CERTIFIED, CERTIFIED, EXPIRED]
    ProviderAdapterState:
      type: string
      enum: [NOT_DEPLOYED, DEPLOYED]
    ReferenceHealth:
      type: string
      enum: [NOT_CONFIGURED, MISSING, AVAILABLE, INVALID, ROTATION_DUE, UNAVAILABLE]
    RevisionLifecycle:
      type: string
      enum: [DRAFT, PENDING_APPROVAL, APPROVED, REJECTED, INVALIDATED, ACTIVATED, SUPERSEDED]
    FreshnessState:
      type: string
      enum: [FRESH, STALE, PARTIAL]
    ProviderCapability:
      type: string
      enum:
        - CUSTOMER_MANAGEMENT
        - PAYMENT_CREATION
        - PAYMENT_QUERY
        - PAYMENT_CANCELLATION
        - REFUND
        - WEBHOOKS
        - RECONCILIATION
    ProviderReadinessReason:
      type: string
      enum:
        - DESIRED_STATE_OFF
        - DESIRED_STATE_PAUSED
        - ADAPTER_NOT_DEPLOYED
        - PROVIDER_NOT_CERTIFIED
        - CERTIFICATION_EXPIRED
        - ENVIRONMENT_NOT_AUTHORIZED
        - DEPLOYMENT_KILL_SWITCH_OFF
        - ACTIVE_REVISION_MISSING
        - SECRET_REFERENCE_MISSING
        - SECRET_REFERENCE_UNHEALTHY
        - WEBHOOK_REFERENCE_MISSING
        - REQUIRED_CAPABILITY_MISSING
        - RUNTIME_READINESS_UNAVAILABLE
    AllowedProviderAction:
      type: string
      enum:
        - CREATE_REVISION
        - EDIT_REVISION
        - SUBMIT_REVISION
        - APPROVE_REVISION
        - REJECT_REVISION
        - ACTIVATE_REVISION
    PaymentProviderProfilePage:
      type: object
      additionalProperties: false
      required: [schemaVersion, content, page, size, totalElements, totalPages, observedAt]
      properties:
        schemaVersion:
          type: string
          const: PAYMENT_PROVIDER_CONTROL_PLANE_V1
        content:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/PaymentProviderProfile'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        totalPages:
          type: integer
          minimum: 0
        observedAt:
          type: string
          format: date-time
    PaymentProviderProfile:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - providerCode
        - displayName
        - role
        - adapterState
        - adapterVersion
        - certificationState
        - declaredCapabilities
        - certifiedCapabilities
        - enabledCapabilities
        - desiredState
        - operationalState
        - readinessReasons
        - secretReferenceHealth
        - webhookReferenceHealth
        - environment
        - revision
        - deploymentExecutionEnabled
        - recoveryPlaneEnabled
        - allowedActions
        - observedAt
      properties:
        schemaVersion:
          type: string
          const: PAYMENT_PROVIDER_CONTROL_PLANE_V1
        providerCode:
          $ref: '#/components/schemas/ProviderCode'
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        role:
          $ref: '#/components/schemas/ProviderRole'
        adapterState:
          $ref: '#/components/schemas/ProviderAdapterState'
        adapterVersion:
          type: [string, 'null']
          maxLength: 64
          description: Deployed adapter build/version metadata; null when no adapter is deployed.
        certificationState:
          $ref: '#/components/schemas/ProviderCertificationState'
        declaredCapabilities:
          $ref: '#/components/schemas/CapabilitySet'
        certifiedCapabilities:
          $ref: '#/components/schemas/CapabilitySet'
        enabledCapabilities:
          $ref: '#/components/schemas/CapabilitySet'
        desiredState:
          $ref: '#/components/schemas/ProviderDesiredState'
        operationalState:
          $ref: '#/components/schemas/ProviderOperationalState'
        readinessReasons:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ProviderReadinessReason'
        secretReferenceHealth:
          $ref: '#/components/schemas/ReferenceHealth'
        secretReferenceId:
          $ref: '#/components/schemas/SecretReferenceId'
        secretReferenceVersion:
          type: [string, 'null']
          maxLength: 64
        secretReferenceObservedAt:
          type: [string, 'null']
          format: date-time
        webhookReferenceHealth:
          $ref: '#/components/schemas/ReferenceHealth'
        webhookReferenceId:
          $ref: '#/components/schemas/WebhookReferenceId'
        webhookReferenceVersion:
          type: [string, 'null']
          maxLength: 64
        webhookReferenceObservedAt:
          type: [string, 'null']
          format: date-time
        environment:
          $ref: '#/components/schemas/ProviderEnvironment'
        merchantAccountAlias:
          $ref: '#/components/schemas/MerchantAccountAlias'
        activeRevisionId:
          type: [string, 'null']
          format: uuid
        latestRevisionId:
          type: [string, 'null']
          format: uuid
        latestRevisionLifecycle:
          oneOf:
            - $ref: '#/components/schemas/RevisionLifecycle'
            - type: 'null'
        revision:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        deploymentExecutionEnabled:
          type: boolean
          const: false
        recoveryPlaneEnabled:
          type: boolean
        allowedActions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AllowedProviderAction'
        observedAt:
          type: string
          format: date-time
    CapabilitySet:
      type: array
      uniqueItems: true
      maxItems: 16
      items:
        $ref: '#/components/schemas/ProviderCapability'
    CreateConfigurationRevisionRequest:
      type: object
      additionalProperties: false
      required: [environment, role, desiredState, enabledCapabilities, reasonCode]
      properties:
        environment:
          $ref: '#/components/schemas/ProviderEnvironment'
        role:
          $ref: '#/components/schemas/ProviderRole'
        desiredState:
          $ref: '#/components/schemas/ProviderDesiredState'
        merchantAccountAlias:
          $ref: '#/components/schemas/MerchantAccountAlias'
        secretReferenceId:
          $ref: '#/components/schemas/SecretReferenceId'
        webhookReferenceId:
          $ref: '#/components/schemas/WebhookReferenceId'
        enabledCapabilities:
          $ref: '#/components/schemas/CapabilitySet'
        reasonCode:
          $ref: '#/components/schemas/ReasonCode'
    ConfigurationDecisionRequest:
      type: object
      additionalProperties: false
      required: [reasonCode]
      properties:
        reasonCode:
          $ref: '#/components/schemas/ReasonCode'
    ActivateConfigurationRevisionRequest:
      type: object
      additionalProperties: false
      required: [approvalId, approvalRevision, approvedContentHash, approvalSeal, reasonCode]
      properties:
        approvalId:
          type: string
          format: uuid
        approvalRevision:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        approvedContentHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        approvalSeal:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
          description: >-
            One-time authorization input bound to provider, revision,
            approvedContentHash and the frozen active-revision/profile-version
            baseline; never persisted by a browser. Activation fails on baseline drift.
        reasonCode:
          $ref: '#/components/schemas/ReasonCode'
    ReasonCode:
      type: string
      minLength: 3
      maxLength: 64
      pattern: '^[A-Z][A-Z0-9_]{2,63}$'
      description: Stable normalized reason, never a carrier for card or credential data.
      x-sensitive-data-policy: provider-metadata-fail-closed-v1
    PaymentProviderConfigurationRevision:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - revisionId
        - providerCode
        - revisionNumber
        - environment
        - role
        - desiredState
        - enabledCapabilities
        - lifecycle
        - contentHash
        - changedFields
        - preview
        - readinessBlockers
        - makerSubject
        - makerHumanPrincipalId
        - purpose
        - reasonCode
        - revision
        - createdAt
        - updatedAt
      properties:
        schemaVersion:
          type: string
          const: PAYMENT_PROVIDER_CONTROL_PLANE_V1
        revisionId:
          type: string
          format: uuid
        providerCode:
          $ref: '#/components/schemas/ProviderCode'
        revisionNumber:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        environment:
          $ref: '#/components/schemas/ProviderEnvironment'
        role:
          $ref: '#/components/schemas/ProviderRole'
        desiredState:
          $ref: '#/components/schemas/ProviderDesiredState'
        merchantAccountAlias:
          $ref: '#/components/schemas/MerchantAccountAlias'
        secretReferenceId:
          $ref: '#/components/schemas/SecretReferenceId'
        webhookReferenceId:
          $ref: '#/components/schemas/WebhookReferenceId'
        enabledCapabilities:
          $ref: '#/components/schemas/CapabilitySet'
        lifecycle:
          $ref: '#/components/schemas/RevisionLifecycle'
        contentHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        changedFields:
          type: array
          uniqueItems: true
          maxItems: 16
          items:
            type: string
            enum:
              - ENVIRONMENT
              - ROLE
              - DESIRED_STATE
              - MERCHANT_ACCOUNT_ALIAS
              - SECRET_REFERENCE
              - WEBHOOK_REFERENCE
              - ENABLED_CAPABILITIES
        preview:
          $ref: '#/components/schemas/ProviderConfigurationPreview'
        readinessBlockers:
          type: array
          uniqueItems: true
          items:
