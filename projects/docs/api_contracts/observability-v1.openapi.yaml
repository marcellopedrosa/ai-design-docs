openapi: 3.1.0
info:
  title: SaaS Service Observability Legacy API Baseline
  version: 0.2.0
  description: >-
    Draft, non-implementable projection of 1 legacy Observability HTTP operation extracted
    from the controller, application service, Loki adapter and current frontend consumer. The
    0.2.0 slice closes the observed request and outer response representation while preserving
    unresolved product, security, error and compatibility decisions as blockers. Code remains
    evidence of current behavior, not approval of product intent.
x-document-metadata:
  documentId: OBSERVABILITY-V1
  primaryNature: Contrato
  owner: Arquitetura, Backend e Qualidade
  status: Draft
  date: 2026-09-10
  lastReviewed: 2026-09-10
  normativeBaseline: TP-00052 v1.32, ANL-00055 v1.29, ANL-00056 v1.30 and ANL-00057 v1.0; operation-level product sources remain required
  relatedFiles:
