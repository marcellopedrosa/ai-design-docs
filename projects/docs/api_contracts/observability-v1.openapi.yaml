servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: AdminLogController
    description: Draft operations extracted from AdminLogController.
paths:
  /api/v1/admin/logs:
    get:
      operationId: getLogs
      tags: [AdminLogController]
      summary: Legacy getLogs operation
      description: >-
        Queries Loki through the current administrative Log Explorer. Spring binds the six optional
        query properties directly to LogQuery. The adapter always restricts the application label to
        saas-service and always requests at most 1000 upstream entries, sorted newest first. The
        module property is currently ignored; an unknown timeRange silently falls back to one hour.
        These behaviors are observed AS-IS and remain unapproved.
      security:
        - bearerAuth: []
      x-required-roles:
        - ROLE_SUPER_ADMIN
      x-required-authorities:
        []
      x-authorization-source: "SecurityConfig admin matcher; @PreAuthorize"
      x-authorization-review: required-negative-cases-and-tenant-impersonation
      x-preauthorize-expression: "hasRole('SUPER_ADMIN')"
      x-contract-priority: 1
      x-priority-basis: "Static route evidence found under frontend/ or website/."
      x-source-controller: "backend/src/main/java/br/com/duoset/saas_service/contexts/observability/internal/presentation/rest/AdminLogController.java:29"
      x-source-method: "AdminLogController.getLogs"
      x-source-confidence: observed-not-approved
      x-open-questions:
        - id: OBSERVABILITY-GETLOGS-001
          blocking: true
          action: Decide whether module must filter results or be removed and whether backend validation must reject unknown logLevel/timeRange values.
        - id: OBSERVABILITY-GETLOGS-002
          blocking: true
          action: Approve the SUPER_ADMIN and tenant-impersonation boundary, including negative tests and whether unrestricted cross-tenant queries are permitted.
        - id: OBSERVABILITY-GETLOGS-003
          blocking: true
          action: Decide safe bounds for traceId/searchText, log redaction, metadata disclosure, retention and whether the fixed 1000-result limit requires pagination.
        - id: OBSERVABILITY-GETLOGS-004
          blocking: true
          action: Decide whether Loki unavailability remains legacy 400 or migrates to a versioned 502 Problem Details response governed by RFC 9457.
        - id: OBSERVABILITY-GETLOGS-005
          blocking: true
          action: Reconcile the stale frontend test fields level/search/limit with the implemented consumer fields logLevel/searchText and the backend-fixed limit.
      x-consumer-evidence:
        - "/api/v1/admin/logs"
        - "frontend/src/services/logExplorerService.ts"
        - "frontend/src/app/(dashboard)/admin/logs/page.tsx"
      parameters:
        - name: module
          in: query
          required: false
          description: Accepted by Spring binding but currently ignored by the Loki query builder.
          schema:
            type: string
        - name: logLevel
          in: query
          required: false
          description: >-
            Exact Loki level label filter. The current backend accepts any non-blank string; the
            current frontend offers DEBUG, INFO, WARN and ERROR only.
          schema:
            type: string
        - name: tenantId
          in: query
          required: false
          description: Tenant label filter; malformed UUID values fail request binding with 400.
          schema:
            type: string
            format: uuid
        - name: traceId
          in: query
          required: false
          description: Exact trace label filter after the current adapter removes double quotes.
          schema:
            type: string
        - name: searchText
          in: query
          required: false
          description: Loki line-contains filter after double quotes are escaped.
          schema:
            type: string
        - name: timeRange
          in: query
          required: false
          description: >-
            Supported frontend values are LAST_15M, LAST_1H, LAST_6H and LAST_24H. Missing or
            unknown values currently select one hour instead of returning a validation error.
          schema:
            type: string
      responses:
        '200':
          description: Logs returned newest first, with at most 1000 entries requested from Loki.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LogEntry'
          x-source-confidence: observed-not-approved
          x-response-review: observed-shape-product-approval-required
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '403':
          $ref: '#/components/responses/LegacyForbidden'
        '500':
          $ref: '#/components/responses/LegacyInternalFailure'
      x-error-contract-review: >-
        required; Loki RestClient failures and adapter parsing failures are currently wrapped as
        BusinessException and therefore emitted as legacy 400, while otherwise uncaught failures
        use the sanitized legacy 500 envelope.
      x-version-policy:
        publicMajor: v1
        draftContractVersion: 0.2.0
        compatibilityDecision: required-before-active
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    LegacyBadRequest:
      description: >-
        Current shared handlers emit a 400 JSON error for malformed UUID binding and for
        BusinessException. Loki unavailability currently exposes the adapter message, including
        ERR-OBSERVABILITY-LOKI-UNREACHABLE, through this status.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyUnauthorized:
      description: Current security entry point emits a 401 JSON error; migration to RFC 9457 requires a versioned decision.
      headers:
        WWW-Authenticate:
          description: Bearer challenge governed by RFC 9110.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacySecurityError'
    LegacyForbidden:
      description: Current security or exception handler emits a 403 JSON error; exact boundary variants require validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacySecurityError'
    LegacyInternalFailure:
      description: Current shared handler emits a sanitized 500 JSON error with an errorId.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
  schemas:
    LogEntry:
      type: object
      additionalProperties: false
      required: [timestamp, level, message, traceId, metadata]
      properties:
        timestamp:
          type: string
          format: date-time
        level:
          type: string
          description: Loki stream level label; defaults to INFO only when that label is absent.
        message:
          type: string
          description: Raw Loki log line; redaction and disclosure rules remain a blocking decision.
        traceId:
          type: [string, 'null']
        metadata:
          type: object
          description: >-
            Dynamic Loki stream labels copied verbatim. Property names and value vocabulary are
            intentionally open because the adapter does not constrain them; disclosure approval
            remains blocked before Active.
          additionalProperties: true
          x-schema-review: dynamic-label-map-product-approval-required
    LegacyError:
      type: object
      description: Observed non-RFC-9457 envelope; variants remain a blocking review item.
      additionalProperties: true
      required: [message]
      properties:
        message:
          type: string
        errorId:
          type: string
          format: uuid
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
      x-schema-review: required
    LegacySecurityError:
      type: object
      description: Observed default security envelope; specialized path handlers may differ.
      additionalProperties: true
      required: [error, message, status, timestamp, path]
      properties:
        error:
          type: string
        message:
          type: string
        status:
          type: integer
        timestamp:
          type: string
          format: date-time
        path:
          type: string
      x-schema-review: required
    Problem:
      type: object
      description: Target Problem Details shape governed by RFC 9457; not claimed as current legacy behavior.
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
