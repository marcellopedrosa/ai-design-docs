        RETENTION_VERSION_PRECONDITION_REQUIRED:
          If-Policy-Version: [REQUIRED]
        RETENTION_PREVIEW_REQUIRED:
          previewToken: [REQUIRED, UNUSABLE]
  unknownJsonMember: omit-fieldErrors-because-unknown-name-must-not-be-echoed
  previewExpiredConsumedOrBindingMismatch: previewToken-UNUSABLE-without-distinguishing-cause
  maximumItems: 6
  presentRequiresAtLeastOneItem: true
  maximumOneErrorPerField: true
  duplicatesAllowed: false
  knownBodyFieldFailurePrecedence:
    - missing-or-explicit-null-is-REQUIRED
    - wrong-json-type-is-TYPE
    - numeric-token-with-noncanonical-unsigned-integer-lexeme-is-FORMAT
    - canonical-integer-below-minimum-is-MIN
    - canonical-integer-above-maximum-is-MAX
  retentionDaysLexemePattern: '^(0|[1-9][0-9]*)$'
  requiredBoundaryFixtures:
    'null': REQUIRED
    negative-zero: FORMAT
    negative-one: FORMAT
    decimal-90-point-0: FORMAT
    exponent-9e1: FORMAT
    integer-zero: MIN
    integer-181: MAX
    string-90: TYPE
    integer-90: VALID
  canonicalFieldOrder:
    - enabled
    - conversationRetentionDays
    - auditAccessRetentionDays
    - previewToken
    - If-Policy-Version
    - Idempotency-Key
x-auxiliary-store-policy:
  capacityEnforcement: >-
    A per-store PostgreSQL capacity row is locked FOR UPDATE in the same
    insert/delete transaction; COUNT-then-INSERT is forbidden. Rollback releases
    the slot, cleanup decrements exactly, and counter divergence blocks admission
    and readiness until bounded reconciliation.
  physicalRowsIncludeExpiredUntilTransactionalCleanup: true
  capacityCounterHasNoUpperCheck: true
  preview:
    maximumPhysicalRows: 10000
    rowIdentity: globally-unique-token-digest
    multipleLiveEntriesPerLogicalBinding: true
    concurrentOrRepeatedPreviewNeverInvalidatesAnotherUnconsumedToken: true
    consumptionDeletesRow: false
  idempotency:
    maximumPhysicalTerminalRows: 2000000
    onlyCommitted200IsDurable: true
    inFlightStateIsTransactionResidentAndNotCleanupEligible: true
  due:
    maximumPhysicalRowsPerDataset: 1000000
    datasets: [conversations, audit_access]
    rowIdentity: effective-tenant-plus-dataset
    disableDeleteDuringReconciliation: invalidates-generation-lease-and-scan-then-marks-suspect
  capacityFailure: 503-with-retry-after-no-valid-entry-eviction
  previewCapacityErrorCode: RETENTION_PREVIEW_UNAVAILABLE
  idempotencyCapacityErrorCode: RETENTION_DEPENDENCY_UNAVAILABLE
  cleanup:
    appliesTo: [preview, idempotency]
    intervalSeconds: 60
    defaultBatchSize: 5000
    maximumBatchesPerRun: 20
    timeBudgetSeconds: 45
    usesExpiryIndex: true
    cutoff: platform-database-time-captured-once-before-first-batch
    deletePredicate: expiresAt-less-than-or-equal-to-fixed-cutoff
    finalBacklogProbeUsesSameCutoff: true
  readinessAndAlertOccupancyPercent: 80
  capabilityReadiness:
    metric: conversation_audit_retention_administration_ready
    boundedStoreLabelValues: [preview, idempotency, due_conversations, due_audit_access, normalization]
    isGlobalPodLivenessOrReadiness: false
    previewAndIdempotencyNegativeWhen:
      - occupancy-at-least-80-percent
      - cleanup-backlog-after-bounded-run
      - count-state-not-exact
    dueNegativeWhen:
      - physical-count-at-hard-cap
      - count-state-not-exact
      - oldest-due-lag-greater-than-300-seconds
      - dispatcher-heartbeat-older-than-120-seconds
    dueOccupancyAtLeast80PercentBelowCap: alert-only
    previewAndIdempotencyRecoveryRequires:
      - exact-counter
      - no-cleanup-backlog-at-fixed-cutoff
      - occupancy-below-80-percent
    dueRecoveryRequires:
      - exact-counter
      - oldest-due-lag-at-most-300-seconds
      - dispatcher-heartbeat-at-most-120-seconds-old
      - physical-count-below-hard-cap
    dueRowsExpireByTtl: false
    driftBlocksNewAdmissions: true
    warningOccupancyOrBacklogBelowHardCapBlocksNewAdmissions: false
    hardCapBlocksNewAdmissions: true
    getAndTerminalReplayRemainAvailableWhenOwnDependenciesAreHealthy: true
x-capacity-reconciliation-policy:
  counts: physical-committed-rows-including-logically-expired-rows
  entrySequence: immutable-indexed-bigint
  countState: [EXACT, SUSPECT, RECONCILING]
  capacityCounterUpperCheckAllowed: false
  cardinalMutationLockOrder: capacity-row-before-committed-entry
  globalMultiLockOrder:
    classes: [capacity-row, advisory-or-stable-policy-lock, policy-row, committed-entry]
    capacityOrder: [IDEMPOTENCY, DUE_CONVERSATIONS, DUE_AUDIT_ACCESS]
    policyOrder: [default, tenant]
    dueEntryOrder: [conversation, audit_access]
    destructiveWorkerHoldsCapacityDuringStablePolicyWindow: false
    completionRunsInSeparateCapacityThenDueEntryTransaction: true
  idempotencyOwnerException: >-
    An uncommitted election insert may precede the capacity lock, but it must
    revalidate EXACT state and capacity after acquiring that lock or roll back.
  pollSeconds: 60
  distributedClaim: FOR-UPDATE-SKIP-LOCKED
  leaseSeconds: 60
  initialClaimFromSuspectOrPreventiveExact: >-
    Increment generation, create lease, capture max entry sequence and reset
    cursor and accumulated count.
  takeoverOfExpiredReconcilingLease: >-
    Replace only owner and lease token while preserving generation, high
    watermark, cursor and accumulated count.
  scan:
    freezesCardinalityWhileReconciling: true
    disableDueDeleteIsFailSafeExceptionAndRestartsScan: true
    highWatermark: max-entry-sequence-at-claim
    keysetBatchSize: 50000
    maximumBatchesPerExecution: 40
    statementTimeoutSeconds: 5
    executionTimeBudgetSeconds: 45
    progressCommittedPerBatch: true
    readsPayloadOrSensitiveValues: false
  preventiveVerificationSeconds:
    preview: 900
    idempotency: 21600
    due_conversations: 900
    due_audit_access: 900
  failureBackoffSeconds: [60, 120, 300, 600, 900]
  staleOwnerWritesRejectedByGenerationAndLeaseToken: true
  scanMaySpanExecutionsWithoutResettingProgress: true
  exactCountAboveCapIsPersistedWithoutClampOrEviction: true
  insertBlockedUnlessStateExactAndCountBelowCap: true
  previewAndIdempotencyReadinessRecoveryRequires:
    - exact-count
    - cleanup-without-backlog-at-fixed-cutoff
    - occupancy-below-80-percent
  dueReadinessRecoveryRequires:
    - exact-count
    - oldest-due-lag-at-most-300-seconds
    - dispatcher-heartbeat-at-most-120-seconds-old
    - physical-count-below-hard-cap
x-change-log:
  - version: 1.2.1
    revision: safe-bootstrap-normalization-gate-reconciliation-2026-09-12
    date: 2026-09-12
    changes: >-
      Reconciles the non-wire checkpoint extension with the already approved
      policy-bootstrap-enabled exception: before COMPLETE, the regular
      master-driven bootstrap, cache publication, preview/update and purge remain
      closed, while the separate guarded path may only insert a missing disabled
      default and GET may read that durable safe projection. No method, path,
      schema, response status, authorization rule or consumer wire changes.
  - version: 1.2.0
    revision: migration-id-reconciliation-2026-09-12
    date: 2026-09-12
    changes: >-
      Reconciles the non-wire legacy-normalization extension with the migration
      inventory approved in REQ-00043 v1.28: Phase A is V91 and Phase B is V92,
      after the already materialized Billing predecessor V90.1. HTTP operations,
      schemas, status codes, headers, authorization and the public API version
      remain byte-for-byte compatible; historical change-log entries retain the
      former planned identifiers as history rather than active instructions.
  - version: 1.2.0
    date: 2026-09-09
    changes: >-
      Narrows every policy operation to an original validated ROLE_SUPER_ADMIN
      authority under explicit active-tenant impersonation. Native or effective
      ROLE_TENANT_ADMIN no longer grants GET, preview or PUT; non-Super principals
      fail with 403 before tenant catalog or policy stores. Removes the planned
      tenant-member/e-mail authorization stage, requires one canonical X-Tenant-ID
      equal to the path, preserves active-tenant resolution and keeps all public
      schemas, 1..180-day bounds and asynchronous purge semantics unchanged.
  - version: 1.1.1
    date: 2026-09-09
    changes: >-
      Freezes the audited pre-implementation contract. It adds a machine-readable
      STALE_AFTER_COMMIT recovery policy, operation/status/errorCode-aware field
      error precedence, required success and diagnostic headers, deterministic
      early-413 CORS behavior, and authorization-epoch side-effect isolation.
      It also scopes idempotency lock timeout strictly to PUT rather than GET or
      preview, gives tracked-subject capacity an explicit Retry-After cause in
      GET/PUT/preview and keeps auxiliary-capacity degradation scoped to PUT/preview.
      The public endpoints and the absolute 1..180-day bounds remain unchanged;
      this revision does not claim runtime availability.
  - version: 1.1.0
    date: 2026-09-09
    changes: >-
      Replaces representation ETag/If-Match with the application concurrency
      headers Policy-Version/If-Policy-Version because executionState and preview
      are dynamic. Closes one-statement policy snapshots, multi-token preview
      concurrency, savepoint-scoped digest collision retries, active-subject
      registry expiry, the normalization state machine, PUT total deadline,
      field-error pairs and the COMMITTED/ROLLED_BACK/REJECTED reconciliation
      protocol with bounded negative-evidence lifetime. It also freezes browser
      CORS methods/headers (including browser-readable WWW-Authenticate),
      auth-epoch-safe client side effects, per-operation base-versus-committed
      policy-version semantics, global lock order, inclusive alert
      boundaries, reload recovery, Phase B database onboarding and the
      forward-fix-only rollback boundary after V90. This is a pre-implementation
      breaking contract revision; no deployed v1.0 consumer is being migrated.
  - version: 1.0.3
    date: 2026-09-09
    changes: >-
      Makes the pre-code transition executable without an activation dead end:
      release-controlled, non-overridable A/B markers separate recovery and V90
      artifacts. Replaces the Redis integer namespace with a non-reusable
      256-bit random generation, requires exact rotation confirmation, makes a
      missing generation a cache miss, and freezes SETNX winner handling. Also
      requires every normalization claim to honor nextAttemptAt and defines a
      positive residual-offender proof as PENDING with deterministic restart.
      It also scopes the no-past-nextAttemptAt invariant to fresh projections:
      an exact terminal PUT replay may carry its original historical instant and
      must be followed by authoritative GET. Endpoints and public schemas remain
      unchanged.
  - version: 1.0.2
    date: 2026-09-08
    changes: >-
      Freezes the two-release legacy normalization protocol: bounded V89 DDL,
      application-level recovery independent of the destructive master switch,
      bounded primary-key verification pass, mandatory global cache generation barrier,
      finite telemetry and a machine-enforced V90 preflight. A complete database
      may bootstrap only a missing default row, while a normalized default cannot
      be reactivated in this release. Adds the safe Phase A configuration preflight
      and fail-closed direct-upgrade behavior; endpoints and public schemas remain
      unchanged.
  - version: 1.0.1
    date: 2026-09-08
    changes: >-
      Removes actor from the idempotency namespace and binds it to the request
      fingerprint so cross-actor key reuse fails with 409; freezes literal
      equality between body policyVersion/basePolicyVersion and the unquoted
      strong ETag; closes preview behavior for disable-plus-reduce and supplied
      invalid tokens; freezes deterministic changeKinds, bounded per-operation
      and global rate limits, auxiliary-store capacities/cleanup and the
      400/415/428 request-validation split, including duplicate members/headers.
      Only committed 200 PUT responses remain replayable for 24 hours; owner
      failures release reservations, lock timeouts never take over, terminal
      replay does not reconsume its token, and clients refresh GET after success.
      Freezes PostgreSQL INSERT/ON-CONFLICT ownership, a Redis Cluster same-slot
      hash-tag layout, deterministic Retry-After and the empty-versus-valid-invalid
      JSON split. Also freezes pre-controller error causality, one budget domain
      per platform database, physical-row capacity reconciliation and the durable
      coalescing due queue used by asynchronous evaluation. Retains endpoints.
  - version: 1.0.0
    date: 2026-09-08
    changes: >-
      Initial GET, preview and optimistic/idempotent PUT contract with a 180-day
      ceiling, one public enable toggle, short-lived bound preview tokens and
      asynchronous purge semantics.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: ConversationAuditRetentionPolicy
    description: >-
      Policy management restricted to an original Super Admin under explicit
      active-tenant impersonation. It is deliberately outside the dedicated
      read-only /chatbot/audit/** security matcher.

paths:
  /api/v1/tenants/{tenantId}/settings/conversation-audit-retention:
    get:
      operationId: getConversationAuditRetentionPolicy
      tags: [ConversationAuditRetentionPolicy]
      summary: Read the effective tenant retention policy
      description: >-
        Returns only the tenant-facing projection and sanitized execution state.
        A divergent pair of internal purge flags is not coerced into a public
        toggle and fails closed with 409. Policy-Version is a dedicated
        concurrency token and must equal policyVersion in the body. Preview and
        PUT send that exact value in If-Policy-Version; it is not an HTTP entity
        validator for the separately changing executionState.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/EffectiveTenantId'
      responses:
        '200':
          description: Effective tenant policy and non-promissory execution state.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Policy-Version:
              $ref: '#/components/headers/PolicyVersion'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionPolicyResource'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TenantNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/PolicyDivergent'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalFailureRead'
        '503':
          $ref: '#/components/responses/UnavailableReadOrUpdate'

    put:
      operationId: updateConversationAuditRetentionPolicy
      tags: [ConversationAuditRetentionPolicy]
      summary: Replace the tenant-owned retention settings
      description: >-
        Commits the two periods and both internal purge flags atomically. enabled
        is the only public switch and maps to both flags. A previewToken is
        mandatory when the current policy is disabled and the candidate enables
        it, or when either candidate period is shorter than its current value.
        The opaque token must be unexpired and bound to this effective tenant,
        authenticated actor, If-Policy-Version value and exact canonical payload. The
        server derives actor, effectiveFrom, version and all operational guards.
        Success means only that configuration committed; it does not execute or
        claim completion of deletion. An exact idempotent retry returns the
        original 200 body and Policy-Version for 24 hours when the PUT lookup budget admits
        the retry. A pre-lookup 429/503 leaves the client intent unresolved and
        never authorizes key rotation. Because that response can become
        historical after a later successful mutation, clients must refetch GET
        after every success before treating policy state as current. Reusing a
        key with different input fails. Any owner-side 4xx, 429 or 5xx releases
        the reservation; a bounded in-flight waiter timeout never takes it over.
        A no-op returns the current body/Policy-Version and creates only NO_CHANGE security
        evidence plus the terminal replay; policy version, policy ledger and cache
        remain unchanged.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/EffectiveTenantId'
        - $ref: '#/components/parameters/IfPolicyVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetentionPolicyUpdateRequest'
      responses:
        '200':
          description: >-
            Policy committed synchronously. Any eligible purge is evaluated later
            by the bounded schedulers and remains subject to server-owned guards.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Policy-Version:
              $ref: '#/components/headers/PolicyVersion'
            Idempotency-Resolution:
              $ref: '#/components/headers/IdempotencyCommitted'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionPolicyResource'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TenantNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/PutConflict'
        '412':
          $ref: '#/components/responses/PutPreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/PutUnprocessableRequest'
        '428':
          $ref: '#/components/responses/PutPreconditionRequired'
        '429':
          $ref: '#/components/responses/PutRateLimited'
        '500':
          $ref: '#/components/responses/PutInternalFailure'
        '503':
          $ref: '#/components/responses/PutUnavailable'

  /api/v1/tenants/{tenantId}/settings/conversation-audit-retention/preview:
    post:
      operationId: previewConversationAuditRetentionPolicy
      tags: [ConversationAuditRetentionPolicy]
      summary: Preview a candidate policy without deleting data
      description: >-
        Evaluates the exact candidate against the current Policy-Version and returns
        only bounded counts, indicative cutoffs, finite warning codes and one
        opaque token valid for at most five minutes. Each dataset count stops at
        10,000 eligible roots/events and sets truncated=true when additional rows
        exist. No identifier, message, actor data, raw guard, content or row sample
        is returned. Counts can change after preview and never promise a delete.
        This operation mutates neither the policy nor audited business data.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/EffectiveTenantId'
        - $ref: '#/components/parameters/IfPolicyVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetentionPolicyCandidate'
      responses:
        '200':
          description: Bounded, PII-free preview bound to the current Policy-Version.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Policy-Version:
              $ref: '#/components/headers/PolicyVersion'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionPolicyPreview'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TenantNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/PolicyDivergent'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/PreviewUnprocessableRequest'
        '428':
          $ref: '#/components/responses/VersionPreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalFailureRead'
        '503':
          $ref: '#/components/responses/PreviewUnavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      description: >-
        Canonical PostgreSQL GUID text (8-4-4-4-12 ASCII hex), normalized to
        lowercase before comparison and use. It must equal the effective
        authenticated tenant context; UUID version/variant bits are not required.
      schema:
        type: string
        pattern: '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
    EffectiveTenantId:
      name: X-Tenant-ID
      in: header
      required: false
      description: >-
        Used only by the existing explicit Super Admin impersonation flow. It
        must occur exactly once, name an active tenant and equal tenantId. A
        tenant-scoped principal MUST NOT send this header at all; any presence,
        even equal to claim/path, is 403 after envelope validation. Repetition or
        malformed syntax is 400. Direct global Super Admin access remains
        forbidden.
      schema:
        type: string
        pattern: '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
        description: >-
          Normalized to lowercase before equality; UUID version/variant bits are
          not required.
    IfPolicyVersion:
      name: If-Policy-Version
      in: header
      required: true
      description: >-
        Opaque application concurrency version returned by GET. Wildcards,
        lists, quoted values, malformed values and stale versions are rejected. Preview binds its token
        to this exact value; PUT must send the same value.
      schema:
        type: string
        minLength: 5
        maxLength: 80
        pattern: '^d[1-9][0-9]*-t(?:0|[1-9][0-9]*)$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Opaque mutation key. Only a domain-separated digest may be persisted; the
        raw value must never be logged, traced, measured or returned. Its lookup
        namespace is effective tenant plus operation plus key digest. The
        authenticated actor, base policy version, canonical candidate and optional preview
        token digest belong to the request fingerprint; reusing the same key from
        another actor or with any different fingerprint field returns 409.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'

  headers:
    NoStore:
      description: Authenticated policy data must not be cached.
      required: true
      schema:
        type: string
        const: no-store
    PolicyVersion:
      description: >-
        Opaque application concurrency token derived from the effective default
        and tenant override versions. It is deliberately not an HTTP ETag.
      required: true
      schema:
        type: string
        minLength: 5
        maxLength: 80
        pattern: '^d[1-9][0-9]*-t(?:0|[1-9][0-9]*)$'
    CorrelationId:
      description: Opaque internal identifier safe to present to support.
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyCommitted:
      description: >-
        PUT-only proof that this exact fingerprint-equivalent request committed,
        whether on the new execution or a terminal replay.
      required: true
      schema:
        type: string
        const: COMMITTED
    IdempotencyResolution:
      description: >-
        PUT-only proof for the same Idempotency-Key and exact request tuple.
        COMMITTED is mandatory on a new or replayed 200. ROLLED_BACK may appear
        only after an elected owner has durably confirmed full rollback. REJECTED
        is mandatory only for an idempotency-fingerprint conflict against a
        committed terminal. Absence never proves that an earlier in-flight owner
        finished.
      schema:
        type: string
        enum: [COMMITTED, ROLLED_BACK, REJECTED]
    IdempotencyRolledBack:
      description: >-
        PUT-only proof that this elected owner durably completed a full rollback.
      required: true
      schema:
        type: string
        const: ROLLED_BACK
    IdempotencyConflictResolution:
      description: >-
        Required PUT 409 resolution. The causal extension determines whether the
        value is ROLLED_BACK or REJECTED for the returned error code.
      required: true
      schema:
        type: string
        enum: [ROLLED_BACK, REJECTED]
    RetryAfter:
      description: Whole seconds before a bounded dependency retry is allowed.
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 60

  responses:
    InvalidRequest:
      description: >-
        Malformed JSON, duplicate JSON member, UUID, Policy-Version or idempotency key;
        repeated singular If-Policy-Version/Idempotency-Key headers; or an absent
        Idempotency-Key on PUT. Missing If-Policy-Version is instead 428.
      x-error-codes: [RETENTION_REQUEST_INVALID]
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RetentionPolicyProblem'
    Unauthorized:
      description: A valid authenticated bearer token is required.
      x-error-codes: [AUTHENTICATION_REQUIRED]
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        WWW-Authenticate:
          required: true
          schema:
            type: string
            const: Bearer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RetentionPolicyProblem'
    Forbidden:
      description: >-
        Original ROLE_SUPER_ADMIN authority or the required active tenant
        impersonation boundary is missing. Native/effective ROLE_TENANT_ADMIN,
        ROLE_TENANT_AUDIT and direct global Super Admin access are denied.
      x-error-codes: [RETENTION_POLICY_FORBIDDEN]
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RetentionPolicyProblem'
    TenantNotFound:
      description: Tenant does not exist in the authorized effective scope.
      x-error-codes: [RETENTION_TENANT_NOT_FOUND]
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RetentionPolicyProblem'
    NotAcceptable:
      description: >-
        A present Accept header does not admit the success representation
        application/json through an exact, application/* or */* media range with
        effective q greater than zero. application/problem+json alone is
        insufficient. Rejected after authentication and tenant boundary, before
        invoking the use case; this route-scoped Problem is written despite the
        failed negotiation.
      x-error-codes: [RETENTION_RESPONSE_MEDIA_TYPE_NOT_ACCEPTABLE]
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RetentionPolicyProblem'
    PolicyDivergent:
      description: Internal purge flags diverge and cannot be coerced safely.
      x-error-codes: [RETENTION_POLICY_DIVERGENT]
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RetentionPolicyProblem'
    PutConflict:
      description: >-
        Internal flags diverge, or an idempotency key is reused with a different
        actor, policy version or canonical request.
      x-error-codes:
        - RETENTION_POLICY_DIVERGENT
        - RETENTION_IDEMPOTENCY_CONFLICT
      x-idempotency-resolution-by-cause:
        RETENTION_POLICY_DIVERGENT-after-owner-rollback-confirmed: ROLLED_BACK
        RETENTION_IDEMPOTENCY_CONFLICT-against-committed-terminal: REJECTED
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Idempotency-Resolution:
          $ref: '#/components/headers/IdempotencyConflictResolution'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RetentionPolicyProblem'
    PreconditionFailed:
      description: If-Policy-Version no longer identifies the effective current policy.
      x-error-codes: [RETENTION_VERSION_PRECONDITION_FAILED]
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RetentionPolicyProblem'
    PutPreconditionFailed:
      description: >-
        If-Policy-Version no longer identifies the effective current policy. Because this
        check occurs only after a new owner is elected, a confirmed rollback
        returns Idempotency-Resolution ROLLED_BACK.
      x-error-codes: [RETENTION_VERSION_PRECONDITION_FAILED]
      x-idempotency-resolution-by-cause:
        owner-rollback-confirmed: ROLLED_BACK
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Idempotency-Resolution:
          $ref: '#/components/headers/IdempotencyRolledBack'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RetentionPolicyProblem'
    PreviewUnprocessableRequest:
      description: >-
        Closed candidate validation failed: literal null/top-level non-object,
        missing/null/unknown/wrong-type member, forbidden numeric lexeme or
        out-of-range period.
      x-error-codes: [RETENTION_REQUEST_INVALID]
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RetentionPolicyProblem'
    PutUnprocessableRequest:
      description: >-
        Closed payload validation failed, including literal null/top-level
        non-object, missing/null/unknown/wrong-type member, forbidden numeric
        lexeme, out-of-range period or malformed preview token.
      x-error-codes:
        - RETENTION_REQUEST_INVALID
        - RETENTION_PREVIEW_INVALID
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RetentionPolicyProblem'
    VersionPreconditionRequired:
      description: If-Policy-Version is absent.
      x-error-codes: [RETENTION_VERSION_PRECONDITION_REQUIRED]
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RetentionPolicyProblem'
    PutPreconditionRequired:
      description: >-
        If-Policy-Version is absent; a preview token required by enabling or by any period
        reduction is absent; or any supplied syntactically valid preview token is
        expired, consumed or not bound to the exact actor, tenant, policy version and
        payload. Reducing a period still requires preview when enabled=false is
        submitted in the same candidate.
      x-error-codes:
        - RETENTION_VERSION_PRECONDITION_REQUIRED
        - RETENTION_PREVIEW_REQUIRED
      x-idempotency-resolution-by-cause:
        missing-If-Policy-Version-before-lookup: omitted
        preview-semantic-failure-after-owner-rollback-confirmed: ROLLED_BACK
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Idempotency-Resolution:
          $ref: '#/components/headers/IdempotencyResolution'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RetentionPolicyProblem'
    UnsupportedMediaType:
      description: >-
        POST/PUT request body is not application/json, including a missing or
        unsupported Content-Type. The request is rejected before any use case.
      x-error-codes: [RETENTION_MEDIA_TYPE_UNSUPPORTED]
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RetentionPolicyProblem'
    PayloadTooLarge:
      description: >-
        The declared or streamed POST/PUT body exceeds 4096 bytes. The global DoS
        envelope returns this route-scoped problem before authentication and
        invokes no parser, use case or store.
      x-error-codes: [RETENTION_PAYLOAD_TOO_LARGE]
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RetentionPolicyProblem'
    RateLimited:
      description: >-
        The effective tenant plus actor plus operation stage or its global window
        is exhausted. GET/preview denial precedes policy store/preview query;
        PUT_LOOKUP denial precedes the idempotency transaction, while PUT mutation
        denial occurs only for a newly elected owner and rolls back its reservation
        before this response. A committed terminal replay consumes lookup but not
        mutation budget.
      x-error-codes: [RETENTION_RATE_LIMITED]
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RetentionPolicyProblem'
    PutRateLimited:
      description: >-
        PUT_LOOKUP denial occurs before the idempotency transaction and omits the
        resolution header. PUT mutation denial occurs only after owner election;
        after confirmed rollback it returns Idempotency-Resolution ROLLED_BACK.
      x-error-codes: [RETENTION_RATE_LIMITED]
      x-idempotency-resolution-by-cause:
        PUT_LOOKUP-before-owner: omitted
        PUT-mutation-owner-rollback-confirmed: ROLLED_BACK
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Idempotency-Resolution:
          $ref: '#/components/headers/IdempotencyResolution'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RetentionPolicyProblem'
    InternalFailureRead:
      description: Unexpected internal failure; no successful operation is reported.
      x-error-codes: [RETENTION_INTERNAL_FAILURE]
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RetentionPolicyProblem'
    PutInternalFailure:
      description: >-
        Unexpected failure or mandatory atomic security-audit failure. Mutation
        is rolled back and no policy success is reported.
      x-error-codes: [RETENTION_INTERNAL_FAILURE, RETENTION_AUDIT_FAILURE]
      x-idempotency-resolution-by-cause:
        owner-rollback-confirmed: ROLLED_BACK
        rollback-or-connection-outcome-uncertain: omitted
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Idempotency-Resolution:
          $ref: '#/components/headers/IdempotencyResolution'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RetentionPolicyProblem'
    UnavailableReadOrUpdate:
      description: >-
        Policy store, limiter or another dependency required by GET is
        temporarily unavailable. No policy or delete success is implied.
      x-error-codes:
        - RETENTION_POLICY_NOT_READY
        - RETENTION_RATE_LIMIT_UNAVAILABLE
        - RETENTION_DEPENDENCY_UNAVAILABLE
      x-retry-after-by-cause:
        redis-unavailable: 5
        tracked-subject-capacity: closest-safe-active-subject-expiry-clamped-1-to-60-or-60
        other-policy-or-dependency-not-ready: 60
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RetentionPolicyProblem'
    PutUnavailable:
      description: >-
        A dependency required by PUT is unavailable. Failures before owner
        election, waiter/lock timeout and uncertain connection outcomes omit the
        resolution header. A new owner whose rollback is durably confirmed
        returns Idempotency-Resolution ROLLED_BACK.
      x-error-codes:
        - RETENTION_POLICY_NOT_READY
        - RETENTION_RATE_LIMIT_UNAVAILABLE
        - RETENTION_DEPENDENCY_UNAVAILABLE
      x-idempotency-resolution-by-cause:
        prelookup-or-waiter-or-lock-timeout-or-uncertain: omitted
        owner-rollback-confirmed: ROLLED_BACK
      x-retry-after-by-cause:
        redis-unavailable: 5
        idempotency-lock-timeout: 5
        tracked-subject-capacity: closest-safe-active-subject-expiry-clamped-1-to-60-or-60
        auxiliary-capacity-or-drift: closest-safe-expiry-clamped-1-to-60-or-60
        other-policy-or-dependency-not-ready: 60
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Idempotency-Resolution:
          $ref: '#/components/headers/IdempotencyResolution'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RetentionPolicyProblem'
    PreviewUnavailable:
      description: >-
        Policy store, preview query or another required dependency is temporarily
        unavailable. An unavailable scheduler projection is represented by a
        finite blocker and null nextAttemptAt instead of failing an otherwise safe
        policy read. No policy or data delete is implied by this response.
      x-error-codes:
        - RETENTION_POLICY_NOT_READY
        - RETENTION_PREVIEW_UNAVAILABLE
        - RETENTION_RATE_LIMIT_UNAVAILABLE
        - RETENTION_DEPENDENCY_UNAVAILABLE
      x-retry-after-by-cause:
        redis-unavailable: 5
        tracked-subject-capacity: closest-safe-active-subject-expiry-clamped-1-to-60-or-60
        auxiliary-capacity-or-drift: closest-safe-expiry-clamped-1-to-60-or-60
        other-policy-or-dependency-not-ready: 60
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RetentionPolicyProblem'

  schemas:
    RetentionPolicyCandidate:
      type: object
      additionalProperties: false
      required:
        - enabled
        - conversationRetentionDays
        - auditAccessRetentionDays
      properties:
        enabled:
          type: boolean
          description: Maps atomically to both server-owned purge flags.
        conversationRetentionDays:
          type: integer
          minimum: 1
          maximum: 180
          description: Request token must use unsigned decimal digits only; 90.0 and 9e1 are rejected.
        auditAccessRetentionDays:
          type: integer
          minimum: 1
          maximum: 180
          description: Request token must use unsigned decimal digits only; 90.0 and 9e1 are rejected.

    RetentionPolicyUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - enabled
        - conversationRetentionDays
        - auditAccessRetentionDays
      properties:
        enabled:
          type: boolean
          description: Maps atomically to both server-owned purge flags.
        conversationRetentionDays:
          type: integer
          minimum: 1
          maximum: 180
        auditAccessRetentionDays:
          type: integer
          minimum: 1
          maximum: 180
        previewToken:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]+$'
          description: >-
            Opaque, single-use and memory-only client value. It is required only
            for enabling or reducing at least one period, expires within 300
            seconds and is validated whenever supplied.

    RetentionPolicyResource:
      type: object
      additionalProperties: false
      required:
        - enabled
        - conversationRetentionDays
        - auditAccessRetentionDays
        - policyVersion
        - effectiveFrom
        - updatedAt
        - executionState
      properties:
        enabled:
          type: boolean
          description: Safe projection of two equal internal purge flags.
        conversationRetentionDays:
          type: integer
          minimum: 1
          maximum: 180
        auditAccessRetentionDays:
          type: integer
          minimum: 1
          maximum: 180
        policyVersion:
          type: string
          pattern: '^d[1-9][0-9]*-t(?:0|[1-9][0-9]*)$'
          maxLength: 80
          description: Must equal the response Policy-Version header literally.
        effectiveFrom:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        executionState:
          $ref: '#/components/schemas/RetentionExecutionState'

    RetentionExecutionState:
      type: object
      additionalProperties: false
      required: [overall, conversations, auditAccess]
      properties:
        overall:
          type: string
          enum: [DISABLED, PENDING, BLOCKED, SCHEDULED]
          description: >-
            Configuration/execution readiness only. No value means that rows were
            deleted or that backlog processing completed. Precedence is
            DISABLED when the public toggle is false, then BLOCKED when either
            dataset is blocked, then SCHEDULED only when both datasets have a
            known next attempt, otherwise PENDING.
        conversations:
          $ref: '#/components/schemas/DatasetExecutionState'
        auditAccess:
          $ref: '#/components/schemas/DatasetExecutionState'

    DatasetExecutionState:
      type: object
      additionalProperties: false
      required: [state, blockers, nextAttemptAt]
      properties:
        state:
          type: string
          enum: [DISABLED, PENDING, BLOCKED, SCHEDULED]
          description: >-
            DISABLED when the public toggle is false; otherwise BLOCKED when the
            blocker list is non-empty, SCHEDULED when blockers are empty and a
            next attempt is known, or PENDING when it is not known.
        blockers:
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ExecutionBlocker'
        nextAttemptAt:
          type: [string, 'null']
          format: date-time
          description: >-
            Durable dueAt from the current due row, falling back to a
            known legacy scheduler instant after that row completes; null when no
            safe attempt is known. It is not a start, deletion or completion
            deadline.

    ExecutionBlocker:
      type: string
      enum:
        - RETENTION_CAPABILITY_DISABLED
        - DRY_RUN_ACTIVE
        - LEGAL_HOLD_ACTIVE
        - BACKUP_RESTORE_NOT_READY
        - POLICY_NOT_READY
        - SCHEDULER_UNAVAILABLE

    RetentionPolicyPreview:
      type: object
      additionalProperties: false
      required:
        - basePolicyVersion
        - current
        - proposed
        - changeKinds
        - conversations
        - auditAccess
        - countLimitPerDataset
        - countedAt
        - previewToken
        - expiresAt
        - warnings
      properties:
        basePolicyVersion:
          type: string
          pattern: '^d[1-9][0-9]*-t(?:0|[1-9][0-9]*)$'
          maxLength: 80
          description: Must equal If-Policy-Version and the policyVersion used to issue the preview token.
        current:
          $ref: '#/components/schemas/RetentionPolicyCandidate'
        proposed:
          $ref: '#/components/schemas/RetentionPolicyCandidate'
        changeKinds:
          type: array
          description: >-
            Derived only by comparing current to proposed. Canonical order is
            toggle, conversation period, audit-access period. Each changed
            dimension contributes exactly one directional code. NO_CHANGE is the
            sole item exactly when no dimension changed and is never combined.
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum:
              - ENABLE
              - DISABLE
              - REDUCE_CONVERSATIONS
              - INCREASE_CONVERSATIONS
              - REDUCE_AUDIT_ACCESS
              - INCREASE_AUDIT_ACCESS
              - NO_CHANGE
        conversations:
          $ref: '#/components/schemas/DatasetPreview'
        auditAccess:
          $ref: '#/components/schemas/DatasetPreview'
        countLimitPerDataset:
          type: integer
          const: 10000
        countedAt:
          type: string
          format: date-time
        previewToken:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]+$'
          description: >-
            Returned once. Clients must keep it only in volatile memory and must
            not log it, persist it or include it in a URL.
        expiresAt:
          type: string
          format: date-time
        warnings:
          type: array
          minItems: 3
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum:
              - DELETION_IS_IRREVERSIBLE
              - COUNTS_CAN_CHANGE_AFTER_PREVIEW
              - PURGE_IS_ASYNCHRONOUS_AND_GUARDED

    DatasetPreview:
      type: object
      additionalProperties: false
      required: [cutoff, eligibleCount, truncated]
      properties:
        cutoff:
          type: string
          format: date-time
          description: Indicative UTC cutoff derived by the server for this preview.
        eligibleCount:
          type: integer
          minimum: 0
          maximum: 10000
          description: >-
            Eligible conversation roots or access events observed up to the cap;
            it is never a count of exposed identifiers or message content.
        truncated:
          type: boolean
          description: True when more than 10,000 eligible rows were observed.

    RetentionPolicyProblem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail
        - instance
        - errorCode
        - correlationId
        - timestamp
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          minLength: 1
          maxLength: 120
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
          maxLength: 240
          description: Sanitized message that never echoes request values or tokens.
        instance:
          type: string
          format: uri-reference
          pattern: '^/errors/conversation-audit-retention/[A-Z0-9_]+$'
        errorCode:
          type: string
          enum:
            - AUTHENTICATION_REQUIRED
            - RETENTION_REQUEST_INVALID
            - RETENTION_POLICY_FORBIDDEN
            - RETENTION_TENANT_NOT_FOUND
            - RETENTION_POLICY_NOT_READY
            - RETENTION_POLICY_DIVERGENT
            - RETENTION_VERSION_PRECONDITION_REQUIRED
            - RETENTION_VERSION_PRECONDITION_FAILED
            - RETENTION_PREVIEW_REQUIRED
            - RETENTION_PREVIEW_INVALID
            - RETENTION_PREVIEW_UNAVAILABLE
            - RETENTION_IDEMPOTENCY_CONFLICT
            - RETENTION_MEDIA_TYPE_UNSUPPORTED
            - RETENTION_RESPONSE_MEDIA_TYPE_NOT_ACCEPTABLE
            - RETENTION_PAYLOAD_TOO_LARGE
            - RETENTION_RATE_LIMITED
            - RETENTION_RATE_LIMIT_UNAVAILABLE
            - RETENTION_AUDIT_FAILURE
            - RETENTION_DEPENDENCY_UNAVAILABLE
            - RETENTION_INTERNAL_FAILURE
        correlationId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        fieldErrors:
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      additionalProperties: false
      required: [field, code]
      properties:
        field:
          type: string
          enum:
            - enabled
            - conversationRetentionDays
            - auditAccessRetentionDays
            - previewToken
            - If-Policy-Version
            - Idempotency-Key
        code:
          type: string
          enum: [REQUIRED, TYPE, MIN, MAX, FORMAT, STALE, UNUSABLE]
