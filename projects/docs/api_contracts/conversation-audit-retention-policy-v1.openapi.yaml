openapi: 3.1.0
info:
  title: SaaS Service Conversation Audit Retention Policy API
  version: 1.2.1
  description: >-
    Canonical tenant-scoped contract for reading, previewing and replacing the
    Conversation Audit retention policy. Every operation requires the original,
    validated ROLE_SUPER_ADMIN authority plus the existing explicit active-tenant
    impersonation flow: one canonical X-Tenant-ID equal to tenantId and an active
    tenant resolved by the server. Effective ROLE_TENANT_ADMIN, whether native or
    injected by impersonation, is never an entitlement for this API, and
    ROLE_TENANT_AUDIT does not grant policy access. The public toggle maps atomically to both
    internal purge flags, while the two retention periods remain independent and
    are restricted to whole days from 1 through 180. Preview never deletes data;
    PUT commits policy state synchronously and purge remains asynchronous,
    bounded and subject to server-owned operational guards. All responses are
    private and non-cacheable.
x-rbac:
  requiredOriginalAuthority: ROLE_SUPER_ADMIN
  originalAuthorityEvaluatedBeforeTenantContextAugmentation: true
  tenantBoundaryRequired: true
  activeTenantImpersonationRequired: true
  nativeTenantAdminAccess: false
  injectedTenantAdminAuthorityGrantsAccess: false
  tenantAuditInherited: false
  tenantAuditCanMutate: false
  superAdminDirectAccess: false
  superAdminRequiresActiveTenantImpersonation: true
x-cors-observability:
  crossOriginAllowedMethods:
    - GET
    - POST
    - PUT
  preflightTransportMethod: OPTIONS
  crossOriginAllowedRequestHeaders:
    - Authorization
    - Content-Type
    - X-Tenant-ID
    - If-Policy-Version
    - Idempotency-Key
  crossOriginReadableResponseHeaders:
    - Policy-Version
    - Idempotency-Resolution
    - X-Correlation-ID
    - Retry-After
    - WWW-Authenticate
  explicitOriginAllowlistRequired: true
  preflightForExplicitAuthorizationHeaderMustSucceed: true
  browserCredentialsMode: omit
  browserBackendRealTestUsesResponseHeadersGet: true
x-client-auth-side-effect-safety:
  requestCapturesAuthorizationEpoch: true
  staleEpoch401MayTerminateCurrentSession: false
  currentEpoch401PreservesExistingSessionTermination: true
  retentionRoute403MayTriggerGlobalSessionSideEffect: false
  deactivatedAccountInferenceFromProblemMessageForbidden: true
  authErrorWithoutValidIdempotencyResolutionResolvesUnknownMutation: false
  contextSwitchLogoutOrUnmountAfterPutDispatch:
    volatileTupleOutcome: lost-not-resolved
    crossesIntoNextTenantOrSession: false
    freshGetRequiredBeforeAnotherIntent: true
x-client-post-commit-refresh:
  on200Committed:
    discardVolatileTuple: true
    hydrateFromPutBody: false
    authoritativeGetRequired: true
  getFailureState: STALE_AFTER_COMMIT
  getFailureBlocks:
    - edit
    - preview
    - put
    - new-idempotency-key
  onlyRecoveryAction: manual-get
  replaysPut: false
  localizedMessageKey: conversationAudit.retention.savedCurrentStateUnavailable
x-early-payload-too-large-cors:
  appliesTo: retention-route-POST-and-PUT-413-before-security-chain
  sourceOfAllowedOrigins: same-explicit-CorsConfigurationSource
  allowedOriginResponseHeaders:
    - Access-Control-Allow-Origin
    - Access-Control-Expose-Headers
    - Vary
  varyHeaderMustContain: Origin
  exposedHeaderListIncludes: X-Correlation-ID
  invalidOrAbsentOriginIsNeverReflected: true
  wildcardOriginForbidden: true
  allowCredentials: false
x-retention-policy:
  publicToggleMapsTo:
    - conversationPurgeEnabled
    - auditAccessPurgeEnabled
  publicRetentionDays:
    minimum: 1
    maximum: 180
  serverOwnedFields:
    - tenantId
    - actor
    - policyVersion
    - effectiveFrom
    - updatedAt
    - cutoff
    - conversationPurgeEnabled
    - auditAccessPurgeEnabled
    - masterEnabled
    - dryRun
    - legalHold
    - backupRestoreReady
    - schedule
  purgeTriggeredByHttp: false
x-cache-generation-policy:
  namespaceKey: conversation-audit:retention-policy:v1:namespace
  dataKeyPattern: 'conversation-audit:retention-policy:v1:{generation}:{tenantId}'
  generation:
    entropyBits: 256
    encoding: unpadded-Base64URL
    encodedLength: 43
    ttl: none
    source: cryptographically-secure-random-generator
    counterOrIncrementCommandAllowed: false
    reuseAllowed: false
  readWhenGenerationIsAbsentOrMalformed: durable-source-cache-miss-without-initialization
  writeInitialization:
    operation: SETNX-with-fresh-random-generation-then-read-winner
    composeDataKeyOnlyAfterWinnerRead: true
  globalInvalidation:
    operation: atomic-SET-of-fresh-random-generation-and-exact-readback-confirmation
    complexity: constant-time
    registryOrKeyspaceScanAllowed: false
  namespaceLossCanReuseStaleDataKey: false
  generationValueMayBeLoggedOrExposed: false
x-time-authority:
  durableWallClock: platform-PostgreSQL-transaction-time-captured-once-per-operation
  governs:
    - policy-effectiveFrom-and-updatedAt
    - preview-countedAt-createdAt-and-expiresAt
    - preview-consume-and-expiry
    - idempotency-terminal-createdAt-and-expiresAt
    - terminal-reclaim
    - auxiliary-cleanup-cutoff
    - dueAt-lease-window-lag-and-dispatch-budget-window
  redisRateWindowsUseRedisServerTimeInsideLua: true
  applicationNodeWallClockAuthoritative: false
  monotonicApplicationTickerUse: local-total-deadlines-only
x-preview-policy:
  requiredFor:
    - enabling-a-disabled-policy
    - reducing-conversation-retention-days
    - reducing-audit-access-retention-days
  requiredPredicateIsIndependentOfProposedEnabled: true
  suppliedSyntacticallyValidTokenIsAlwaysValidatedAndConsumedByNewOwner: true
  tokenConsumption:
    operation: update-consumedAt-in-place-with-atomic-unconsumed-and-unexpired-predicate
    cardinalityDelta: 0
    rollbackLeavesTokenUnconsumed: true
    consumedPhysicalRowCountsUntilCapacityFirstCleanupDelete: true
    sameBindingReissueInvalidatesEarlierToken: false
  terminalReplayChecksPersistedDigestWithoutReconsumingToken: true
  suppliedTokenFailureStatus:
    malformed: 422
    expired-consumed-or-binding-mismatch: 428
  tokenTtlSeconds: 300
  tokenGeneration:
    entropyBits: 256
    encoding: unpadded-Base64URL
    digestStoreConstraint: global-unique-token-digest
    generatedDigestMustNotMatchAnyExistingRow: true
    maximumCollisionAttemptsPerTransaction: 3
    eachAttemptUsesJdbcSavepoint: true
    rollbackToSavepointOnlyForNamedTokenDigestUniqueConstraint: true
    anyOtherConstraintOrSqlStateAbortsWholeTransaction: true
    collisionNeverOverwritesAnotherBinding: true
    exhaustedCollisionOutcome: 503-RETENTION_PREVIEW_UNAVAILABLE-with-full-transaction-rollback
    deterministicGeneratorAllowedOnlyInTests: true
  perDatasetCountCap: 10000
  perDatasetStatementTimeoutSeconds: 5
  multipleLiveTokensForSameLogicalBindingAllowed: true
  tokenRowIdentity: globally-unique-token-digest
  tokenValidationBinding:
    - effective-tenant
    - authenticated-actor
    - base-policy-version
    - canonical-candidate-payload
    - expiration
  exposesPersonallyIdentifiableInformation: false
x-idempotency-policy:
  replayWindowSeconds: 86400
  namespace: effective-tenant + operation + key-digest
  requestFingerprint:
    - authenticated-actor
    - base-policy-version
    - canonical-candidate-payload
    - preview-token-digest-if-present
  fingerprintCanonicalization: >-
    SHA-256 over a versioned, length-delimited, domain-separated typed tuple in
    fixed actor, base policy version, enabled, conversation days, audit-access days and
    preview-token-digest-or-empty order; never raw JSON bytes.
  exactReplayReturnsOriginalResponseWhenPutLookupBudgetAdmits: true
  preLookup429Or503LeavesClientIntentUnresolved: true
  terminalLookupBypassesAuxiliaryCapacityAdmission: true
  replayedFields: [status, body, Policy-Version]
  derivedPerResponseFields:
    X-Correlation-ID: fresh-per-request
    Idempotency-Resolution: COMMITTED-on-every-new-or-replayed-200
  terminalReplayStatus: 200-only
  replayedPutBodyMayContainHistoricalNextAttemptAt: true
  replayedPutBodyIsNeverAuthoritativeForCurrentDisplay: true
  clientMustFetchAuthoritativeGetAfterEveryPut200: true
  resolutionHeader:
    name: Idempotency-Resolution
    COMMITTED: required-on-new-or-replayed-put-200
    ROLLED_BACK: allowed-only-after-new-owner-rollback-is-durably-confirmed
    REJECTED: >-
      required when a committed terminal with incompatible fingerprint proves
      that this exact attempted tuple did not commit under this key
    omittedOn:
      - every-pre-lookup-response
      - waiter-or-lock-timeout
      - uncertain-rollback-or-connection-outcome
      - invalid-response
    resolvesPreviouslyAmbiguousClientIntentOnlyWhenSameFingerprintEquivalentTupleIsRetried: true
    authoritativeGetAloneResolvesAmbiguousIntent: false
    responseWithoutValidResolutionHeaderAfterAmbiguousDispatchRemainsUnknown: true
    conflictResolution:
      RETENTION_IDEMPOTENCY_CONFLICT: REJECTED
      conflictAgainstRolledBackReservationThatNoLongerExists: new-owner-election-is-allowed
  clientResolutionEvidenceWindow:
    seconds: 86400
    elapsedClock: monotonic-from-first-put-dispatch-of-that-in-memory-intent
    continuousForegroundSessionRequired: true
    forceEvidenceExpiredOn:
      - visibility-hidden
      - pagehide-or-freeze
      - monotonic-ticker-unavailable-or-reset
    reloadBehavior:
      volatileTupleIsLost: true
      clientMayClaimResolved: false
      beforeAnyNewIntent: fresh-authoritative-GET-required
      lateOldCommitSafety: >-
        A subsequent mutation must use the freshly read Policy-Version, so a late
        commit from the former page is either observed by GET or makes the new
        If-Policy-Version stale; the browser does not pretend to recover the lost tuple.
    beforeWindowEnd:
      COMMITTED: resolves
      ROLLED_BACK: resolves
      REJECTED: resolves
    atOrAfterWindowEnd:
      COMMITTED: resolves-the-current-retry-and-requires-authoritative-get
      ROLLED_BACK: evidence-expired-requires-authoritative-get-and-explicit-human-review
      REJECTED: evidence-expired-requires-authoritative-get-and-explicit-human-review
    negativeResolutionAloneMayAuthorizeNewKeyAfterWindow: false
    afterEvidenceExpiredNewIntentRequires: fresh-GET-plus-explicit-review-and-new-preview-when-destructive
  nonTerminalOwnerOutcomes: >-
    Any 4xx, 429 or 5xx owner outcome rolls back or removes its new reservation;
    a waiter timeout never removes or takes over the active owner's reservation.
  inFlightReservation: >-
    After PUT_LOOKUP admission, begin the platform transaction and execute INSERT
    ON CONFLICT DO NOTHING RETURNING against the namespace unique key with a
    lock_timeout equal to the lesser of five seconds and the positive remaining
    PUT deadline. A returned row elects the uncommitted owner. Zero
    rows after a committed conflict require terminal fingerprint classification;
    rollback by a concurrent owner allows this insert to win. Lock timeout is 503,
    without takeover. No in-flight lease is committed or cleanup-eligible.
  divergentFingerprintGuarantee: >-
    Reuse by another actor or payload is 409 only while an incompatible committed
    terminal remains. An in-flight owner is never classified through uncommitted
    state: the insert waits until commit, rollback or timeout. If the owner fully
    rolled back and its reservation disappeared, the same high-entropy key may
    elect a new owner; no rollback tombstone is persisted.
  expiredTerminalReclaim: >-
    When expiresAt is not after the PostgreSQL time captured once in the
    classification transaction, close that transaction, then in a short
    transaction lock the idempotency capacity row,
    conditionally delete that expired terminal and decrement exactly once using
    the same lock order as cleanup. Retry owner election once without consuming a
    second PUT_LOOKUP budget. A new timeout, counter drift or failure is 503; no
    takeover or policy mutation occurs.
  historicalReplayRequiresAuthoritativeGetAfterSuccess: true
  noOp200Behavior: >-
    Return the current body and Policy-Version, consume any supplied token for the new
    owner, record NO_CHANGE security evidence and terminal replay, but do not
    change policy version, policy ledger or cache.
  rawKeyPersistedOrLogged: false
x-policy-version-consistency:
  headerName: Policy-Version
  preconditionHeaderName: If-Policy-Version
  headerSyntax: '{policyVersion}'
  responseBodyMustEqualPolicyVersionHeader: true
  responseBodyFieldByOperation:
    GET: resource.policyVersion
    PREVIEW: basePolicyVersion
    PUT: resource.policyVersion
    PUT_EXACT_TERMINAL_REPLAY: resource.policyVersion
  requestPreconditionSemantics:
    PREVIEW: If-Policy-Version-equals-response-Policy-Version-and-basePolicyVersion
    PUT: If-Policy-Version-is-pre-commit-base-and-response-Policy-Version-is-committed-version
    PUT_EXACT_TERMINAL_REPLAY: original-If-Policy-Version-remains-in-fingerprint-and-may-differ-from-replayed-committed-Policy-Version
  appliesTo:
    - GET-resource-policyVersion
    - POST-preview-basePolicyVersion
    - PUT-resource-policyVersion
    - exact-idempotent-replay
  durablePolicyReadSnapshot:
    defaultAndTenantOverride: one-PostgreSQL-statement-snapshot
    versionHeaderBodyAndPreviewCurrentDerivedFromExactlySameResultRow: true
    mixedDefaultAndOverrideVersionsAllowed: false
    executionStateMayBeReadSeparatelyBecauseItIsNonPromissory: true
x-change-kind-derivation:
  source: compare-current-to-proposed
  canonicalOrder:
    - toggle
    - conversationRetentionDays
    - auditAccessRetentionDays
  toggleChanged: exactly-one-of-ENABLE-or-DISABLE
  conversationPeriodChanged: exactly-one-of-REDUCE_CONVERSATIONS-or-INCREASE_CONVERSATIONS
  auditAccessPeriodChanged: exactly-one-of-REDUCE_AUDIT_ACCESS-or-INCREASE_AUDIT_ACCESS
  noChangeIsExclusive: true
x-rate-limit-policy:
  subjectIdentity: SHA-256-over-versioned-effective-tenant-plus-authenticated-actor
  subjectIdentityExcludesOperationStage: true
  counterNamespace: subject-digest + operation-stage
  windowSeconds: 60
  defaultLimits:
    GET: 60
    PREVIEW: 6
    PUT: 10
    PUT_LOOKUP: 120
  configurableBounds:
    GET: { minimum: 1, maximum: 120 }
    PREVIEW: { minimum: 1, maximum: 30 }
    PUT: { minimum: 1, maximum: 30 }
    PUT_LOOKUP: { minimum: 1, maximum: 240 }
  maximumTrackedSubjects: 10000
  maximumTrackedSubjectsScope: per-platform-database-budget-domain-or-per-dev-test-process
  oneSubjectConsumesOneRegistrySlotAcrossAllFourStages: true
  trackedSubjectCapacityBehavior: 503-with-retry-after-no-active-window-eviction
  activeSubjectDefinition: at-least-one-admitted-event-with-expiry-after-redis-now
  deniedNewSubjectDoesNotCreateRegistryOrCounterState: true
  globalSafetyLimitsPerWindow:
    GET: 6000
    PREVIEW: 600
    PUT: 600
    PUT_LOOKUP: 6000
  applyAfterAuthenticationAndTenantBoundary: true
  applyBeforePolicyOrPreviewStore: true
  PUT-terminal-idempotency-replay-is-exempt-from-mutation-budget-only: true
  PUT-all-attempts-consume-lookup-budget-before-idempotency-store: true
  PUT-new-idempotency-owner-is-rate-limited-before-policy-store: true
  PUT-rate-limit-denial-rolls-back-new-owner-reservation: true
  operationAdmissionOrder:
    GET:
      - all-precontroller-http-security-and-response-negotiation-gates
      - GET-rate-budget
      - durable-policy-store
    PREVIEW:
      - all-precontroller-gates-and-closed-candidate-validation
      - PREVIEW-rate-budget
      - platform-transaction-and-countedAt
      - durable-policy-store
      - flags-divergence-409
      - If-Policy-Version-stale-412
      - bounded-dataset-count-queries
      - token-generation-and-store
    PUT:
      - all-precontroller-gates-and-closed-candidate-validation
      - PUT_LOOKUP-rate-budget
      - idempotency-store-classification
      - PUT-rate-budget-for-new-owner-only
      - durable-policy-store-and-mutation
  deniedRateBudgetTouchesPolicyOrPreviewStore: false
  rawTenantOrActorInKeyOrLog: false
  managedEnvironmentStore: redis-distributed
  managedRedisAtomicity:
    requiredHashTagTemplate: '{audit-retention:<deploymentId>}'
    subjectStageAndGlobalKeysShareOneClusterSlot: true
    distinctSubjectStageAndGlobalIdentityIsInKeySuffixOutsideHashTag: true
    deploymentIdIsAllowlistedStartupConfiguration: true
    startupRejectsEmptyInvalidOrCrossSlotKeys: true
    oneLuaScriptAtomicallyUpdates:
      - subject-sliding-window
      - global-safety-window
      - active-subject-registry
      - ttl
      - cardinality
    timeSource: Redis-TIME-inside-script
    activeSubjectRegistry:
      type: sorted-set
      member: subject-digest
      score: latest-admitted-event-expiry
      pruneBeforeCardinalityCheck: ZREMRANGEBYSCORE-minus-infinity-through-now-inclusive
      admittedEventRefresh: ZADD-GT-with-now-plus-60-seconds
      existingSubjectAtCapacityMayContinueToItsStageBudgets: true
      newSubjectAtCapacity: 503-with-retry-after-ceil-minimum-live-score-minus-now-clamped-1-through-60
      expiredSubjectReclamationIsAtomic: true
    deploymentIdBindsToPlatformDatabase: true
    allPodsVersionsAndCanariesOnSameDatabaseUseSameDeploymentId: true
    singletonDatabaseBindingRejectsDivergentDeploymentIdAtStartup: true
    distinctPlatformDatabasesMayShareTheSameBudgetIdConservatively: true
    budgetIsolationRequiresDistinctProvisionedDeploymentIds: true
  degradedMode: managed-environments-fail-closed-503-without-redis
  localOnlyFallback: >-
    explicit-dev-or-test-profile using one synchronized bounded subject registry
    with the same identity, expiry, pruning, capacity and stage-window semantics
  exhaustedResponse: 429-with-retry-after
x-security-precontroller-policy:
  solePreAuthenticationException: request-body-over-4096-bytes-is-413
  routeScopeRecognition:
    matchBeforeTenantGuidValidation: true
    structuralShapes:
      - 'GET|PUT /api/v1/tenants/{one-non-empty-segment}/settings/conversation-audit-retention'
      - 'POST /api/v1/tenants/{one-non-empty-segment}/settings/conversation-audit-retention/preview'
    tenantSegmentSyntaxValidatedAfterAuthenticationAs400: true
    matcherMustNotRequireUuid: true
    canonicalServletPathWithoutDoubleDecode: true
    encodedSeparatorOrBackslashAllowed: false
    outsideRouteScope: [empty-tenant-segment, extra-segment, alias, trailing-path-or-slash]
    combinedPrecedence:
      malformed-tenant-segment-plus-4097-byte-body-plus-invalid-jwt: 413
      malformed-tenant-segment-plus-accepted-body-plus-invalid-jwt: 401
      malformed-tenant-segment-plus-accepted-body-plus-valid-non-super-admin-jwt: 403
      malformed-tenant-segment-plus-accepted-body-plus-valid-raw-super-admin-jwt: 400
  stopAtFirstOutcome: true
  orderedStages:
    - stage: authentication
      outcomes:
        missing-or-invalid-bearer-jwt-or-canonical-sub-uuid: 401-AUTHENTICATION_REQUIRED
      actorIdentity: canonical-lowercase-jwt-sub-uuid
      superAdminTenantClaimRequired: false
    - stage: original-authority
      outcomes:
        validated-principal-without-raw-role-super-admin: 403-RETENTION_POLICY_FORBIDDEN
      evaluatedBeforeTenantContextAugmentation: true
      effectiveRoleSubstitutionForbidden: true
      tenantCatalogLookupOnFailure: false
    - stage: tenant-envelope
      outcomes:
        malformed-path-tenant-id-or-repeated-or-malformed-present-x-tenant-id: 400-RETENTION_REQUEST_INVALID
    - stage: tenant-boundary
      outcomes:
        missing-active-impersonation-header-or-header-path-mismatch: 403-RETENTION_POLICY_FORBIDDEN
      catalogLookupOnFailure: false
    - stage: tenant-catalog
      outcomes:
        unknown-or-inactive: 404-RETENTION_TENANT_NOT_FOUND
        unavailable: 503-RETENTION_DEPENDENCY_UNAVAILABLE
    - stage: response-accept-negotiation
      outcomes:
        incompatible: 406-RETENTION_RESPONSE_MEDIA_TYPE_NOT_ACCEPTABLE
  routeScopedProblemAlwaysUsed: true
  invokesControllerUseCasePolicyPreviewDueOrDestructiveStoreOnFailure: false
  catalogStoresAllowedOnlyAtTheirNamedStages: true
  implementationOrdering:
    securityChainRequiresOriginalSuperAdminBeforeTenantContext: true
    nativeTenantAdminDeniedBeforeTenantCatalog: true
    legacyUserStatusFilterPerformsNoTenantMembershipLookupForValidatedSuperAdmin: true
    tenantContextServletFilterOrder: -90
    postTenantContextRetentionAccessFilterOrder: -80
    postContextGateStages: [active-tenant-context, original-super-admin-defense, response-accept-negotiation]
    postContextGateRegisteredExactlyOnceAndIsNotComponentScanned: true
    securityChainAllowsOnlyOriginalSuperAdminWithBoundaryCoherentImpersonationToReachTenantContext: true
  denialEvidence: >-
    Only a tenant-boundary mismatch reuses the existing PII-free best-effort
    TenantBoundaryAuthorizationFilter denial audit. Its failure does not change
    the denial. Other pre-controller outcomes emit finite metrics only; the
    atomic policy-mutation audit applies only inside a successful PUT owner.
x-request-validation:
  beginsOnlyAfterAllPrecontrollerSecurityStagesIncludingAccept: true
  precedenceAfterResponseAcceptNegotiation:
    - request-media-type
    - singular-header-envelope-and-required-headers
    - json-syntax-and-duplicate-member-detection
    - closed-schema-and-business-field-validation
  acceptedResponseAcceptValues:
    - absent-as-wildcard
    - application/json-with-effective-q-greater-than-zero
    - application-wildcard-with-effective-q-greater-than-zero
    - any-wildcard-with-effective-q-greater-than-zero
  problemJsonAloneDoesNotAdmitSuccessRepresentation: true
  malformedOrAllCompatibleRangesQZeroIsNotAcceptable: true
  routeScopedProblemsIgnoreFailedNegotiation: true
  incompatibleAccept: 406-RETENTION_RESPONSE_MEDIA_TYPE_NOT_ACCEPTABLE
  acceptedRequestMediaType: >-
    Exactly application/json with no parameter, or one case-insensitive
    charset=utf-8 parameter; missing type, another/duplicate parameter, another
    charset and every structured-syntax suffix such as application/problem+json
    are rejected.
  singularHeaderPrecedence: >-
    Any repeated or malformed If-Policy-Version/Idempotency-Key is 400. Otherwise a
    missing If-Policy-Version is 428 before checking a missing PUT Idempotency-Key, which
    is 400.
  missingIfPolicyVersion: 428-RETENTION_VERSION_PRECONDITION_REQUIRED
  malformedIfPolicyVersion: 400-RETENTION_REQUEST_INVALID
  missingOrMalformedIdempotencyKey: 400-RETENTION_REQUEST_INVALID
  malformedJson: 400-RETENTION_REQUEST_INVALID
  zeroByteOrWhitespaceOnlyBody: 400-RETENTION_REQUEST_INVALID
  duplicateJsonPropertyName: 400-RETENTION_REQUEST_INVALID
  validJsonNullOrNonObjectTopLevel: 422-RETENTION_REQUEST_INVALID
  missingNullUnknownWrongTypeOrForbiddenNumericLexeme: 422-RETENTION_REQUEST_INVALID
  repeatedIfPolicyVersionOrIdempotencyKeyHeader: 400-RETENTION_REQUEST_INVALID
  unsupportedOrMissingJsonContentType: 415-RETENTION_MEDIA_TYPE_UNSUPPORTED
x-request-size-policy:
  appliesBeforeAuthenticationForDosContainment: true
  soleAuthFirstPrecedenceException: true
  methods: [POST, PUT]
  maximumBytes: 4096
  checksDeclaredAndActuallyReadBytes: true
  chunkedOrUnknownLengthImplementation:
    eagerMaximumBytesRead: 4097
    acceptedPayloadReplayedByteIdentically: true
    bodyLogged: false
    invokesAuthenticationOrCatalogBeforeDecision: false
  exceeded: 413-RETENTION_PAYLOAD_TOO_LARGE
  invokesAuthenticationParserUseCaseOrStore: false
x-put-processing-order:
  - request-size-envelope-before-authentication
  - authentication-and-stable-identity
  - original-raw-super-admin-authority
  - tenant-envelope
  - tenant-boundary
  - tenant-catalog
  - active-impersonation-context-and-original-super-admin-defense
  - response-accept-negotiation
  - media-type
  - singular-required-headers
  - json-syntax-duplicate-detection-lexical-and-closed-schema
  - put-lookup-rate-budget
  - begin-platform-transaction
  - insert-on-conflict-do-nothing-returning-with-bounded-lock-wait
  - terminal-replay-or-fingerprint-conflict-when-insert-returned-zero
  - new-owner-mutation-and-global-rate-budgets-when-insert-returned-row
  - new-owner-auxiliary-capacity-admission
  - shared-default-advisory-lock-then-exclusive-tenant-advisory-lock-then-default-row-FOR-SHARE-then-tenant-override-FOR-UPDATE
  - durable-policy-divergence-and-if-policy-version
  - preview-token-semantics
  - no-op-or-atomic-material-commit
x-retry-after-policy:
  unit: whole-seconds
  minimum: 1
  maximum: 60
  RETENTION_RATE_LIMITED: >-
    Greatest applicable ceiling among exhausted subject and global windows until
    each oldest counted request exits, clamped to 1 through 60.
  trackedSubjectCapacity: >-
    Closest safe active-subject expiry clamped to 1 through 60, or 60 when no safe
    timestamp is available.
  RETENTION_RATE_LIMIT_UNAVAILABLE: 5
  idempotencyLockTimeout: 5
  auxiliaryCapacityOrCounterDrift: >-
    Duration until the closest safely known expiry, clamped to 1 through 60; use
    60 when no safe expiry is available.
  otherPolicyOrDependencyNotReady: 60
  automaticPutRetryAllowed: false
x-performance-policy:
  dataset: conversation-audit-retention-administration-performance-v1
  GET:
    statementTimeoutSeconds: 1
    p95Milliseconds: 500
    p99Milliseconds: 1000
  PREVIEW:
    perDatasetStatementTimeoutSeconds: 5
    totalDeadlineSeconds: 11
    deadlineStartsImmediatelyAfterSuccessfulPreviewRateAdmission: true
    remainingBudgetCheckedBefore:
      - platform-transaction
      - policy-read
      - each-dataset-count
      - capacity-lock
      - each-token-collision-attempt
      - commit
    policyCapacityAndTokenLocalTimeoutSeconds: 1
    everyTransactionLockAndStatementTimeout: minimum-of-local-limit-and-positive-remaining-budget
    noStageStartsWithoutPositiveRemainingBudget: true
    deadlineBeforeCommit: 503-RETENTION_PREVIEW_UNAVAILABLE-full-rollback-zero-token
    responseTransportFailureAfterCommit: unobserved-token-is-non-destructive-single-use-and-cleaned-up-without-invalidating-other-tokens
    p95Milliseconds: 5000
    p99Milliseconds: 10000
    timeoutError: 503-RETENTION_PREVIEW_UNAVAILABLE
    timeoutIssuesPreviewToken: false
  PUT:
    totalDeadlineSeconds: 5
