openapi: 3.1.0
info:
  title: SaaS Service Dashboard Fiscal Overview API
  version: 1.0.0
  description: >-
    Canonical contract for the repository-local tenant Dashboard fiscal snapshot.
    It freezes the implemented BASIC projection and authorizes the fiscal business
    zone default correction without activating the other legacy Dashboard operations.
x-document-metadata:
  documentId: DASHBOARD-FISCAL-OVERVIEW-V1
  primaryNature: Contrato
  owner: Produto Fiscal, Backend, Frontend, Segurança e Arquitetura
  status: Active
  date: 2026-09-12
  lastReviewed: 2026-09-12
  normativeBaseline: PRD-00004 v1.6; REQ-00057 v1.7; UC-00001 v1.14; human repository-local approval premise on 2026-09-12
  relatedFiles:
    - docs/product/prds/PRD-00004-fiscal-operations.md
    - docs/product/requirements/REQ-00057-tenant-dashboard-fiscal-overview.md
    - docs/product/use-cases/UC-00001-dashboard-view.md
    - docs/delivery/plans/implementation_plans/backend/IP-BE-2.3.14-fiscal-business-zone-default.md
x-contract-status: Active
x-implementation-authorization: repository-local
x-decision-provenance:
  classification: HUMAN_EXPLICIT_AND_REPOSITORY_EVIDENCE
  decidedOn: 2026-09-12
  decision: >-
    Treat implemented and DEV-tested behavior as approved: activate only
    getFiscalOverview for Tenant Admin and validated Super Admin impersonation,
    preserve its tested legacy JSON errors, and make America/Recife the default
    fiscal zone while retaining APP_FISCAL_BUSINESS_ZONE as an explicit override.
x-compatibility:
  classification: behavioral-compatible-pre-production-default-correction
  pathsChanged: false
  payloadShapeChanged: false
  successStatusesChanged: false
  authorizationChanged: false
  meaning: >-
    The response schema is unchanged. Only the no-override business-zone default
    changes from America/Sao_Paulo to America/Recife; configured environments keep
    their explicit override and no external rollout is claimed.
x-change-log:
  - version: 1.0.0
    date: 2026-09-12
    compatibility: behavioral-compatible-pre-production-default-correction
    changes: >-
      Extracts getFiscalOverview from the Dashboard Draft baseline, freezes the
      tested tenant boundary and legacy errors, and authorizes the Recife default.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: TenantFiscalOverview
    description: Read-only BASIC fiscal projection for one effective tenant.

paths:
  /api/v1/dashboard/fiscal-overview:
    get:
      operationId: getFiscalOverview
      tags: [TenantFiscalOverview]
      summary: Read the effective tenant fiscal overview
      description: >-
        Returns seven civil days of Fiscal and DAS counts plus at most four recent
        movements. Native Tenant Admin uses the signed tenant_id claim and cannot
        override it. Super Admin must establish validated impersonation through
        X-Tenant-ID. ROLE_TENANT_USER and ROLE_TENANT_AUDIT are a later approved
        amendment and are not part of this 1.0.0 repository-local baseline.
      security:
        - bearerAuth: []
      x-required-roles: [ROLE_TENANT_ADMIN, ROLE_SUPER_ADMIN]
      x-required-authorities: []
      x-tenant-boundary:
        tenantAdmin: signed tenant_id claim is authoritative; X-Tenant-ID cannot replace it
        superAdmin: X-Tenant-ID must select an active tenant and materialize validated impersonation
        globalSuperAdmin: forbidden without an effective tenant
        validationOrder: before the Dashboard use case and Fiscal query
      x-cache-policy: no-store on successful and security-handler responses
      x-window-policy:
        property: app.fiscal.business-zone
        defaultZone: America/Recife
        environmentOverride: APP_FISCAL_BUSINESS_ZONE
        interval: '[D-6 00:00, D+1 00:00) in the effective zone'
        hostTimezoneFallback: prohibited
      parameters:
        - name: X-Tenant-ID
          in: header
          required: false
          description: >-
            Effective tenant selected only by a Super Admin impersonation flow.
            It never overrides the signed claim of a native tenant principal.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The effective tenant fiscal overview was returned.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantFiscalOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalFailure'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    NoStore:
      description: The tenant-scoped representation must not be stored.
      schema:
        type: string
        const: no-store
  responses:
    Unauthorized:
      description: Authentication is missing or invalid.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        WWW-Authenticate:
          description: Bearer challenge governed by RFC 9110.
          schema:
            type: string
            const: Bearer
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/LegacyUnauthorizedSecurityError'
              - $ref: '#/components/schemas/LegacyUnauthorizedCodeError'
    Forbidden:
      description: The role, tenant claim or impersonation boundary is invalid.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/LegacyForbiddenSecurityError'
              - $ref: '#/components/schemas/LegacyAccessDeniedError'
              - $ref: '#/components/schemas/LegacyForbiddenCodeError'
    InternalFailure:
      description: The bounded projection failed and returned a sanitized error ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyInternalError'
  schemas:
    TenantFiscalOverview:
      type: object
      additionalProperties: false
      required: [period, daily, recentMovements]
      properties:
        period:
          $ref: '#/components/schemas/FiscalOverviewPeriod'
        daily:
          type: array
          minItems: 7
          maxItems: 7
          items:
            $ref: '#/components/schemas/FiscalOverviewDailyCount'
        recentMovements:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/FiscalOverviewRecentMovement'
    FiscalOverviewPeriod:
      type: object
      additionalProperties: false
      required: [from, to, zoneId]
      properties:
        from:
          type: string
          format: date
          description: D-6 in the effective business zone.
        to:
          type: string
          format: date
          description: D in the effective business zone.
        zoneId:
          type: string
          minLength: 1
          description: >-
            Effective app.fiscal.business-zone. With no environment override the
            value is America/Recife; otherwise it is APP_FISCAL_BUSINESS_ZONE.
    FiscalOverviewDailyCount:
      type: object
      additionalProperties: false
      required: [date, situacaoFiscal, das]
      properties:
        date:
          type: string
          format: date
        situacaoFiscal:
          type: integer
          format: int64
          minimum: 0
        das:
          type: integer
          format: int64
          minimum: 0
    FiscalOverviewRecentMovement:
      type: object
      additionalProperties: false
      required: [id, type, clientName, status, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [SITUACAO_FISCAL, DAS]
        clientName:
          type: string
          minLength: 1
        status:
          type: string
          enum: [SUCCESS, PENDING, ERROR]
        occurredAt:
          type: string
          format: date-time
    LegacyUnauthorizedSecurityError:
      type: object
      additionalProperties: false
      required: [error, message, status, timestamp, path]
      properties:
        error:
          type: string
          const: UNAUTHORIZED
        message:
          type: string
          const: Autenticação necessária para acessar este recurso.
        status:
          type: integer
          const: 401
        timestamp:
          type: string
          format: date-time
        path:
          type: string
          const: /api/v1/dashboard/fiscal-overview
    LegacyForbiddenSecurityError:
      type: object
      additionalProperties: false
      required: [error, message, status, timestamp, path]
      properties:
        error:
          type: string
          const: ACCESS_DENIED
        message:
          type: string
          const: Você não tem permissão para acessar este recurso.
        status:
          type: integer
          const: 403
        timestamp:
          type: string
          format: date-time
        path:
          type: string
          const: /api/v1/dashboard/fiscal-overview
    LegacyAccessDeniedError:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          const: Acesso negado.
    LegacyUnauthorizedCodeError:
      type: object
      description: Fail-closed tenant-context rejection emitted before controller invocation.
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          const: UNAUTHORIZED
    LegacyForbiddenCodeError:
      type: object
      description: Fail-closed tenant-context rejection emitted before controller invocation.
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          const: ACCESS_DENIED
    LegacyInternalError:
      type: object
      additionalProperties: false
      required: [message, errorId]
      properties:
        message:
          type: string
          const: Erro interno ao processar a solicitação.
        errorId:
          type: string
          format: uuid
