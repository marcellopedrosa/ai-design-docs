openapi: 3.1.0
info:
  title: SaaS Service Tenant Billing Usage API
  version: 1.0.0
  description: >-
    Canonical contract for the tenant-scoped monthly usage snapshot. CHATBOT_MSG
    represents only regular user messages accepted by quota admission. Bot output,
    control traffic, blocked attempts, deduplicated replay and in-flight reservations
    do not increment the metric.
x-document-metadata:
  documentId: BILLING-USAGE-V1
  primaryNature: Contrato
  owner: Produto, Billing, Segurança, Backend e Arquitetura
  status: Active
  date: 2026-09-10
  lastReviewed: 2026-09-10
  normativeBaseline: PRD-00001 v1.13; REQ-00011 v1.11; UC-00022 v1.9; ADR-0026 v2.2; human approval on 2026-09-10
  relatedFiles:
    - docs/product/prds/PRD-00001-billing-enterprise.md
    - docs/product/requirements/REQ-00011-chatbot-usage-limits-and-billing.md
    - docs/product/use-cases/UC-00022-chatbot-quota-enforcement.md
    - docs/adrs/ADR-0026-billing-api-tenant-admin-cutover.md
    - docs/delivery/plans/implementation_plans/backend/IP-BE-13.3.5-chatbot-quota-kpi-read-model.md
    - docs/delivery/plans/implementation_plans/frontend/IP-FE-13.3.5-chatbot-quota-kpi-inbound-usage.md
x-contract-status: Active
x-implementation-authorization: repository-local
x-decision-provenance:
  classification: HUMAN_EXPLICIT
  decidedOn: 2026-09-10
  decision: >-
    Publish getUsageRecords as an Active tenant-scoped contract with monthly
    America/Sao_Paulo reconciliation, confirmed inbound CHATBOT_MSG, no-store,
    approved tenant impersonation boundary and RFC 9457 error variants.
x-compatibility:
  classification: breaking-pre-production-cutover
  pathsChanged: false
  payloadShapeChanged: false
  discriminatorValuesChanged: true
  successStatusesChanged: false
  meaning: >-
    The schemaVersion, source and windowPolicy literals change atomically in the
    repository. There is no approved external consumer or legacy alias.
x-change-log:
  - version: 1.0.0
    date: 2026-09-10
    compatibility: breaking-pre-production-cutover
    changes: >-
      Activates getUsageRecords with a reconciled inbound-only CHATBOT_MSG metric,
      America/Sao_Paulo monthly window, no-store and approved security/errors.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: TenantBillingUsage
    description: Confirmed and observational usage for one effective tenant.

paths:
  /api/v1/tenants/{tenantId}/billing/usage:
    get:
      operationId: getUsageRecords
      tags: [TenantBillingUsage]
      summary: Read the current tenant billing usage snapshot
      description: >-
        Returns the current civil month in America/Sao_Paulo. CHATBOT_MSG is the
        maximum of the accepted legacy observation and the durable quota floor
        baseline_usage + confirmed_count. RESERVED is excluded. Other metrics remain
        observational, therefore snapshot completeness is PARTIAL.
      x-required-roles: [ROLE_TENANT_ADMIN, ROLE_SUPER_ADMIN]
      x-required-authorities: []
      x-tenant-boundary:
        tenantAdmin: tenant_id JWT claim must equal tenantId
        superAdmin: explicit impersonation requires X-Tenant-ID equal to tenantId
        tenantStatus: active
        validationOrder: before repository or datasource routing
      x-cache-policy: no-store
      x-chatbot-msg-policy:
        counted: regular inbound user message with confirmed admission
        excluded: [outbound, system, control, blocked, deduplicated-replay, reserved]
        reconciliation: max-observed-usage-vs-baseline-plus-confirmed
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Current tenant usage snapshot returned.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantUsageSnapshot'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/UsageConflict'}
        '500': {$ref: '#/components/responses/UsageUnavailable'}

components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  headers:
    NoStore:
      description: The usage representation must not be stored.
      schema: {type: string, const: no-store}
  responses:
    InvalidRequest:
      description: The path parameter is not a canonical UUID.
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/BillingUsageProblem'}
    Unauthorized:
      description: Authentication is missing or invalid.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        WWW-Authenticate:
          description: Bearer challenge.
          schema: {type: string, const: Bearer}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/TenantBillingSecurityProblem'}
    Forbidden:
      description: The role, effective tenant or impersonation boundary is invalid.
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content:
        application/problem+json:
          schema:
            oneOf:
              - {$ref: '#/components/schemas/TenantBillingSecurityProblem'}
              - {$ref: '#/components/schemas/BillingUsageProblem'}
    UsageConflict:
      description: The stored usage projection is inconsistent and requires reconciliation.
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/BillingUsageProblem'}
    UsageUnavailable:
      description: The usage projection could not be read safely.
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/BillingUsageProblem'}
  schemas:
    TenantUsageSnapshot:
      type: object
      additionalProperties: false
      required: [schemaVersion, completeness, tenantId, source, windowPolicy, windowStart, windowEnd, asOf, metrics]
      properties:
        schemaVersion: {type: string, const: TENANT_USAGE_V2}
        completeness:
          type: string
          const: PARTIAL
          description: Non-chatbot metrics remain observational; CHATBOT_MSG is reconciled and confirmed.
        tenantId: {type: string, format: uuid}
        source: {type: string, const: USAGE_RECORDS_AND_CONFIRMED_CHATBOT_ADMISSIONS}
        windowPolicy: {type: string, const: CALENDAR_MONTH_AMERICA_SAO_PAULO_V1}
        windowStart: {type: string, format: date-time}
        windowEnd: {type: string, format: date-time}
        asOf: {type: string, format: date-time}
        metrics:
          type: array
          maxItems: 5
          items: {$ref: '#/components/schemas/TenantUsageMetric'}
    TenantUsageMetric:
      type: object
      additionalProperties: false
      required: [metricType, quantity]
      properties:
        metricType:
          type: string
          enum: [SERPRO_QUERY, LLM_TOKEN, CHATBOT_MSG, Documento_EXTRA, FISCAL_QUERY]
        quantity: {type: string, pattern: '^(0|[1-9][0-9]{0,37})$'}
    TenantBillingSecurityProblem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, errorCode, code, i18nKey, timestamp]
      properties:
        type: {type: string, format: uri, pattern: '^https://hub-contabil\.com/errors/'}
        title: {type: string, const: Falha na operação de faturamento}
        status: {type: integer, enum: [401, 403]}
        detail: {type: string}
        errorCode:
          type: string
          enum: [TENANT_AUTHENTICATION_REQUIRED, TENANT_CONTEXT_REQUIRED, TENANT_SCOPE_MISMATCH, TENANT_ROLE_REQUIRED, TENANT_UNAVAILABLE]
        code: {type: string}
        i18nKey: {type: string}
        timestamp: {type: string, format: date-time}
    BillingUsageProblem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, timestamp, traceId, tenantId, errorCode, i18nKey, code]
      properties:
        type: {type: string, format: uri, pattern: '^https://hub-contabil\.com/errors/'}
        title: {type: string, const: Falha na operação de faturamento}
        status: {type: integer, enum: [400, 403, 409, 500]}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
        timestamp: {type: string, format: date-time}
        traceId: {type: string, minLength: 1}
        tenantId: {type: [string, 'null'], format: uuid}
        errorCode:
          type: string
          enum: [BILLING_INVOICE_INVALID_REQUEST, TENANT_CONTEXT_REQUIRED, TENANT_SCOPE_MISMATCH, BILLING_USAGE_INCONSISTENT, BILLING_USAGE_UNAVAILABLE]
        i18nKey: {type: string}
        code: {type: string}
