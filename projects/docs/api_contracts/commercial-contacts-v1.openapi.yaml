    date: 2026-09-10
    compatibility: behavioral-compatible
    changes: Activates listContacts with its approved RBAC and global security boundary.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/v1/admin/commercial/contacts:
    get:
      operationId: listContacts
      summary: List global commercial contacts
      description: >-
        Access is limited to ROLE_COMMERCIAL or ROLE_SUPER_ADMIN issued by saas-admin,
        without tenant_id, X-Tenant-ID or impersonation. Dates use America/Recife.
      x-required-roles: [ROLE_COMMERCIAL, ROLE_SUPER_ADMIN]
      x-required-authorities: []
      x-tenant-boundary: {realm: saas-admin, tenantClaim: forbidden, tenantHeader: forbidden, impersonation: forbidden}
      parameters:
        - {name: createdFrom, in: query, required: false, schema: {type: string, format: date}}
        - {name: createdTo, in: query, required: false, schema: {type: string, format: date}}
        - {name: name, in: query, required: false, schema: {type: string, maxLength: 100}}
        - name: plan
          in: query
          required: false
          schema: {type: string, enum: [START, BUSINESS, PREMIUM, NOT_SURE]}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Contact page returned.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommercialContactPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalFailure'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  headers:
    NoStore:
      description: Sensitive responses must not be stored.
      schema: {type: string, const: no-store}
  responses:
    BadRequest:
      description: Invalid filters or pagination.
      content: {application/json: {schema: {$ref: '#/components/schemas/ApplicationError'}}}
    Unauthorized:
      description: Missing or invalid authentication.
      headers:
        WWW-Authenticate: {description: Bearer challenge., schema: {type: string, const: Bearer}}
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content: {application/json: {schema: {$ref: '#/components/schemas/SecurityError'}}}
    Forbidden:
      description: Principal does not satisfy role or global boundary.
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/SecurityError'}}}
    InternalFailure:
      description: Sanitized internal failure.
      content: {application/json: {schema: {$ref: '#/components/schemas/ApplicationError'}}}
  schemas:
    CommercialContactPage:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages]
      properties:
        content: {type: array, items: {$ref: '#/components/schemas/CommercialContactSummary'}}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        totalElements: {type: integer, format: int64, minimum: 0}
        totalPages: {type: integer, minimum: 0}
    CommercialContactSummary:
      type: object
      additionalProperties: false
      required: [id, name, email, phone, plan, office, status, createdAt, notificationStatus]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 2, maxLength: 100}
        email: {type: string, format: email, maxLength: 160}
        phone: {type: string, pattern: '^\\d{10,11}$'}
        plan: {type: string, enum: [START, BUSINESS, PREMIUM, NOT_SURE]}
        office: {type: string, minLength: 2, maxLength: 140}
        status: {type: string, enum: [NEW, CONTACTED, PENDING]}
        createdAt: {type: string, format: date-time}
        notificationStatus: {type: string, enum: [NOT_CONFIGURED, PENDING, SENT, FAILED]}
    SecurityError:
      type: object
      additionalProperties: false
      required: [error, message, status, timestamp, path]
      properties:
        error: {type: string, enum: [UNAUTHORIZED, ACCESS_DENIED]}
        message: {type: string}
        status: {type: integer, enum: [401, 403]}
        timestamp: {type: string, format: date-time}
        path: {type: string}
    ApplicationError:
      type: object
      additionalProperties: true
      required: [message]
      properties:
        message: {type: string}
        errorId: {type: string, format: uuid}
        errors: {type: array, items: {type: string}}
