  documentId: COMMERCIAL-CONTACTS-V1
  primaryNature: Contrato
  owner: Produto Comercial, Segurança, Backend e Arquitetura
  status: Active
  date: 2026-09-10
  lastReviewed: 2026-09-10
  normativeBaseline: PRD-00007 v1.0; REQ-00055 v3.1; UC-00052 v2.8; TP-00055 v1.1
  relatedFiles:
    - docs/product/prds/PRD-00007-commercial-contacts-operational-access.md
    - docs/product/requirements/REQ-00055-commercial-contact-capture-management.md
    - docs/product/use-cases/UC-00052-super-admin-commercial-contact-management.md
