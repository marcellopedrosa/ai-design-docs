version: 2
questions:
  project-name:
    label: Nome do projeto
    description: Nome legível; o manifesto usa um identificador normalizado.
    type: string
    required: true
    target: project.name
  project-type:
    label: Tipo predominante do projeto
    description: Escolha o formato que melhor representa a entrega.
    type: choice
    required: true
    options:
      - application
      - service
      - library
      - infrastructure
      - mobile
      - other
    target: project.type
  project-owner:
    label: Owner ou equipe responsável
    description: Responsável humano pela documentação e pelas decisões do projeto.
    type: string
    required: true
    target: metadata.owner
  project-profiles:
    label: Contextos que o docs precisa cobrir
    description: Selecione um ou mais profiles; agents são derivados automaticamente.
    type: multi-choice
    required: true
    options:
      - base
      - frontend
      - backend
      - mobile
      - security
    option_descriptions:
      base: Governança e qualidade comuns a qualquer projeto
      frontend: Interface web e experiência visual
      backend: Serviços, APIs e lógica de servidor
      mobile: Aplicativo móvel
      security: Controles adicionais de segurança da aplicação
    target: profiles
  confirm-manifest:
    label: Confirmar este manifesto
    description: Grava o manifesto e marca o questionário como concluído.
    type: confirmation
    required: true
  confirm-import-plan:
    label: Apply the proposed import plan?
    description: Autoriza a cópia de conteúdo do projeto legado.
    type: confirmation
    required: true
    onlyWhen: legacy-import
