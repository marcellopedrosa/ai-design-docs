name: harness
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Harness doctor
        run: node harness/tooling/harness-doctor/index.mjs
      - name: Adapters em paridade
        run: node harness/tooling/adapters/sync-adapters.mjs --check
      - name: Runner de evals H1
        run: node harness/tooling/eval-runner/index.mjs
      - name: Testes tooling
        run: node --test harness/tooling/harness-doctor/harness-doctor.test.mjs harness/tooling/adapters/sync-adapters.test.mjs harness/tooling/contracts/validator.test.mjs harness/tooling/hooks/hooks.test.mjs harness/tooling/eval-runner/eval-runner.test.mjs harness/tooling/harness.test.mjs harness/tooling/harness-integrity.test.mjs harness/tooling/contracts/trace.test.mjs
      - name: Testes de validadores
        run: node --test harness/tooling/validators/*.test.mjs
      - name: Governança documental
        run: node harness/tooling/validators/validate-documentation-governance.mjs --root .
      - name: Política de qualidade
        run: node harness/tooling/validators/validate-quality-policy.mjs
