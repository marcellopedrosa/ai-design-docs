schema_version: 1
harness_version: "2.0.0"

project:
  id: "python-service"
  name: "Serviço Backend Python"
  description: "Perfil de referência para microsserviços e APIs Python com FastAPI ou Flask"

runtimes:
  - codex
  - claude-code
  - gemini-cli
  - antigravity

capabilities:
  git_delivery: false

standards:
  baseline:
    - software-engineering-lifecycle
    - implementation-readiness-standard
    - software-quality-standard
    - development-standard
    - security-standard
  activated:
    - application-security-standard
    - api-security-standard

quality:
  commands:
    test: "pytest"
    lint: "flake8"
    coverage: "pytest --cov=src"

security:
  validators:
    - "bandit -r src/"
    - "safety check"

paths:
  backend:
    - "backend/"
  docs:
    - "docs/"
